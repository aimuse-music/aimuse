<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="AIで制作された楽曲だけを集めた音楽配信サービス"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>AIMUSE</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0912">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single-column phone shell (max 520px, centered on PC) · sticky screen header · mini player + fixed bottom nav */
:root{
  color-scheme: dark;
  --bg:#0b0912;
  --surface:#15121f;
  --surface2:#1e1a2c;
  --line:#2c2742;
  --fg:#f2eefb;
  --muted:#9d95b8;
  --faint:#6b6488;
  --violet:#a463ff;
  --indigo:#6b6cff;
  --grad:linear-gradient(120deg,#b46bff 0%,#7c5cff 45%,#5a72ff 100%);
  --glow:rgba(140,100,255,.35);
  --ok:#3fd49a; --warn:#f6bd55; --bad:#ff5f7e;
  --f-display:"Unbounded","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left,0px));
  --gr:max(16px, env(safe-area-inset-right,0px));
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  --nav-h:62px;
  --mini-h:64px;
  background:var(--bg);
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:8px}
input,select,textarea{font:inherit;color:var(--fg)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.app{max-width:520px;margin:0 auto;min-height:100%;position:relative}
.screen{padding-left:var(--gl);padding-right:var(--gr);padding-block:0 calc(var(--nav-h) + var(--mini-h) + var(--sb) + 28px);animation:enter .32s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* header */
.top{position:sticky;top:var(--st);z-index:20;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:12px var(--gr) 10px var(--gl);background:linear-gradient(var(--bg) 70%,rgba(11,9,18,0));display:flex;align-items:center;gap:12px;min-height:56px}
.logo{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-sub{font-family:var(--f-display);font-size:9px;letter-spacing:.32em;color:var(--faint);font-weight:500}
.top h1{font-size:24px;font-weight:900;letter-spacing:.02em}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--fg);flex:none}
.icon-btn:active{background:var(--surface2)}
.spacer{flex:1}

.demo-note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);font-size:12.5px;line-height:1.55}
.demo-note b{color:var(--fg);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:1.5}
.tag.suno{color:#ffb4e0;border-color:rgba(255,140,210,.35)}
.tag.udio{color:#9fd0ff;border-color:rgba(120,190,255,.35)}
.tag.other{color:#d9cfff;border-color:rgba(200,180,255,.3)}
.tag.demo{color:var(--warn);border-color:rgba(246,189,85,.4)}
.tag.ok{color:var(--ok);border-color:rgba(63,212,154,.4)}
.tag.bad{color:var(--bad);border-color:rgba(255,95,126,.4)}

/* sections */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:19px;font-weight:900;letter-spacing:.02em}
.sec-h .en{font-family:var(--f-display);font-size:9.5px;letter-spacing:.28em;color:var(--faint);font-weight:500;display:block;margin-bottom:2px}
.link{font-size:12.5px;color:var(--muted)}
.hrow{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:2px var(--gr) 6px var(--gl);scroll-padding-left:var(--gl);scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hrow>*{scroll-snap-align:start;flex:none}

/* cover */
.cover{position:relative;overflow:hidden;aspect-ratio:1/1;width:100%;max-width:100%;background-size:cover;background-position:center;flex:none;isolation:isolate}
.cover svg{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.9}
.cover .cv-t{position:absolute;left:10%;bottom:9%;right:10%;font-family:var(--f-display);font-weight:700;color:rgba(255,255,255,.92);font-size:clamp(10px,6cqi,26px);line-height:1.15;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.35);z-index:2}
.cover-wrap{container-type:inline-size}

/* hero (featured) */
.hero{width:min(78vw,330px);display:flex;flex-direction:column;gap:10px;text-align:left}
.hero .cover{border-radius:20px;box-shadow:0 18px 40px -18px var(--glow)}
.hero-meta{display:flex;justify-content:space-between;gap:10px;align-items:center}
.hero-meta .t{font-weight:700;font-size:16px;line-height:1.35}
.hero-meta .a{color:var(--muted);font-size:13px}
.play-fab{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 8px 18px -6px var(--glow)}

.card{width:142px;display:flex;flex-direction:column;gap:8px;text-align:left}
.card .cover{border-radius:14px}
.card .t{font-weight:700;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .a{color:var(--muted);font-size:12px;margin-top:-6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* song row */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;text-align:left;width:100%}
.row.norank{grid-template-columns:52px minmax(0,1fr) auto}
.row .cover{border-radius:10px;width:52px}
.row .rank{font-family:var(--f-display);font-weight:700;font-size:15px;width:24px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.row .rank.top{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.row .t{font-weight:700;font-size:14.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .t{color:#c9a8ff}
.row .sub{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;min-width:0}
.row .sub span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{display:flex;align-items:center;gap:2px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:11.5px}
.heart-on{color:#ff6fae}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:2px var(--gr) 4px var(--gl)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}

.artist{width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.artist .cover{border-radius:50%;width:96px}
.artist .n{font-size:12.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.artist .f{font-size:11px;color:var(--muted);margin-top:-6px}

/* search */
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px;width:100%}
.searchbox input{flex:1;background:none;border:0;outline:none;font-size:16px;min-width:0}
.searchbox input::placeholder{color:var(--faint)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 6px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface2);color:var(--fg);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.label{font-size:11.5px;color:var(--faint);letter-spacing:.08em;font-weight:700;margin:14px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;height:88px;border-radius:14px;overflow:hidden;padding:12px;text-align:left;font-weight:900;font-size:16px;display:flex;align-items:flex-start}
.tile small{position:absolute;right:12px;bottom:10px;font-family:var(--f-mono);font-size:11px;font-weight:500;opacity:.8}
.empty{padding:36px 8px;text-align:center;color:var(--muted);font-size:14px}

/* forms */
.form{display:flex;flex-direction:column;gap:18px;margin-top:6px}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>.fl{font-size:13px;font-weight:700}
.field .req{color:var(--bad);font-size:11px;margin-left:4px}
.input{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;width:100%;outline:none}
.input:focus{border-color:var(--violet)}
textarea.input{min-height:130px;resize:vertical;line-height:1.7}
.err{color:var(--bad);font-size:12px}
.pick{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.pick .ic{width:46px;height:46px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none;overflow:hidden;background-size:cover;background-position:center}
.pick .tx{min-width:0;flex:1}
.pick .tx b{display:block;font-size:14px}
.pick .tx span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.checks{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:6px 4px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px;text-align:left;width:100%;font-size:13.5px;line-height:1.55}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;margin-top:1px;transition:.15s}
.check.on .box{background:var(--grad);border-color:transparent}
.btn{height:50px;border-radius:14px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--grad);box-shadow:0 10px 24px -10px var(--glow)}
.btn.primary:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:var(--surface2);border:1px solid var(--line)}
.btn.sm{height:38px;font-size:13px;border-radius:11px;width:auto;padding:0 14px}
.btn.danger{background:rgba(255,95,126,.12);color:var(--bad);border:1px solid rgba(255,95,126,.35)}
.btn.okb{background:rgba(63,212,154,.12);color:var(--ok);border:1px solid rgba(63,212,154,.35)}
.btn-row{display:flex;gap:10px}
.btn-row>*{flex:1}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px 12px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.steps{display:flex;gap:6px;margin:4px 0 4px}
.steps i{height:3px;flex:1;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--grad)}

/* my page */
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0 4px}
.avatar{width:92px;height:92px;border-radius:50%;padding:3px;background:var(--grad)}
.avatar>div{width:100%;height:100%;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-top:14px}
.stat{padding:12px 4px;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:22px}
.tabs button{padding:10px 0;font-size:14px;color:var(--muted);font-weight:500;position:relative}
.tabs button.on{color:var(--fg);font-weight:700}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad);border-radius:2px}
.admin-entry{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(164,99,255,.14),rgba(90,114,255,.08));text-align:left;width:100%}

/* profile edit（v1.6） */
.pbanner{margin:6px 0 0;aspect-ratio:3/1;border-radius:16px;background:var(--surface2) center/cover no-repeat;border:1px solid var(--line)}
.profile.with-banner,.ahead.with-banner{margin-top:-46px;position:relative}
.ahead.with-banner .cover-wrap{width:120px}
.profile .btn.sm{margin-top:2px}
.a-ic{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--surface2) center/cover no-repeat;vertical-align:-3px;margin-right:6px}
.pe-preview{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:10px 10px 16px}
.pe-preview .pbanner{margin:0}
.pe-img{display:flex;align-items:center;gap:12px}
.pe-thumb{width:64px;height:64px;border-radius:12px;background:var(--surface2) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--faint);flex:none}
.pe-thumb.round{border-radius:50%}
.pe-thumb:not(.round){width:120px;height:40px}
.pe-links{display:flex;gap:16px;flex-wrap:wrap}
.pe-links .link{text-decoration:underline;text-underline-offset:3px}
select.input{appearance:none;-webkit-appearance:none}
.crop-scrim{align-items:flex-end;z-index:90}
.crop-sheet{align-items:center;gap:14px}
.crop-sheet h3{align-self:flex-start}
.crop-stage{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#000;border-radius:14px;cursor:grab}
.crop-stage img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none;-webkit-user-drag:none}
.crop-mask{position:absolute;inset:0;pointer-events:none;border:2px solid rgba(255,255,255,.85);border-radius:14px}
.crop-stage.round .crop-mask{border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55)}
.crop-zoom{width:min(100%,320px);accent-color:var(--violet)}
.crop-sheet .btn-row{width:100%}

/* follow lists（v1.7） */
button.stat{font:inherit;color:inherit;background:none;border:0;cursor:pointer;width:100%}
.stat.tap span{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.fstats button{color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);padding:4px 0}
.fl-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fl-row{display:flex;gap:10px}
.fl-main{display:flex;align-items:center;gap:12px;min-width:0;flex:1;text-align:left}
.fl-main:disabled{opacity:.55;cursor:default}
.fl-main .cover-wrap{width:48px;flex:none}
.fl-main .cover{width:48px}
.follow.sm{padding:6px 14px;font-size:12.5px;flex:none;white-space:nowrap}
.fl-listeners{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:12.5px;line-height:1.55;margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.fl-listeners svg{flex:none;margin-top:1px}
.fl-listeners .link{text-decoration:underline;text-underline-offset:3px;color:var(--fg);font-size:12.5px;margin-left:4px}
.fl-breakdown{margin:0 0 10px}

/* onboarding（第3段階） */
.welcome{position:relative;margin-top:14px;padding:18px 16px 16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(164,99,255,.16),rgba(90,114,255,.08)),var(--surface);display:flex;flex-direction:column;gap:8px}
.welcome h2{font-size:19px;font-weight:900;padding-right:34px}
.welcome .welcome-lead{font-size:15px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.welcome p{font-size:13.5px;line-height:1.7;color:var(--fg)}
.welcome .welcome-sub{color:var(--muted);font-size:12.5px}
.welcome .btn-row{margin-top:6px}
.welcome-x{position:absolute;top:8px;right:8px}
.guide-lead{font-size:14px;line-height:1.8;color:var(--muted);margin-top:4px}
.guide{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.guide-step{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.guide-ic{width:40px;height:40px;border-radius:12px;margin:0;flex:none}
.guide-step h2{font-size:15.5px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.guide-step p{font-size:13.5px;line-height:1.75;color:var(--muted);margin-top:4px}

/* legal pages（利用規約・プライバシーポリシー・投稿ガイドライン） */
.legal-links{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:18px}
.legal-links .link{text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.legal{font-size:14.5px;line-height:1.85;overflow-wrap:anywhere}
.legal-title{font-size:20px;font-weight:900;margin-top:20px;letter-spacing:.02em}
.legal-meta{margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.7}
.legal section{margin-top:26px}
.legal h3{font-size:15.5px;font-weight:700;margin-bottom:8px;line-height:1.5}
.legal p{margin-bottom:10px}
.legal ul{margin:0 0 10px;padding-left:1.3em}
.legal li{margin-bottom:6px}
.legal li::marker{color:var(--faint)}
.legal mark.todo{background:rgba(246,189,85,.14);color:var(--warn);border-radius:4px;padding:0 3px}

/* artist page */
.ahead{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:4px}
.ahead .cover{width:150px;border-radius:50%;box-shadow:0 18px 40px -16px var(--glow)}
.ahead h2{font-size:24px;font-weight:900}
.follow{padding:8px 22px;border-radius:999px;border:1px solid var(--fg);font-weight:700;font-size:13.5px}
.follow.on{background:var(--fg);color:var(--bg)}

/* admin */
.panel{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px}
.panel-h{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.panel-h .cover{border-radius:10px;width:56px}
.panel-h b{display:block;font-size:15px;line-height:1.35}
.panel-h span{font-size:12px;color:var(--muted)}
.mini-checks{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.mini-checks div{display:flex;gap:6px;align-items:flex-start}
.reasons{display:flex;flex-wrap:wrap;gap:6px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
/* =========================================================
   AIMUSE Ver.1.0 — 本番版（Supabase + Cloudflare Pages）
   ---------------------------------------------------------
   構成メモ（将来の拡張用）
   - CONFIG ............ アプリ設定。ジャンル・AIツール・権利チェック項目
   - auth .............. 会員ログイン（Supabase Auth）
   - repo .............. 投稿情報の保存窓口（Supabase のテーブル）
   - uploadService ..... 音源・画像の保存窓口（Supabase Storage）
   - 架空のデモデータは持たない。表示・集計はすべて実際の投稿から行う
   ========================================================= */
const {useState,useEffect,useRef,useMemo} = React;
const html = htm.bind(React.createElement);

const CONFIG = {
  version: "0.1",
  locale: "ja",               // 将来: en / ko / zh などに切り替え
  genres: ["J-POP","シティポップ","EDM","ロック","バラード","ローファイ","アニソン風","アンビエント"],
  tools: ["Suno","Udio","その他"],
  rightsChecks: [
    "この楽曲は自分がAIサービスで生成したものです",
    "使用したAIサービスの利用規約で、配信・商用利用が認められた条件で生成しました",
    "第三者の歌詞・メロディ・音源・画像を無断で使用していません",
    "実在の歌手やアーティストの声・名前を無断で模倣していません"
  ],
  adminChecks: ["既存曲との類似チェック済み","ジャケット画像の権利確認済み","歌詞の内容確認済み"],
  rejectReasons: ["権利確認が不十分","既存曲に酷似","不適切な内容","音質・ファイル不備"],
  reportReasons: ["既存曲に酷似している","不適切なジャケット画像","不適切な歌詞","なりすまし・名義の問題"]
};

const genreHue = {"J-POP":330,"シティポップ":285,"EDM":215,"ロック":355,"バラード":260,"ローファイ":190,"アニソン風":305,"アンビエント":235};

/* ===== データ層（本番：Supabase） =====
   - 会員：Supabase Auth（メール＋パスワード）
   - 投稿情報（曲名・審査状態・通報・再生数）：Supabase の tracks / reports テーブル
   - 音源・ジャケット画像：Supabase Storage（audio / covers バケット）。どの端末からでも再生できる
   - お気に入り・フォロー：Supabase の favorites / follows テーブル（ログイン中の会員ごとに保存。RLSで本人の行だけ読み書き可）
   ※ 架空のデータは入れていません。表示はすべて実際に投稿されたデータから集計します */

// 公開バージョン。更新して公開するたびに変える（開きっぱなしの古い画面を自動で最新版に切り替えるため）
const BUILD = "2026-10-17.3";
async function newerBuildAvailable(){
  try{
    const r = await fetch(location.pathname+"?build-check="+Date.now(),{cache:"no-store"});
    if(!r.ok) return false;
    const m = (await r.text()).match(/const BUILD = "([^"]+)"/);
    if(!m || m[1]===BUILD) return false;
    // 同じ版への再読み込みは1回だけ（読み込みが繰り返されるのを防ぐ）
    if(sessionStorage.getItem("aimuse.reloadedFor")===m[1]) return false;
    sessionStorage.setItem("aimuse.reloadedFor",m[1]);
    return true;
  }catch(e){ return false; }
}

// 旧版で端末内（全員共通）に保存していたお気に入り・フォローは使わないので削除する
try{ localStorage.removeItem("aimuse.favs2"); localStorage.removeItem("aimuse.follows2"); }catch(e){}

const isUuid = v => typeof v==="string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
// 同じ行がすでにある（二重タップなど）場合は成功扱い
const okOrDup = r => { if(r.error && r.error.code!=="23505") throw r.error; };
const social = {
  // 必ず「ログイン中の会員ID」で絞り込んで取得する
  async load(uid){
    const [f,w] = await Promise.all([
      sb.from("favorites").select("user_id,track_id").eq("user_id",uid),
      sb.from("follows").select("user_id,artist_id").eq("user_id",uid)
    ]);
    if(f.error) throw f.error;
    if(w.error) throw w.error;
    // 念のため、持ち主がログイン中の会員である行だけを使う
    const mine = rows => rows.filter(r=>r.user_id===uid);
    return { favs:new Set(mine(f.data).map(r=>r.track_id)), follows:new Set(mine(w.data).map(r=>r.artist_id)) };
  },
  async setFav(uid,trackId,on){
    if(on) okOrDup(await sb.from("favorites").insert({user_id:uid,track_id:trackId}));
    else okOrDup(await sb.from("favorites").delete().eq("user_id",uid).eq("track_id",trackId));
  },
  async setFollow(uid,artistId,on){
    if(on) okOrDup(await sb.from("follows").insert({user_id:uid,artist_id:artistId}));
    else okOrDup(await sb.from("follows").delete().eq("user_id",uid).eq("artist_id",artistId));
  },
  // フォロワー数（人数だけ。誰がフォローしているかは取得しない）
  // artist_follower_count はDB側で人数だけを返す関数。follows の行そのもの（誰が誰を）はRLSで本人分しか読めない
  async followerCount(id){
    const {data,error} = await sb.rpc("artist_follower_count",{aid:id});
    if(error) throw error;
    return Number(data)||0;
  },
  async followerCounts(ids){
    const out = new Map();
    await Promise.all(ids.map(async id=>{
      const {data,error} = await sb.rpc("artist_follower_count",{aid:id});
      if(!error) out.set(id,Number(data)||0);
    }));
    return out;
  }
};

const SB_CFG = window.AIMUSE_CONFIG || {};
const sbReady = !!(window.supabase && SB_CFG.supabaseUrl && SB_CFG.supabaseAnonKey && !/^__/.test(SB_CFG.supabaseUrl));
const sb = sbReady ? window.supabase.createClient(SB_CFG.supabaseUrl, SB_CFG.supabaseAnonKey, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}) : null;

/* 音源・画像は非公開バケット。期限付きURL（署名付きURL）を発行して再生・表示する
   - 有効期限1時間。残り15分を切ったものだけ再発行し、それ以外は同じURLを使い回す
   - 発行できるかどうかはStorageのRLSで判定（公開中の曲は誰でも、それ以外は本人と管理者のみ） */
const SIGN_TTL = 3600, SIGN_RENEW_MS = 15*60*1000;
const signedCache = new Map();
const cachedUrl = (bucket,path) => { if(!path) return null; const c=signedCache.get(bucket+":"+path); return c&&c.exp>Date.now()?c.url:null; };
async function signPaths(bucket,paths){
  if(!sb) return;
  const now=Date.now();
  const need=[...new Set(paths.filter(Boolean))].filter(p=>{ const c=signedCache.get(bucket+":"+p); return !c||c.exp-now<SIGN_RENEW_MS; });
  for(let i=0;i<need.length;i+=100){
    const chunk=need.slice(i,i+100);
    try{
      const {data,error} = await sb.storage.from(bucket).createSignedUrls(chunk,SIGN_TTL);
      if(error){ console.warn("sign",bucket,error.message); continue; }
      (data||[]).forEach(d=>{ if(d&&d.signedUrl&&!d.error&&d.path) signedCache.set(bucket+":"+d.path,{url:d.signedUrl,exp:now+SIGN_TTL*1000}); });
    }catch(e){ console.warn("sign",bucket,e); }
  }
}
const signRows = rows => Promise.all([
  signPaths("audio",rows.map(r=>r.audio_path)),
  signPaths("covers",rows.map(r=>r.image_path))
]);
const camelToSnake = k => k.replace(/[A-Z]/g,c=>"_"+c.toLowerCase());
const toRow = patch => { const o={}; Object.keys(patch).forEach(k=>{ if(k!=="id"&&k!=="createdAt"&&k!=="hasImage") o[camelToSnake(k)]=patch[k]; }); return o; };

const trackFromRow = r => ({
  id:r.id, userId:r.user_id, artistId:r.artist_id||null, title:r.title, artist:r.artist, genre:r.genre, tool:r.tool, toolName:r.tool_name,
  audioPath:r.audio_path, audioName:r.audio_name, audioSize:r.audio_size, audioExt:r.audio_ext, duration:r.duration||0,
  imagePath:r.image_path, imageName:r.image_name, hasImage:!!r.image_path,
  lyrics:r.lyrics||[], checks:r.checks||[], status:r.status, rejectReason:r.reject_reason, plays:r.plays||0,
  hues:r.hues||[270,230], pattern:r.pattern??0, submittedAt:r.submitted_at||"", approvedAt:r.approved_at||"", reviewedAt:r.reviewed_at||"",
  createdAt:Date.parse(r.created_at)||0,
  audioUrl:cachedUrl("audio",r.audio_path), imageUrl:cachedUrl("covers",r.image_path)
});
const reportFromRow = r => ({
  id:r.id, songId:r.song_id, reason:r.reason, reporter:r.reporter_name||"会員", at:r.at||"", status:r.status,
  action:r.action, resolvedAt:r.resolved_at, createdAt:Date.parse(r.created_at)||0
});

/* 会員（ログイン状態） */
const auth = {
  user:null, profile:null, ready:false, recovery:false, listeners:new Set(),
  get isAdmin(){ return !!(this.profile&&this.profile.is_admin); },
  emit(){ this.listeners.forEach(f=>f({user:this.user,profile:this.profile,ready:this.ready,recovery:this.recovery})); },
  subscribe(f){ this.listeners.add(f); f({user:this.user,profile:this.profile,ready:this.ready,recovery:this.recovery}); return ()=>this.listeners.delete(f); },
  async loadProfile(){
    if(!sb||!this.user){ this.profile=null; return; }
    let r = await sb.from("profiles").select("id,display_name,is_admin,avatar_path,header_path").eq("id",this.user.id).maybeSingle();
    if(r.error) r = await sb.from("profiles").select("id,display_name,is_admin").eq("id",this.user.id).maybeSingle();   // v1.6 SQL 未実行時
    const data = r.data;
    this.profile = data||{id:this.user.id,display_name:(this.user.email||"").split("@")[0],is_admin:false};
  },
  async init(){
    if(!sb){ this.ready=true; this.emit(); return; }
    const {data} = await sb.auth.getSession();
    this.user = data.session?.user||null;
    await this.loadProfile(); this.ready=true; this.emit();
    sb.auth.onAuthStateChange((event,session)=>{
      if(event==="PASSWORD_RECOVERY") this.recovery=true;
      const prevId=this.user?.id; this.user=session?.user||null;
      // コールバック内で直接 await しない（Supabaseの推奨）
      setTimeout(async()=>{ await this.loadProfile(); this.emit(); if(prevId!==this.user?.id) repo.refresh(); },0);
    });
  },
  signIn:(email,password)=>sb.auth.signInWithPassword({email,password}),
  signUp:(email,password,name)=>sb.auth.signUp({email,password,options:{data:{display_name:name||undefined},emailRedirectTo:location.origin+location.pathname}}),
  resetPassword:(email)=>sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}),
  async updatePassword(password){ const r=await sb.auth.updateUser({password}); if(!r.error){ this.recovery=false; this.emit(); } return r; },
  signOut:()=>sb.auth.signOut()
};

const deniedError = () => Object.assign(new Error("denied"),{denied:true});
const repo = {
  mode:"pending", loadedAt:0,
  tracks:new Map(), reports:new Map(), listeners:new Set(),
  emit(){ const t=[...this.tracks.values()], r=[...this.reports.values()]; this.listeners.forEach(f=>f(t,r,this.mode)); },
  subscribe(f){ this.listeners.add(f); f([...this.tracks.values()],[...this.reports.values()],this.mode); return ()=>this.listeners.delete(f); },
  async init(){
    if(!sb){ this.mode="unconfigured"; this.emit(); return; }
    await this.refresh();
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") this.refresh(); });
    // 期限付きURLを切らさないよう、表示中は10分ごとに更新
    setInterval(()=>{ if(document.visibilityState==="visible") this.refresh(); },10*60*1000);
  },
  async refresh(){
    if(!sb) return;
    const t = await sb.from("tracks").select("*").order("created_at",{ascending:false});
    if(t.error){ console.warn("tracks",t.error.message); this.mode=this.mode==="cloud"?"cloud":"error"; this.emit(); return; }
    await signRows(t.data);
    this.tracks.clear(); t.data.forEach(r=>this.tracks.set(r.id,trackFromRow(r)));
    this.reports.clear();
    if(auth.isAdmin){
      const r = await sb.from("reports").select("*").order("created_at",{ascending:false});
      if(!r.error) r.data.forEach(x=>this.reports.set(x.id,reportFromRow(x)));
    }
    this.mode="cloud"; this.loadedAt=Date.now(); this.emit();
  },
  mapOf(col){ return col==="tracks"?this.tracks:this.reports; },
  async insertTrack(row){
    const {data,error} = await sb.from("tracks").insert(row).select("*").single();
    if(error) throw error;
    await signRows([data]);
    this.tracks.set(data.id,trackFromRow(data)); this.emit(); return data;
  },
  async insertReport(row){
    const {error} = await sb.from("reports").insert(row);
    if(error) throw error;
    if(auth.isAdmin) this.refresh();
  },
  async put(col,id,patch){
    const map=this.mapOf(col); const before=map.get(id);
    if(before){ map.set(id,{...before,...patch}); this.emit(); }
    // 変更できた行を返してもらい、0件なら「権限がない／対象がない」として扱う
    // （Supabaseは権限で弾いた更新をエラーにせず「0件更新」として返すため）
    const {data,error} = await sb.from(col).update(toRow(patch)).eq("id",id).select("id");
    const err = error || (!data||data.length===0 ? deniedError() : null);
    if(err){ if(before){ map.set(id,before); this.emit(); } throw err; }
  },
  async remove(col,id){
    const map=this.mapOf(col); const before=map.get(id);
    map.delete(id); this.emit();
    const {data,error} = await sb.from(col).delete().eq("id",id).select("id");
    const err = error || (!data||data.length===0 ? deniedError() : null);
    if(err){ if(before){ map.set(id,before); this.emit(); } throw err; }
  },
  async incPlays(id){
    const t=this.tracks.get(id); if(t){ this.tracks.set(id,{...t,plays:(t.plays||0)+1}); this.emit(); }
    await sb.rpc("increment_plays",{tid:id});
  },
  // 再生時間が未登録の曲：画面表示用には誰でも反映。データベースへの保存は投稿者本人か管理者のときだけ
  async setDuration(id,d,persist){
    const t=this.tracks.get(id); if(t){ this.tracks.set(id,{...t,duration:d}); this.emit(); }
    if(persist) await sb.rpc("set_duration_if_missing",{tid:id,d});
  },
  async removeFiles(t){
    if(t&&t.audioPath) await sb.storage.from("audio").remove([t.audioPath]);
    if(t&&t.imagePath) await sb.storage.from("covers").remove([t.imagePath]);
  }
};

/* ---------- generated cover art (no external images) ---------- */
function Pattern({p,seed}){
  const w = "rgba(255,255,255,.55)";
  if(p===0) return html`<g fill="none" stroke=${w} strokeWidth=".6">${[8,15,22,29,36,43,50].map(r=>html`<circle key=${r} cx="72" cy="30" r=${r} opacity=${1-r/60}/>`)}</g>`;
  if(p===1){
    const lines=[]; for(let k=0;k<9;k++){let d="M0 "+(40+k*6); for(let x=0;x<=100;x+=5){d+=` L${x} ${40+k*6+Math.sin((x+seed*7+k*9)/9)*(3+k*.6)}`} lines.push(html`<path key=${k} d=${d} fill="none" stroke=${w} strokeWidth=".5" opacity=${.25+k*.07}/>`);} return html`<g>${lines}</g>`;
  }
  if(p===2){
    const dots=[]; for(let y=8;y<100;y+=10) for(let x=8;x<100;x+=10){const r=.6+((x*y+seed)%7)/5; dots.push(html`<circle key=${x+"-"+y} cx=${x} cy=${y} r=${r} fill=${w} opacity=${.15+((x+y+seed)%5)/8}/>`);} return html`<g>${dots}</g>`;
  }
  if(p===3) return html`<g><defs><radialGradient id=${"o"+seed}><stop offset="0" stopColor="#fff" stopOpacity=".85"/><stop offset=".5" stopColor="#fff" stopOpacity=".18"/><stop offset="1" stopColor="#fff" stopOpacity="0"/></radialGradient></defs><circle cx="50" cy="46" r="30" fill=${`url(#o${seed})`}/><line x1="0" y1="62" x2="100" y2="62" stroke=${w} strokeWidth=".4"/><line x1="0" y1="68" x2="100" y2="68" stroke=${w} strokeWidth=".3" opacity=".6"/><line x1="0" y1="76" x2="100" y2="76" stroke=${w} strokeWidth=".25" opacity=".4"/></g>`;
  return html`<g stroke=${w} strokeWidth=".5" opacity=".7">${Array.from({length:14},(_,i)=>html`<line key=${i} x1=${-20+i*10} y1="100" x2=${20+i*10} y2="0"/>`)}<rect x="22" y="22" width="56" height="56" fill="none" strokeWidth=".8" transform="rotate(12 50 50)"/></g>`;
}
function Cover({item,title,radius,style}){
  const [h1,h2] = item.hues||[270,230];
  const seed = (item.id||"x").split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  const bg = item.imageUrl ? `center/cover no-repeat url(${item.imageUrl})` :
    `radial-gradient(120% 90% at 85% 10%, hsl(${h1} 85% 62% / .55), transparent 55%), linear-gradient(150deg, hsl(${h1} 70% 42%), hsl(${h2} 72% 16%))`;
  return html`<div className="cover-wrap" style=${style}><div className="cover" style=${{background:bg,borderRadius:radius}}>
    ${!item.imageUrl && html`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><${Pattern} p=${item.pattern??0} seed=${seed}/></svg>`}
    ${title && !item.imageUrl && html`<span className="cv-t">${title}</span>`}
  </div></div>`;
}

/* ---------- SEARCH ---------- */
function Search({ctx}){
  const {songs,artists,artistOf,play,favs,toggleFav,openArtist,current,playing} = ctx;
  const [q,setQ] = useState("");
  const [mode,setMode] = useState("all");
  const [genre,setGenre] = useState(null);
  const [tool,setTool] = useState(null);
  const query = q.trim().toLowerCase();
  const active = query || genre || tool;
  const songHits = songs.filter(s=>{
    if(genre && s.genre!==genre) return false;
    if(tool && s.tool!==tool) return false;
    if(!query) return true;
    const a = artistOf(s).name.toLowerCase();
    if(mode==="song") return s.title.toLowerCase().includes(query);
    if(mode==="artist") return a.includes(query);
    return s.title.toLowerCase().includes(query)||a.includes(query)||s.genre.toLowerCase().includes(query)||s.tool.toLowerCase().includes(query);
  });
  const artistHits = mode==="song" ? [] : artists.filter(a=>{
    const has = songs.some(s=>s.artistId===a.id && (!genre||s.genre===genre) && (!tool||s.tool===tool));
    return has && (!query || a.name.toLowerCase().includes(query));
  });
  // 画面に表示する曲（アーティスト検索では曲一覧を出さず、1アーティスト＝1件）。件数は表示する分だけを数える
  const shownSongs = mode==="artist" ? [] : songHits;
  const total = shownSongs.length + artistHits.length;
  const clear = () => {setQ("");setGenre(null);setTool(null)};
  return html`<div className="screen">
    <header className="top"><h1>検索</h1></header>
    <label className="searchbox"><${Icon} n="search" size=${20} style=${{color:"var(--faint)"}}/>
      <input id="q" type="search" value=${q} onInput=${e=>setQ(e.target.value)} placeholder="曲名・アーティスト・ジャンル" enterKeyHint="search" autoComplete="off"/>
      ${q&&html`<button aria-label="クリア" onClick=${()=>setQ("")}><${Icon} n="x" size=${18}/></button>`}
    </label>
    <div className="seg" style=${{marginTop:12}}>
      ${[["all","すべて"],["song","曲名"],["artist","アーティスト"]].map(([k,l])=>html`<button key=${k} className=${mode===k?"on":""} onClick=${()=>setMode(k)}>${l}</button>`)}
    </div>
    <div className="label">AI制作ツール</div>
    <div className="chips">${CONFIG.tools.map(t=>html`<button key=${t} className=${"chip"+(tool===t?" on":"")} onClick=${()=>setTool(tool===t?null:t)}>${t}</button>`)}</div>
    <div className="label">ジャンル</div>
    <div className="chips">${CONFIG.genres.map(g=>html`<button key=${g} className=${"chip"+(genre===g?" on":"")} onClick=${()=>setGenre(genre===g?null:g)}>${g}</button>`)}</div>

    ${!active ? html`<section className="sec">
      <${SecHead} en="BROWSE" title="ジャンルから探す"/>
      <div className="tiles">${CONFIG.genres.map(g=>{const hh=genreHue[g]; return html`<button key=${g} className="tile" onClick=${()=>setGenre(g)} style=${{background:`linear-gradient(135deg,hsl(${hh} 65% 45%),hsl(${hh-40} 70% 20%))`}}>${g}<small>${songs.filter(s=>s.genre===g).length}曲</small></button>`})}</div>
    </section>` : html`<section className="sec">
      <div className="sec-h"><div><span className="en">RESULTS</span><h2>${total}件の結果</h2></div><button className="link" onClick=${clear}>条件をクリア</button></div>
      ${artistHits.length>0 && html`<div className="hrow" style=${{marginBottom:10}}>${artistHits.map(a=>html`<button key=${a.id} className="artist" onClick=${()=>openArtist(a.id)}><${Cover} item=${a} radius="50%"/><div className="n">${a.name}</div><div className="f">アーティスト</div></button>`)}</div>`}
      ${shownSongs.length>0 ? html`<div className="list">${shownSongs.map(s=>html`<${SongRow} key=${s.id} song=${s} artist=${artistOf(s)} cur=${current?.id===s.id} playing=${playing} fav=${favs.has(s.id)} onPlay=${()=>play(s,shownSongs)} onFav=${()=>toggleFav(s.id)}/>`)}</div>` : null}
      ${total===0 && html`<div className="empty">「${q||genre||tool}」に一致する楽曲は見つかりませんでした。<br/>別のキーワードやジャンルで試してください。</div>`}
    </section>`}
  </div>`;
}

/* ---------- UPLOAD ---------- */
/* ファイル選択まわり
   - 選んだファイルは確認画面までは URL.createObjectURL で試聴・プレビューし、申請時に Supabase Storage へ保存する
   - サーバー保存（将来）：uploadService.uploadToServer を Cloudflare R2 の署名付きURLへの PUT に置き換える */
const UPLOAD_RULES = {
  audio:{exts:["mp3","wav","m4a"],mimes:["audio/mpeg","audio/mp3","audio/wav","audio/x-wav","audio/wave","audio/vnd.wave","audio/mp4","audio/x-m4a","audio/m4a","audio/aac"],maxMB:50,label:"MP3・WAV・M4A"},
  image:{exts:["jpg","jpeg","png","heic","heif"],mimes:["image/jpeg","image/jpg","image/png","image/heic","image/heif"],maxMB:15,label:"JPG・PNG・HEIC"}
};
const AUDIO_ACCEPT = ".mp3,.wav,.m4a,audio/mpeg,audio/wav,audio/x-wav,audio/mp4,audio/x-m4a";
const IMAGE_FILE_ACCEPT = ".jpg,.jpeg,.png,.heic,.heif,image/jpeg,image/png,image/heic,image/heif";
const fmtSize = b => b>=1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";
const extOf = name => { const m=/\.([^.]+)$/.exec(name||""); return m?m[1].toLowerCase():""; };

const uploadService = {
  mode:"supabase",
  check(kind,file){
    const r=UPLOAD_RULES[kind]; const ext=extOf(file.name); const type=(file.type||"").toLowerCase();
    const okExt=r.exts.includes(ext); const okMime=r.mimes.includes(type);
    if(!okExt && !okMime) return `対応していない形式です（${ext?"."+ext:type||"形式不明"}）。${r.label}のファイルを選んでください。`;
    if(file.size===0) return "ファイルが空です（0バイト）。iCloud Driveのファイルはダウンロード完了後にもう一度選んでください。";
    if(file.size>r.maxMB*1048576) return `ファイルサイズが大きすぎます（${fmtSize(file.size)}）。${r.maxMB}MB以下のファイルを選んでください。`;
    return null;
  },
  prepareLocal(file){ return {file,name:file.name,size:file.size,type:file.type,ext:extOf(file.name)||(file.type.split("/")[1]||""),url:URL.createObjectURL(file),storage:"local"}; },
  release(item){ try{ if(item&&item.url) URL.revokeObjectURL(item.url); }catch(e){} },
  contentType(kind,item){
    const t=(item.type||"").toLowerCase(); if(UPLOAD_RULES[kind].mimes.includes(t)) return t;
    return ({mp3:"audio/mpeg",wav:"audio/wav",m4a:"audio/mp4",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",heic:"image/heic",heif:"image/heif"})[item.ext]||"application/octet-stream";
  },
  // Supabase Storage に保存し、保存先パスを返す（パス：会員ID/楽曲ID.拡張子）
  async uploadToServer(kind,userId,trackId,item){
    const bucket = kind==="audio"?"audio":"covers";
    const type = this.contentType(kind,item);
    const fromType = ({"audio/mpeg":"mp3","audio/mp3":"mp3","audio/wav":"wav","audio/x-wav":"wav","audio/wave":"wav","audio/vnd.wave":"wav","audio/mp4":"m4a","audio/x-m4a":"m4a","audio/m4a":"m4a","audio/aac":"m4a","image/jpeg":"jpg","image/jpg":"jpg","image/png":"png","image/heic":"heic","image/heif":"heif"})[type];
    const ext = UPLOAD_RULES[kind].exts.includes(item.ext) ? item.ext : (fromType||"bin");
    const path = `${userId}/${trackId}.${ext}`;
    const {error} = await sb.storage.from(bucket).upload(path,item.file,{contentType:type,upsert:false,cacheControl:"3600"});
    if(error) throw error;
    return path;
  }
};

function useDrop(onFile){
  const [over,setOver]=useState(false);
  return [over,{
    onDragOver:e=>{e.preventDefault();setOver(true)},
    onDragLeave:()=>setOver(false),
    onDrop:e=>{e.preventDefault();setOver(false);const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)onFile(f)}
  }];
}

function AudioPicker({value,error,onPick,onClear,onMeta}){
  const ref=useRef(null);
  const [playErr,setPlayErr]=useState(false);
  const open=()=>ref.current&&ref.current.click();
  const change=e=>{const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f){setPlayErr(false);onPick(f);}};
  const [over,dropProps]=useDrop(f=>{setPlayErr(false);onPick(f)});
  return html`<div className="field">
    <span className="fl">音源ファイル<span className="req">必須</span></span>
    <input ref=${ref} id="f-audio" type="file" accept=${AUDIO_ACCEPT} className="vh" onChange=${change} tabIndex="-1" aria-hidden="true"/>
    ${!value ? html`<button className=${"drop"+(over?" over":"")+(error?" bad":"")} onClick=${open} ...${dropProps}>
        <span className="drop-ic"><${Icon} n="music" size=${26}/></span>
        <b>「ファイル」から音源を選ぶ</b>
        <span>iCloud Drive・このiPhone内・ダウンロードから選べます</span>
        <span className="fmt">${UPLOAD_RULES.audio.label} · ${UPLOAD_RULES.audio.maxMB}MBまで</span>
      </button>`
    : html`<div className="fcard">
        <div className="fcard-h">
          <span className="fthumb"><${Icon} n="music" size=${22}/></span>
          <div style=${{minWidth:0}}><div className="fname">${value.name}</div>
            <div className="fmeta mono">${value.ext.toUpperCase()} · ${fmtSize(value.size)}${value.duration?" · "+fmtTime(value.duration):""}</div></div>
        </div>
        <audio controls playsInline preload="metadata" src=${value.url} style=${{width:"100%"}}
          onLoadedMetadata=${e=>{const d=e.target.duration; if(isFinite(d)) onMeta({duration:Math.round(d)})}}
          onError=${()=>setPlayErr(true)}></audio>
        ${playErr && html`<div className="warn-line"><${Icon} n="info" size=${15}/><span>このブラウザでは試聴できない形式の可能性があります。投稿の申請はできます。</span></div>`}
        <div className="fcard-f"><span className="tag local">未投稿</span><span className="spacer"></span>
          <button className="btn sm ghost" onClick=${open}>変更</button>
          <button className="btn sm danger" onClick=${onClear}>削除</button></div>
      </div>`}
    ${error && html`<span className="err" role="alert">${error}</span>`}
  </div>`;
}

    : html`<div className="fcard">
        <div className="img-row">

  </div>`;

function Upload({ctx}){
  const {submit,setTab,repoMode,user,isAdmin} = ctx;
  const empty = {title:"",artist:"",genre:"",tool:"Suno",toolOther:"",lyrics:"",audio:null,image:null,checks:CONFIG.rightsChecks.map(()=>false)};
  const [f,setF] = useState(empty);
  const [step,setStep] = useState("form");
  const [errs,setErrs] = useState({});
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const submitted = useRef(false);
  const [sending,setSending] = useState(false);

  const pickFile = (kind,file) => {
    const msg = uploadService.check(kind,file);
    if(msg){ setErrs(e=>({...e,[kind]:msg})); return; }
    setErrs(e=>({...e,[kind]:null}));
    setF(p=>{ uploadService.release(p[kind]); return {...p,[kind]:uploadService.prepareLocal(file)}; });
  };
  const clearFile = kind => setF(p=>{ uploadService.release(p[kind]); return {...p,[kind]:null}; });
  const metaAudio = m => setF(p=>p.audio?{...p,audio:{...p.audio,...m}}:p);

  const validate = () => {
    const e={};
    if(!f.title.trim()) e.title="曲名を入力してください";
    if(!f.artist.trim()) e.artist="アーティスト名を入力してください";
    if(!f.genre) e.genre="ジャンルを選択してください";
    if(f.tool==="その他"&&!f.toolOther.trim()) e.tool="使用したサービス名を入力してください";
    if(!f.audio) e.audio="音源ファイルを選択してください";
    if(f.checks.some(c=>!c)) e.checks="すべての項目を確認してチェックしてください";
    setErrs(e); return Object.keys(e).length===0;
  };
  const toConfirm = () => { if(validate()){ setStep("confirm"); window.scrollTo(0,0);} else setTimeout(()=>{const el=document.querySelector(".err");el&&el.scrollIntoView({block:"center",behavior:"smooth"})},30); };
  const send = async () => { if(sending) return; setSending(true); const ok = await submit(f); setSending(false); if(!ok) return; submitted.current=true; setStep("done"); window.scrollTo(0,0); };
  const restart = () => { submitted.current=false; setF(empty); setErrs({}); setStep("form"); };
  const steps = {form:1,confirm:2,done:3}[step];

  if(!user) return html`<div className="screen">
    <header className="top"><h1>楽曲を投稿</h1></header>
    <div className="demo-note"><${Icon} n="info" size=${18}/><span>楽曲の投稿にはログインが必要です。会員登録は無料です。</span></div>
    <${AuthPanel} ctx=${ctx}/>
  </div>`;

  return html`<div className="screen">
    <header className="top">
      ${step==="confirm"&&html`<button className="icon-btn" aria-label="入力に戻る" onClick=${()=>setStep("form")}><${Icon} n="back"/></button>`}
      <h1>${step==="form"?"楽曲を投稿":step==="confirm"?"内容の確認":"申請完了"}</h1>
    </header>
    <div className="steps">${[1,2,3].map(i=>html`<i key=${i} className=${i<=steps?"on":""}></i>`)}</div>
    <div style=${{fontSize:12,color:"var(--muted)"}}>1 入力 → 2 確認 → 3 審査へ申請</div>

    ${step==="form" && html`<div className="form">
      <div className="demo-note"><${Icon} n="info" size=${18}/><span><b>保存について：</b>曲名・音源・ジャケット画像は、申請時にAIMUSEのサーバーに保存されます。審査で承認されると、どの端末からでも再生できるようになります。</span></div>
      <div className="field"><label htmlFor="f-title">曲名<span className="req">必須</span></label>
        <input id="f-title" className="input" value=${f.title} onInput=${e=>set("title",e.target.value)} placeholder="例：真夜中のシグナル" maxLength="60"/>${errs.title&&html`<span className="err">${errs.title}</span>`}</div>
      <div className="field"><label htmlFor="f-artist">アーティスト名<span className="req">必須</span></label>
        <input id="f-artist" className="input" value=${f.artist} onInput=${e=>set("artist",e.target.value)} placeholder="活動名を入力" maxLength="40"/>${errs.artist&&html`<span className="err">${errs.artist}</span>`}</div>
      <div className="field"><label htmlFor="f-genre">ジャンル<span className="req">必須</span></label>
        <select id="f-genre" className="input" value=${f.genre} onChange=${e=>set("genre",e.target.value)}><option value="">選択してください</option>${CONFIG.genres.map(g=>html`<option key=${g} value=${g}>${g}</option>`)}</select>${errs.genre&&html`<span className="err">${errs.genre}</span>`}</div>
      <div className="field"><span className="fl">使用したAIサービス<span className="req">必須</span></span>
        <div className="seg">${CONFIG.tools.map(t=>html`<button key=${t} className=${f.tool===t?"on":""} onClick=${()=>set("tool",t)}>${t}</button>`)}</div>
        ${f.tool==="その他"&&html`<input id="f-toolother" className="input" value=${f.toolOther} onInput=${e=>set("toolOther",e.target.value)} placeholder="サービス名（例：Stable Audio）"/>`}
        ${errs.tool&&html`<span className="err">${errs.tool}</span>`}</div>
      <${AudioPicker} value=${f.audio} error=${errs.audio} onPick=${file=>pickFile("audio",file)} onClear=${()=>clearFile("audio")} onMeta=${metaAudio}/>
      <${ImagePicker} value=${f.image} error=${errs.image} onPick=${file=>pickFile("image",file)} onClear=${()=>clearFile("image")}/>
      <div className="field"><label htmlFor="f-lyrics">歌詞</label>
        <textarea id="f-lyrics" className="input" value=${f.lyrics} onInput=${e=>set("lyrics",e.target.value)} placeholder="1行ずつ入力。インスト曲は空欄で構いません"></textarea></div>
      <div className="field"><span className="fl">権利の確認<span className="req">必須</span></span>
        <div className="checks">${CONFIG.rightsChecks.map((c,i)=>html`<button key=${i} className=${"check"+(f.checks[i]?" on":"")} role="checkbox" aria-checked=${f.checks[i]} onClick=${()=>set("checks",f.checks.map((v,j)=>j===i?!v:v))}>
          <span className="box">${f.checks[i]&&html`<${Icon} n="check" size=${14} sw=${3}/>`}</span><span>${c}</span></button>`)}</div>
        ${errs.checks&&html`<span className="err">${errs.checks}</span>`}</div>
      <button className="btn primary" onClick=${toConfirm}>確認画面へ進む</button>
    </div>`}

    ${step==="confirm" && html`<div className="form">
      <div style=${{display:"grid",gridTemplateColumns:"110px minmax(0,1fr)",gap:14,alignItems:"center"}}>
        <${Cover} item=${{id:"preview",hues:[275,230],pattern:3,imageUrl:f.image?.url}} radius=${14}/>
        <div style=${{minWidth:0}}><div style=${{fontSize:19,fontWeight:900,lineHeight:1.3}}>${f.title}</div><div style=${{color:"var(--muted)",fontSize:14}}>${f.artist}</div><div style=${{display:"flex",gap:6,marginTop:6,flexWrap:"wrap"}}><span className="tag">${f.genre}</span><${ToolTag} tool=${f.tool==="その他"?f.toolOther:f.tool}/></div></div>
      </div>
      <div className="field"><span className="fl">音源の試聴</span><audio controls playsInline preload="metadata" src=${f.audio.url} style=${{width:"100%"}}></audio></div>
      <dl className="kv">
        <dt>音源</dt><dd>${f.audio.name}<br/><span className="mono" style=${{color:"var(--muted)"}}>${f.audio.ext.toUpperCase()} · ${fmtSize(f.audio.size)}${f.audio.duration?" · "+fmtTime(f.audio.duration):""}</span></dd>
        <dt>ジャケット</dt><dd>${f.image?f.image.name:"自動デザイン"}</dd>
        <dt>AIサービス</dt><dd>${f.tool==="その他"?f.toolOther:f.tool}</dd>
        <dt>歌詞</dt><dd style=${{whiteSpace:"pre-wrap"}}>${f.lyrics.trim()||"なし（インスト）"}</dd>
        <dt>権利確認</dt><dd>${CONFIG.rightsChecks.length}項目すべて確認済み</dd>
        <dt>保存先</dt><dd>投稿情報：AIMUSEのデータベース<br/>音源・画像：AIMUSEのサーバー</dd>
      </dl>
      <div className="demo-note"><${Icon} n="shield" size=${18}/><span>申請後、運営による権利・内容の審査を経て公開されます。審査結果はマイページの「投稿曲」で確認できます。</span></div>
      <div className="btn-row"><button className="btn ghost" onClick=${()=>setStep("form")}>修正する</button><button className="btn primary" onClick=${send} disabled=${sending}>${sending?"アップロード中…":"投稿を申請する"}</button></div>
    </div>`}

    ${step==="done" && html`<div className="form" style=${{alignItems:"center",textAlign:"center",paddingTop:24}}>
      <div style=${{width:76,height:76,borderRadius:"50%",background:"var(--grad)",display:"grid",placeItems:"center"}}><${Icon} n="check" size=${36} sw=${2.6}/></div>
      <h2 style=${{fontSize:22,fontWeight:900}}>審査を申請しました</h2>
      <p style=${{color:"var(--muted)",fontSize:14,maxWidth:320}}>「${f.title}」は審査待ちになりました。承認されると新着楽曲に表示されます。音源と画像はAIMUSEのサーバーに保存されました。</p>
      <div className="btn-row" style=${{width:"100%"}}><button className="btn ghost" onClick=${restart}>続けて投稿</button>${isAdmin?html`<button className="btn primary" onClick=${()=>setTab("admin")}>審査画面を見る</button>`:html`<button className="btn primary" onClick=${()=>setTab("me")}>マイページへ</button>`}</div>
    </div>`}
  </div>`;
}

  const [tab,setT] = useState("fav");

    <header className="top"><h1>マイページ</h1></header>

  const statusTag = st => st==="pending"?html`<span className="tag demo">審査待ち</span>`:st==="public"?html`<span className="tag ok">公開中</span>`:st==="hidden"?html`<span className="tag">非公開</span>`:html`<span className="tag bad">却下</span>`;

      <button className="stat tap" onClick=${()=>openFollowList({mine:true,mode:"followers"})}><b>${fmtNum(myFollowers)}</b><span>フォロワー</span></button>
      <div className="stat"><b>${fmtNum(myPublic.reduce((a,s)=>a+s.plays,0))}</b><span>再生数</span></div>
    </div>
    ${isAdmin&&html`<button className="admin-entry" onClick=${()=>setTab("admin")}><${Icon} n="shield"/><div style=${{flex:1}}><b style=${{display:"block",fontSize:14}}>管理者画面</b><span style=${{fontSize:12,color:"var(--muted)"}}>投稿審査・通報対応・楽曲管理</span></div><${Icon} n="chev" size=${18}/></button>`}
    <div className="tabs">${[["fav",`お気に入り ${favSongs.length}`],["mine",`投稿曲 ${mine.length}`],["follow",`フォロー中 ${follows.size}`]].map(([k,l])=>html`<button key=${k} className=${tab===k?"on":""} onClick=${()=>setT(k)}>${l}</button>`)}</div>
    <div style=${{marginTop:8}}>
      ${tab==="fav" && (favSongs.length ? html`<div className="list">${favSongs.map(s=>html`<${SongRow} key=${s.id} song=${s} artist=${artistOf(s)} cur=${current?.id===s.id} playing=${playing} fav=${true} onPlay=${()=>play(s,favSongs)} onFav=${()=>toggleFav(s.id)}/>`)}</div>` : html`<div className="empty">ハートをタップした曲がここに並びます</div>`)}
      ${tab==="mine" && (mine.length ? html`<div className="list">${mine.map(s=>html`<div key=${s.id} className="row norank"><${Cover} item=${s} radius=${10}/><div style=${{minWidth:0}}><div className="t">${s.title}</div><div className="sub"><span className="n">${s.submittedAt}</span></div></div><div className="end">${statusTag(s.status)}</div></div>`)}</div>` : html`<div className="empty">まだ投稿した曲はありません<br/><button className="btn primary sm" style=${{margin:"14px auto 0"}} onClick=${()=>setTab("upload")}>楽曲を投稿する</button></div>`)}

}

/* ---------- ARTIST ---------- */
function Artist({ctx}){
  const {artistId,artists,songs,play,favs,toggleFav,follows,toggleFollow,goBack,current,playing,artistOf,isAdmin,adminResetImage,openFollowList,followVer} = ctx;

  useEffect(()=>{ if(!sb||!isUuid(artistId)) return; let alive=true; followApi.summary(artistId).then(s=>{ if(alive) setFsum(s); }).catch(()=>{}); return ()=>{ alive=false; }; },[artistId,followVer]);

      </div>
      ${a.bio && html`<p style=${{color:"var(--muted)",fontSize:13.5,maxWidth:320,whiteSpace:"pre-wrap",overflowWrap:"anywhere"}}>${a.bio}</p>`}
      <div style=${{display:"flex",gap:10,alignItems:"center"}}>

      <div className="list">${list.map((s,i)=>html`<${SongRow} key=${s.id} song=${s} artist=${a} rank=${i+1} cur=${current?.id===s.id} playing=${playing} fav=${favs.has(s.id)} onPlay=${()=>play(s,list)} onFav=${()=>toggleFav(s.id)}/>`)}</div>
    </section>

/* ---------- 会員ログイン ---------- */
const authError = e => {
  const m=(e&&e.message)||"";
  if(/Invalid login credentials/i.test(m)) return "メールアドレスまたはパスワードが正しくありません";
  if(/Email not confirmed/i.test(m)) return "メールアドレスの確認が完了していません。届いたメールのリンクを開いてください";
  if(/already registered|already been registered/i.test(m)) return "このメールアドレスはすでに登録されています。ログインしてください";
  if(/rate limit/i.test(m)) return "短時間に操作が集中しています。しばらく待ってからお試しください";
  if(/Password should be/i.test(m)) return "パスワードは6文字以上で入力してください";
  return "うまくいきませんでした。通信状態を確認して、もう一度お試しください";
};
// 規約などを読んでから戻ったときに、入力途中の内容（パスワード以外）を復元するための一時保存（メモリ内のみ）
const authDraft = {mode:"login",email:"",name:""};
function AuthPanel({ctx}){
  const {say} = ctx;
  const [mode,setMode] = useState(()=>authDraft.mode);
  const [email,setEmail] = useState(()=>authDraft.email);
  const [pw,setPw] = useState("");
  const [name,setName] = useState(()=>authDraft.name);
  useEffect(()=>{ authDraft.mode=mode==="reset"?"login":mode; authDraft.email=email; authDraft.name=name; },[mode,email,name]);
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState(null);
  const [info,setInfo] = useState(null);
  if(!sb) return html`<div className="empty">サーバーとの接続設定が完了していないため、ログインできません。</div>`;
  const go = async () => {
    setErr(null); setInfo(null);
    const em=email.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ setErr("メールアドレスを正しく入力してください"); return; }
    if(mode!=="reset" && pw.length<6){ setErr("パスワードは6文字以上で入力してください"); return; }
    setBusy(true);
    try{
      if(mode==="login"){ const {error}=await auth.signIn(em,pw); if(error) throw error; Object.assign(authDraft,{mode:"login",email:"",name:""}); say("ログインしました"); }
      else if(mode==="signup"){ const {data,error}=await auth.signUp(em,pw,name.trim()); if(error) throw error;
        if(data.session){ Object.assign(authDraft,{mode:"login",email:"",name:""}); say("会員登録が完了しました"); }
        else { setInfo("確認メールを送信しました。メール内のリンクを開くと登録が完了します。"); setMode("login"); } }
      else { const {error}=await auth.resetPassword(em); if(error) throw error; setInfo("パスワード再設定用のメールを送信しました。メール内のリンクを開いてください。"); setMode("login"); }
    }catch(e){ setErr(authError(e)); }
    setBusy(false);
  };
  return html`<div className="form">
    ${mode!=="reset" && html`<div className="seg">${[["login","ログイン"],["signup","新規登録"]].map(([k,l])=>html`<button key=${k} className=${mode===k?"on":""} onClick=${()=>{setMode(k);setErr(null)}}>${l}</button>`)}</div>`}
    ${mode==="reset" && html`<div style=${{fontSize:15,fontWeight:700}}>パスワードの再設定</div>`}
    ${mode==="signup" && html`<div className="field"><label htmlFor="a-name">表示名<span className="opt-l">任意</span></label>
      <input id="a-name" className="input" value=${name} onInput=${e=>setName(e.target.value)} placeholder="活動名など" maxLength="40" autoComplete="nickname"/></div>`}
    <div className="field"><label htmlFor="a-email">メールアドレス</label>
      <input id="a-email" className="input" type="email" value=${email} onInput=${e=>setEmail(e.target.value)} autoComplete="email" inputMode="email" autoCapitalize="none"/></div>
    ${mode!=="reset" && html`<div className="field"><label htmlFor="a-pw">パスワード</label>
      <input id="a-pw" className="input" type="password" value=${pw} onInput=${e=>setPw(e.target.value)} autoComplete=${mode==="signup"?"new-password":"current-password"} placeholder="6文字以上"/></div>`}
    ${err && html`<span className="err" role="alert">${err}</span>`}
    ${info && html`<div className="demo-note"><${Icon} n="info" size=${18}/><span>${info}</span></div>`}
    <button className="btn primary" onClick=${go} disabled=${busy}>${busy?"処理中…":mode==="login"?"ログイン":mode==="signup"?"会員登録（無料）":"再設定メールを送る"}</button>
    ${mode==="login" && html`<button className="link" onClick=${()=>{setMode("reset");setErr(null)}}>パスワードを忘れた場合</button>`}
    ${mode==="reset" && html`<button className="link" onClick=${()=>{setMode("login");setErr(null)}}>ログインに戻る</button>`}
    <${LegalLinks} openLegal=${ctx.openLegal} openGuide=${ctx.openGuide}/>
  </div>`;
}
function NewPasswordPanel({ctx}){
  const {say} = ctx;
  const [pw,setPw] = useState("");
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState(null);
  const go = async () => {
    if(pw.length<6){ setErr("パスワードは6文字以上で入力してください"); return; }
    setBusy(true); setErr(null);
    const {error} = await auth.updatePassword(pw);
    setBusy(false);
    if(error) setErr(authError(error)); else say("パスワードを変更しました");
  };
  return html`<div className="form">
    <div style=${{fontSize:15,fontWeight:700}}>新しいパスワードを設定</div>
    <div className="field"><label htmlFor="a-newpw">新しいパスワード</label>
      <input id="a-newpw" className="input" type="password" value=${pw} onInput=${e=>setPw(e.target.value)} autoComplete="new-password" placeholder="6文字以上"/></div>
    ${err && html`<span className="err" role="alert">${err}</span>`}
    <button className="btn primary" onClick=${go} disabled=${busy}>${busy?"処理中…":"パスワードを変更する"}</button>
  </div>`;
}

/* ---------- PROFILE（プロフィール編集：v1.6） ----------
   ・アイコン／背景画像は端末内で切り抜き・縮小し、JPEGに変換してから保存（位置情報などの撮影情報は残らない）
   ・保存の順番：新しい画像を保存 → プロフィールに設定（サーバー側で本人・保存済みを確認）→ 成功後に古い画像を削除
     途中で失敗しても、それまでの画像はそのまま残る
   ・表示名は本人と運営だけに表示。他の人に見えるのはアーティスト名・アイコン・背景・自己紹介
   ・v1.6 のSQLが未実行でも、既存機能は従来どおり動く（プロフィールの画像が表示されないだけ） */
const PROFILE_IMAGE = {
  avatar:{label:"アイコン", w:512, h:512, round:true, quality:.9},
  header:{label:"背景画像", w:1500, h:500, round:false, quality:.85}
};
const PROFILE_PHOTO_ACCEPT = "image/*";
const PROFILE_FILE_ACCEPT = ".jpg,.jpeg,.png,.webp,.heic,.heif,image/jpeg,image/png,image/webp,image/heic,image/heif";
const PROFILE_INPUT_MAX_MB = 20;      // 選べる元画像の大きさ（保存するのは縮小後の画像）
const PROFILE_SAVE_MAX = 1900000;     // 保存する画像の上限（保存場所の上限 2MB より少し小さく）
// ランダムなID（HTTPS以外の画面や古い端末では crypto.randomUUID が無いため、同じ形式で作る）
const uuid4 = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
const avatarUrl = p => (p && sb) ? sb.storage.from("avatars").getPublicUrl(p).data.publicUrl : null;
const profileErr = (e,fallback) => { const m=(e&&e.message)||""; return /[ぁ-んァ-ヶ一-龠]/.test(m) ? m.replace(/^.*?ERROR:\s*/,"") : fallback; };

const profileApi = {
  // 公開中のアーティストのアイコン・背景・自己紹介（未ログインでも取得可。SQL未実行でも失敗せず空で返す）
  async artistCards(ids){
    const out = new Map(); if(!sb||!ids.length) return out;
    const [b,r] = await Promise.all([
      sb.from("artists").select("id,bio").in("id",ids),
      sb.rpc("public_artist_profiles",{p_artist_ids:ids})
    ]);
    if(!b.error) b.data.forEach(x=>out.set(x.id,{bio:x.bio||""}));
    if(!r.error) r.data.forEach(x=>{ const o=out.get(x.artist_id)||{bio:""}; o.avatarUrl=avatarUrl(x.avatar_path); o.headerUrl=avatarUrl(x.header_path); out.set(x.artist_id,o); });
    return out;
  },
  async myArtists(uid){
    const {data,error} = await sb.from("artists").select("id,name,bio").eq("user_id",uid).order("created_at",{ascending:true});
    if(error) throw error; return data||[];
  },
  // 本人の「使われていない画像」を片付ける（前回の削除失敗などで残ったもの）
  //  一覧に出るのは、保存場所のルールにより本人の画像だけ
  async cleanup(uid, keep){
    try{
      const {data,error} = await sb.storage.from("avatars").list("",{limit:100});
      if(error||!data) return;
      const stale = data.map(f=>f.name).filter(n=>/^(avatar|header)-/.test(n) && !keep.includes(n));
      if(stale.length) await sb.storage.from("avatars").remove(stale);
    }catch(e){}
  },
  async upload(uid, kind, blob){
    const path = `${kind}-${uuid4()}.jpg`;   // 会員IDを含めない（公開URLから会員IDが分からないように）
    const {error} = await sb.storage.from("avatars").upload(path, blob, {contentType:"image/jpeg", upsert:false, cacheControl:"31536000"});
    if(error) throw error;
    return path;
  },
  async setImage(kind, path){
    const {data,error} = await sb.rpc("set_my_profile_image",{p_kind:kind, p_path:path});
    if(error) throw error; return data||null;   // それまで使っていた画像の場所
  },
  async removeFile(path){ if(!path) return; try{ await sb.storage.from("avatars").remove([path]); }catch(e){} },
  async setDisplayName(uid, name){
    const {data,error} = await sb.from("profiles").update({display_name:name||null}).eq("id",uid).select("id");
    if(error) throw error; if(!data||!data.length) throw deniedError();
  },
  async renameArtist(id, name){
    const {data,error} = await sb.rpc("rename_my_artist",{p_artist:id, p_name:name});
    if(error) throw error; return data;
  },
  async setBio(id, bio){
    const {data,error} = await sb.from("artists").update({bio}).eq("id",id).select("id");
    if(error) throw error; if(!data||!data.length) throw deniedError();
  }
};

// 画像を読み込み、作業用に縮小（最大2048px）した canvas を返す。HEICなど読み込めない形式はエラー
async function loadProfileImage(file){
  const ext = (file.name||"").split(".").pop().toLowerCase();
  const type = (file.type||"").toLowerCase();
  if(!(type.startsWith("image/") || ["jpg","jpeg","png","webp","heic","heif"].includes(ext))) throw new Error("画像ファイル（JPEG・PNG・WebP・HEIC）を選んでください");
  if(type==="image/svg+xml"||ext==="svg"||type==="image/gif"||ext==="gif") throw new Error("この形式の画像は使えません。JPEG・PNG・WebPの画像を選んでください");
  if(!file.size) throw new Error("ファイルが空です。iCloudの写真はダウンロード完了後にもう一度選んでください");
  if(file.size > PROFILE_INPUT_MAX_MB*1048576) throw new Error(`画像が大きすぎます（${PROFILE_INPUT_MAX_MB}MBまで）`);
  const url = URL.createObjectURL(file);
  let src;
  try{
    // <img> で読み込む（多くの端末で写真の向き情報が正しく反映される）
    src = await new Promise((res,rej)=>{ const i=new Image(); i.decoding="async"; i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  }catch(e){
    try{ src = await createImageBitmap(file); }catch(e2){ src=null; }
  }finally{ URL.revokeObjectURL(url); }
  const w = src && (src.naturalWidth||src.width), h = src && (src.naturalHeight||src.height);
  if(!w||!h) throw new Error(/heic|heif/.test(type+ext)
    ? "この端末ではHEIC画像を読み込めませんでした。写真をJPEGで保存し直すか、別の写真を選んでください"
    : "画像を読み込めませんでした。別の画像を選んでください");
  const k = Math.min(1, 2048/Math.max(w,h));
  const c = document.createElement("canvas"); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  if(src.close) src.close();
  return c;
}
const canvasBlob = (c,q) => new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",q));

// 切り抜き画面：ドラッグで位置、2本指（またはスライダー・ホイール）で拡大・縮小
function ProfileCropper({kind, source, onCancel, onDone}){
  const spec = PROFILE_IMAGE[kind];
  const vw = Math.min(window.innerWidth||390, 520);
  const W = spec.round ? Math.min(280, vw-80) : Math.min(480, vw-40);
  const H = Math.round(W*spec.h/spec.w);
  const nw = source.width, nh = source.height;
  const s0 = Math.max(W/nw, H/nh);
  const [view,setView] = useState(()=>({z:1, x:(W-nw*s0)/2, y:(H-nh*s0)/2}));
  const [busy,setBusy] = useState(false);
  const [url,setUrl] = useState(null);
  const ptrs = useRef(new Map()), gesture = useRef(null);
  useEffect(()=>{ let u; source.toBlob(b=>{ if(b){ u=URL.createObjectURL(b); setUrl(u); } },"image/jpeg",.92); return ()=>{ if(u) URL.revokeObjectURL(u); }; },[source]);
  const clamp = v => { const s=s0*v.z; return {z:v.z, x:Math.min(0,Math.max(W-nw*s,v.x)), y:Math.min(0,Math.max(H-nh*s,v.y))}; };
  // (px,py) を中心に拡大率を z に変える
  const zoomAt = (v,z,px,py) => { z=Math.min(4,Math.max(1,z)); const s=s0*v.z, s2=s0*z; return clamp({z, x:px-(px-v.x)*s2/s, y:py-(py-v.y)*s2/s}); };
  const local = e => { const r=e.currentTarget.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  const down = e => { e.currentTarget.setPointerCapture&&e.currentTarget.setPointerCapture(e.pointerId); ptrs.current.set(e.pointerId,local(e)); gesture.current=null; };
  const move = e => {
    if(!ptrs.current.has(e.pointerId)) return;
    const prev = ptrs.current.get(e.pointerId), p = local(e);
    ptrs.current.set(e.pointerId,p);
    const pts = [...ptrs.current.values()];
    if(pts.length>=2){
      const [a,b]=pts, d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const g = gesture.current;
      if(g&&g.d>0) setView(v=>{ const z=zoomAt(v, v.z*d/g.d, mx, my); return clamp({...z, x:z.x+mx-g.mx, y:z.y+my-g.my}); });
      gesture.current={d,mx,my};
    } else {
      setView(v=>clamp({...v, x:v.x+p.x-prev.x, y:v.y+p.y-prev.y}));
    }
  };
  const up = e => { ptrs.current.delete(e.pointerId); gesture.current=null; };
  const wheel = e => { e.preventDefault(); const p=local(e); setView(v=>zoomAt(v, v.z*(e.deltaY<0?1.08:1/1.08), p.x, p.y)); };
  const done = async () => {
    setBusy(true);
    const s=s0*view.z, out=document.createElement("canvas"); out.width=spec.w; out.height=spec.h;
    const ctx2=out.getContext("2d"); ctx2.imageSmoothingQuality="high";
    ctx2.fillStyle="#15121f"; ctx2.fillRect(0,0,spec.w,spec.h);   // 透明部分（PNG）は背景色で塗る
    ctx2.drawImage(source, -view.x/s, -view.y/s, W/s, H/s, 0, 0, spec.w, spec.h);
    let q=spec.quality, blob=await canvasBlob(out,q);
    while(blob && blob.size>PROFILE_SAVE_MAX && q>.5){ q-=.1; blob=await canvasBlob(out,q); }
    setBusy(false);
    if(!blob){ onCancel("画像を作成できませんでした。別の画像でお試しください"); return; }
    onDone({blob, url:URL.createObjectURL(blob)});
  };
  const s=s0*view.z;
  return html`<div className="scrim crop-scrim" role="dialog" aria-modal="true" aria-label=${spec.label+"の範囲を調整"}>
    <div className="sheet crop-sheet" onClick=${e=>e.stopPropagation()}>
      <h3>${spec.label}の範囲を調整</h3>
      <div className=${"crop-stage"+(spec.round?" round":"")} style=${{width:W,height:H}}
        onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up} onWheel=${wheel}>
        ${url && html`<img src=${url} alt="" draggable="false" style=${{width:nw,height:nh,transform:`translate(${view.x}px,${view.y}px) scale(${s})`}}/>`}
        <div className="crop-mask"></div>
      </div>
      <input className="crop-zoom" type="range" min="1" max="4" step="0.01" value=${view.z} aria-label="拡大・縮小"
        onInput=${e=>{ const z=+e.target.value; setView(v=>zoomAt(v,z,W/2,H/2)); }}/>
      <p className="hint" style=${{textAlign:"center"}}>ドラッグで位置を調整・2本指またはスライダーで拡大／縮小</p>
      <div className="btn-row"><button className="btn ghost" onClick=${()=>onCancel()} disabled=${busy}>キャンセル</button><button className="btn primary" onClick=${done} disabled=${busy||!url}>${busy?"処理中…":"この範囲を使う"}</button></div>
    </div>
  </div>`;
}

function ProfileEdit({ctx}){
  const {user,profile,goBack,say,afterProfileSave} = ctx;
  const uid = user&&user.id;
  const curAvatar = avatarUrl(profile&&profile.avatar_path), curHeader = avatarUrl(profile&&profile.header_path);
  // draft：undefined＝変更なし / null＝初期画像に戻す / {blob,url}＝新しい画像
  const [draft,setDraft] = useState({avatar:undefined, header:undefined});
  const [crop,setCrop] = useState(null);           // {kind, source}
  const [name,setName] = useState((profile&&profile.display_name)||"");
  const [arts,setArts] = useState(null);           // 自分のアーティスト一覧
  const [aid,setAid] = useState(null);
  const [aname,setAname] = useState(""), [bio,setBio] = useState("");
  const [busy,setBusy] = useState(false), [errs,setErrs] = useState([]), [loadErr,setLoadErr] = useState(null);
  useEffect(()=>{ if(!uid) return; profileApi.myArtists(uid).then(a=>{ setArts(a); if(a[0]){ setAid(a[0].id); setAname(a[0].name); setBio(a[0].bio||""); } }).catch(()=>{ setArts([]); setLoadErr("アーティスト情報を読み込めませんでした"); }); },[uid]);
  useEffect(()=>()=>{ ["avatar","header"].forEach(k=>{ const d=draft[k]; if(d&&d.url) URL.revokeObjectURL(d.url); }); },[]);
  if(!user) return html`<div className="screen"><header className="top"><button className="icon-btn" aria-label="戻る" onClick=${goBack}><${Icon} n="back"/></button><h1>プロフィールを編集</h1></header><div className="empty">ログインすると編集できます</div></div>`;
  const art = arts && arts.find(a=>a.id===aid);
  const selectArtist = id => { const a=arts.find(x=>x.id===id); setAid(id); setAname(a?a.name:""); setBio(a?(a.bio||""):""); };
  const setD = (k,v) => setDraft(d=>{ const o=d[k]; if(o&&o.url&&o!==v) URL.revokeObjectURL(o.url); return {...d,[k]:v}; });
  const pick = async (kind,file) => { try{ setCrop({kind, source:await loadProfileImage(file)}); }catch(e){ say(e.message); } };
  const nameChanged = (name.trim()) !== ((profile&&profile.display_name)||"");
  const aChanged = art && aname.trim() && aname.trim()!==art.name;
  const bioChanged = art && bio!==(art.bio||"");
  const dirty = draft.avatar!==undefined || draft.header!==undefined || nameChanged || aChanged || bioChanged;
  const tooLong = [...name.trim()].length>40 || [...aname.trim()].length>40 || [...bio].length>500;
  const save = async () => {
    if(busy||!dirty) return;
    if(tooLong){ setErrs(["文字数が上限を超えています"]); return; }
    if(art && !aname.trim()){ setErrs(["アーティスト名を入力してください"]); return; }
    setBusy(true); setErrs([]);
    const fail=[], keep={avatar:profile&&profile.avatar_path, header:profile&&profile.header_path};
    // 1) 画像：使われていない古いファイルを片付けてから、新しい画像を保存→設定→古い画像を削除
    if(draft.avatar||draft.header) await profileApi.cleanup(uid,[keep.avatar,keep.header].filter(Boolean));
    for(const kind of ["avatar","header"]){
      const d = draft[kind]; if(d===undefined) continue;
      const label = PROFILE_IMAGE[kind].label;
      let newPath=null;
      try{
        if(d){ newPath = await profileApi.upload(uid,kind,d.blob); }
        const old = await profileApi.setImage(kind,newPath);
        keep[kind]=newPath;
        if(old && old!==newPath) await profileApi.removeFile(old);   // 失敗しても次回の保存時に片付く
        setD(kind,undefined);
      }catch(e){
        if(newPath) await profileApi.removeFile(newPath);           // 設定できなかった新しい画像は消す（既存の画像はそのまま）
        fail.push(`${label}：${profileErr(e,"保存できませんでした")}`);
      }
    }
    // 2) 表示名（本人と運営だけに表示）
    if(nameChanged){ try{ await profileApi.setDisplayName(uid,name.trim()); }catch(e){ fail.push("表示名："+profileErr(e,"保存できませんでした")); } }
    // 3) アーティスト名（禁止語・なりすまし・回数制限はサーバー側で確認）と自己紹介
    if(aChanged){ try{ const n=await profileApi.renameArtist(art.id,aname.trim()); setArts(a=>a.map(x=>x.id===art.id?{...x,name:n}:x)); setAname(n); }catch(e){ fail.push("アーティスト名："+profileErr(e,"変更できませんでした")); } }
    if(bioChanged){ try{ await profileApi.setBio(art.id,bio); setArts(a=>a.map(x=>x.id===art.id?{...x,bio}:x)); }catch(e){ fail.push("自己紹介："+profileErr(e,"保存できませんでした")); } }
    await afterProfileSave();
    setBusy(false); setErrs(fail);
    say(fail.length ? "一部を保存できませんでした" : "プロフィールを保存しました");
  };
  // プレビュー（他の人のアーティストページでの見え方）
  const pv = {avatar: draft.avatar ? draft.avatar.url : draft.avatar===null ? null : curAvatar,
              header: draft.header ? draft.header.url : draft.header===null ? null : curHeader};
  return html`<div className="screen">
    <header className="top"><button className="icon-btn" aria-label="戻る" onClick=${goBack}><${Icon} n="back"/></button><h1>プロフィールを編集</h1></header>
    <div className="label" style=${{marginTop:4}}>プレビュー（アーティストページでの見え方）</div>
    <div className="pe-preview">
      <${ProfileBanner} url=${pv.header}/>
      <div className=${"ahead"+(pv.header?" with-banner":"")}>
        <${Cover} item=${{id:aid||uid, hues:[270,230], pattern:0, imageUrl:pv.avatar}} radius="50%"/>
        <h2>${art ? (aname.trim()||art.name) : "アーティスト名"}</h2>
        ${art && bio && html`<p style=${{color:"var(--muted)",fontSize:13.5,maxWidth:320,whiteSpace:"pre-wrap"}}>${bio}</p>`}
      </div>
    </div>
    <div className="form" style=${{marginTop:18}}>
      <${ProfileImageField} kind="avatar" current=${curAvatar} draft=${draft.avatar} onPick=${f=>pick("avatar",f)} onReset=${()=>setD("avatar",null)} onUndo=${()=>setD("avatar",undefined)}/>
      <${ProfileImageField} kind="header" current=${curHeader} draft=${draft.header} onPick=${f=>pick("header",f)} onReset=${()=>setD("header",null)} onUndo=${()=>setD("header",undefined)}/>
      <div className="field"><label htmlFor="pe-name">表示名<span className="opt-l">任意</span></label>
        <input id="pe-name" className="input" value=${name} onInput=${e=>setName(e.target.value)} maxLength="40" autoComplete="nickname"/>
        <span className="hint">マイページに表示されます。他の会員には表示されません（あなたと運営のみ）。</span></div>
      ${arts===null ? html`<div className="hint">アーティスト情報を読み込み中…</div>`
        : loadErr ? html`<span className="err">${loadErr}</span>`
