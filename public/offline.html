<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0912">
<title>AIMUSE（オフライン）</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#0b0912;color:#f2eefb;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
  main{min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
       padding:calc(env(safe-area-inset-top,0px) + 24px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px,env(safe-area-inset-left,0px))}
  img{width:88px;height:88px;border-radius:22px}
  h1{font-size:20px;margin:6px 0 0}
  p{margin:0;color:#c3bdd6;font-size:14.5px;line-height:1.7;max-width:320px}
  button{margin-top:10px;height:48px;padding:0 28px;border:0;border-radius:14px;font-size:15px;font-weight:700;color:#fff;
         background:linear-gradient(120deg,#9d3dff 0%,#7654ff 45%,#4863ff 100%)}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>インターネットに接続されていません</h1>
  <p>AIMUSE の曲を聴いたり探したりするには、インターネット接続が必要です。</p>
  <p>Wi-Fi やモバイルデータ通信を確認してから、もう一度お試しください。</p>
  <button type="button" onclick="location.reload()">再読み込み</button>
</main>
<script>window.addEventListener("online",function(){location.reload();});</script>
</body>
</html>
