<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="AIで制作された楽曲だけを集めた音楽配信サービス"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>AIMUSE</title>
<meta name="theme-color" content="#0b0912">
<link rel="icon" href="/icons/favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single-column phone shell (max 520px, centered on PC) · sticky screen header · mini player + fixed bottom nav */
:root{
  color-scheme: dark;
  --bg:#0b0912;
  --surface:#15121f;
  --surface2:#1e1a2c;
  --line:#2c2742;
  --fg:#f2eefb;
  --muted:#9d95b8;
  --faint:#8881a3;   /* 小さな補足文字：どの面の上でも 4.5:1 以上（第4段階の修正で #6b6488 から調整） */
  --violet:#a463ff;
  --indigo:#6b6cff;
  --grad:linear-gradient(120deg,#b46bff 0%,#7c5cff 45%,#5a72ff 100%);
  --btn-grad:linear-gradient(120deg,#9d3dff 0%,#7654ff 45%,#4863ff 100%);   /* 文字をのせる面（ボタン等）：白文字で 4.5:1 以上 */
  --text-grad:linear-gradient(120deg,#b46bff 0%,#9479ff 45%,#7186ff 100%);   /* グラデーションの文字：色付きの面の上でも 4.5:1 以上 */
  --brand-grad:linear-gradient(120deg,#b46bff 0%,#7c5cff 45%,#5a72ff 100%);   /* ロゴ専用：テーマで変えない */
  --glow:rgba(140,100,255,.35);
  --ok:#3fd49a; --warn:#f6bd55; --bad:#ff5f7e;
  --f-display:"Unbounded","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left,0px));
  --gr:max(16px, env(safe-area-inset-right,0px));
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  --nav-h:62px;
  --mini-h:64px;
  background:var(--bg);
}
html,body{background:var(--bg);color:var(--fg)}
/* ホーム画面のアプリ（PWA）：ノッチ・時計の部分に、スクロールした中身が重ならないよう背景色で覆う */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:55;pointer-events:none}
.offline-bar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:70;display:flex;gap:8px;align-items:center;justify-content:center;
  padding:8px var(--gr) 8px var(--gl);background:#3a2a0b;color:#ffe7b3;font-size:12.5px;font-weight:700;line-height:1.5;text-align:center}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:8px}
input,select,textarea{font:inherit;color:var(--fg)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.app{max-width:520px;margin:0 auto;min-height:100%;position:relative}
.screen{padding-left:var(--gl);padding-right:var(--gr);padding-block:0 calc(var(--nav-h) + var(--mini-h) + var(--sb) + 28px);animation:enter .32s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* header */
.top{position:sticky;top:var(--st);z-index:20;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:12px var(--gr) 10px var(--gl);background:linear-gradient(var(--bg) calc(100% - 10px),rgba(var(--bg-rgb,11,9,18),0));display:flex;align-items:center;gap:12px;min-height:56px}
.logo{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.06em;background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-sub{font-family:var(--f-display);font-size:9px;letter-spacing:.32em;color:var(--faint);font-weight:500}
.top h1{font-size:24px;font-weight:900;letter-spacing:.02em}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--fg);flex:none}
.icon-btn:active{background:var(--surface2)}
.spacer{flex:1}

.demo-note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);font-size:12.5px;line-height:1.55}
.demo-note b{color:var(--fg);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:1.5}
.tag.suno{color:#ffb4e0;border-color:rgba(255,140,210,.35)}
.tag.udio{color:#9fd0ff;border-color:rgba(120,190,255,.35)}
.tag.other{color:#d9cfff;border-color:rgba(200,180,255,.3)}
.tag.demo{color:var(--warn);border-color:rgba(246,189,85,.4)}
.tag.ok{color:var(--ok);border-color:rgba(63,212,154,.4)}
.tag.bad{color:var(--bad);border-color:rgba(255,95,126,.4)}

/* sections */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:19px;font-weight:900;letter-spacing:.02em}
.sec-h .en{font-family:var(--f-display);font-size:9.5px;letter-spacing:.28em;color:var(--faint);font-weight:500;display:block;margin-bottom:2px}
.link{font-size:12.5px;color:var(--muted)}
.hrow{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:2px var(--gr) 6px var(--gl);scroll-padding-left:var(--gl);scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hrow>*{scroll-snap-align:start;flex:none}

/* cover */
.cover{position:relative;overflow:hidden;aspect-ratio:1/1;width:100%;max-width:100%;background-size:cover;background-position:center;flex:none;isolation:isolate}
.cover svg{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.9}
.cover .cv-t{position:absolute;left:10%;bottom:9%;right:10%;font-family:var(--f-display);font-weight:700;color:rgba(255,255,255,.92);font-size:clamp(10px,6cqi,26px);line-height:1.15;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.35);z-index:2}
.cover-wrap{container-type:inline-size}

/* hero (featured) */
.hero{width:min(78vw,330px);display:flex;flex-direction:column;gap:10px;text-align:left}
.hero .cover{border-radius:20px;box-shadow:0 18px 40px -18px var(--glow)}
.hero-meta{display:flex;justify-content:space-between;gap:10px;align-items:center}
.hero-meta .t{font-weight:700;font-size:16px;line-height:1.35}
.hero-meta .a{color:var(--muted);font-size:13px}
.play-fab{width:44px;height:44px;border-radius:50%;color:var(--on-btn,#fff);background:var(--btn-grad);display:grid;place-items:center;flex:none;box-shadow:0 8px 18px -6px var(--glow)}

.card{width:142px;display:flex;flex-direction:column;gap:8px;text-align:left}
.card .cover{border-radius:14px}
.card .t{font-weight:700;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .a{color:var(--muted);font-size:12px;margin-top:-6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* song row */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;text-align:left;width:100%}
.row.norank{grid-template-columns:52px minmax(0,1fr) auto}
.row .cover{border-radius:10px;width:52px}
.row .rank{font-family:var(--f-display);font-weight:700;font-size:15px;width:24px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.row .rank.top{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.row .t{font-weight:700;font-size:14.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .t{color:var(--accent-soft,#c9a8ff)}
.row .sub{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;min-width:0}
.row .sub span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{display:flex;align-items:center;gap:2px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:11.5px}
.heart-on{color:#ff6fae}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:2px var(--gr) 4px var(--gl)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}

.artist{width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.artist .cover{border-radius:50%;width:96px}
.artist .n{font-size:12.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.artist .f{font-size:11px;color:var(--muted);margin-top:-6px}

/* search */
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px;width:100%}
.searchbox input{flex:1;background:none;border:0;outline:none;font-size:16px;min-width:0}
.searchbox input::placeholder{color:var(--faint)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 6px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface2);color:var(--fg);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.label{font-size:11.5px;color:var(--faint);letter-spacing:.08em;font-weight:700;margin:14px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;height:88px;border-radius:14px;overflow:hidden;padding:12px;text-align:left;font-weight:900;font-size:16px;display:flex;align-items:flex-start}
.tile small{position:absolute;right:12px;bottom:10px;font-family:var(--f-mono);font-size:11px;font-weight:500;opacity:.8}
.empty{padding:36px 8px;text-align:center;color:var(--muted);font-size:14px}

/* forms */
.form{display:flex;flex-direction:column;gap:18px;margin-top:6px}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>.fl{font-size:13px;font-weight:700}
.field .req{color:var(--bad);font-size:11px;margin-left:4px}
.input{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;width:100%;outline:none}
.input:focus{border-color:var(--violet)}
textarea.input{min-height:130px;resize:vertical;line-height:1.7}
.err{color:var(--bad);font-size:12px}
.pick{display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.pick .ic{width:46px;height:46px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none;overflow:hidden;background-size:cover;background-position:center}
.pick .tx{min-width:0;flex:1}
.pick .tx b{display:block;font-size:14px}
.pick .tx span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.checks{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:6px 4px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px;text-align:left;width:100%;font-size:13.5px;line-height:1.55}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;margin-top:1px;transition:.15s}
.check.on .box{background:var(--btn-grad);border-color:transparent;color:var(--on-btn,#fff)}
.btn{height:50px;border-radius:14px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{color:var(--on-btn,#fff);background:var(--btn-grad);box-shadow:0 10px 24px -10px var(--glow)}
.btn.primary:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:var(--surface2);border:1px solid var(--line)}
.btn.sm{height:38px;font-size:13px;border-radius:11px;width:auto;padding:0 14px}
.btn.danger{background:rgba(255,95,126,.12);color:var(--bad);border:1px solid rgba(255,95,126,.35)}
.btn.okb{background:rgba(63,212,154,.12);color:var(--ok);border:1px solid rgba(63,212,154,.35)}
.btn-row{display:flex;gap:10px}
.btn-row>*{flex:1}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px 12px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.steps{display:flex;gap:6px;margin:4px 0 4px}
.steps i{height:3px;flex:1;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--grad)}

/* my page */
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0 4px}
.avatar{width:92px;height:92px;border-radius:50%;padding:3px;background:var(--grad)}
.avatar>div{width:100%;height:100%;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-top:14px}
.stat{padding:12px 4px;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 0;font-size:14px;color:var(--muted);font-weight:500;position:relative;white-space:nowrap;flex:none}
.tabs button.on{color:var(--fg);font-weight:700}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--grad);border-radius:2px}
.admin-entry{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(var(--accent-rgb,164,99,255),.14),rgba(var(--btn-rgb,90,114,255),.08));text-align:left;width:100%}

/* profile edit（v1.6） */
.pbanner{margin:6px 0 0;aspect-ratio:3/1;border-radius:16px;background:var(--surface2) center/cover no-repeat;border:1px solid var(--line)}
.profile.with-banner,.ahead.with-banner{margin-top:-46px;position:relative}
.ahead.with-banner .cover-wrap{width:120px}
.profile .btn.sm{margin-top:2px}
.a-ic{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--surface2) center/cover no-repeat;vertical-align:-3px;margin-right:6px}
.pe-preview{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:10px 10px 16px}
.pe-preview .pbanner{margin:0}
.pe-img{display:flex;align-items:center;gap:12px}
.pe-thumb{width:64px;height:64px;border-radius:12px;background:var(--surface2) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--faint);flex:none}
.pe-thumb.round{border-radius:50%}
.pe-thumb:not(.round){width:120px;height:40px}
.pe-links{display:flex;gap:16px;flex-wrap:wrap}
.pe-links .link{text-decoration:underline;text-underline-offset:3px}
select.input{appearance:none;-webkit-appearance:none}
.crop-scrim{align-items:flex-end;z-index:90}
.crop-sheet{align-items:center;gap:14px}
.crop-sheet h3{align-self:flex-start}
.crop-stage{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#000;border-radius:14px;cursor:grab}
.crop-stage img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none;-webkit-user-drag:none}
.crop-mask{position:absolute;inset:0;pointer-events:none;border:2px solid rgba(255,255,255,.85);border-radius:14px}
.crop-stage.round .crop-mask{border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55)}
.crop-zoom{width:min(100%,320px);accent-color:var(--violet)}
.crop-sheet .btn-row{width:100%}

/* follow lists（v1.7） */
button.stat{font:inherit;color:inherit;background:none;border:0;cursor:pointer;width:100%}
.stat.tap span{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.fstats button{color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);padding:4px 0}
.fl-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fl-row{display:flex;gap:10px}
.fl-main{display:flex;align-items:center;gap:12px;min-width:0;flex:1;text-align:left}
.fl-main:disabled{opacity:.55;cursor:default}
.fl-main .cover-wrap{width:48px;flex:none}
.fl-main .cover{width:48px}
.follow.sm{padding:6px 14px;font-size:12.5px;flex:none;white-space:nowrap}
.fl-listeners{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:12.5px;line-height:1.55;margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.fl-listeners svg{flex:none;margin-top:1px}
.fl-listeners .link{text-decoration:underline;text-underline-offset:3px;color:var(--fg);font-size:12.5px;margin-left:4px}
.fl-breakdown{margin:0 0 10px}

/* onboarding（第3段階） */
.welcome{position:relative;margin-top:14px;padding:18px 16px 16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(var(--accent-rgb,164,99,255),.16),rgba(var(--btn-rgb,90,114,255),.08)),var(--surface);display:flex;flex-direction:column;gap:8px}
.welcome h2{font-size:19px;font-weight:900;padding-right:34px}
.welcome .welcome-lead{font-size:15px;font-weight:700;background:var(--text-grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.welcome p{font-size:13.5px;line-height:1.7;color:var(--fg)}
.welcome .welcome-sub{color:var(--fg);font-size:12.5px}   /* 色付きの面の上でも 4.5:1 以上を保つ */
.welcome .btn-row{margin-top:6px}
.welcome-x{position:absolute;top:8px;right:8px}
.guide-lead{font-size:14px;line-height:1.8;color:var(--muted);margin-top:4px}
.guide{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.guide-step{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.guide-ic{width:40px;height:40px;border-radius:12px;margin:0;flex:none}
.guide-step h2{font-size:15.5px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.guide-step p{font-size:13.5px;line-height:1.75;color:var(--muted);margin-top:4px}

/* color theme（第4段階） */

/* ---------- THEME（カラーテーマ：第4段階） ----------
   ・テーマは {v:1, preset, accent, bg, button}（色は #rrggbb）。標準テーマは CSS を一切上書きしない＝従来と完全に同じ見た目
   ・それ以外は3色から全体の色を計算し、文字の読みやすさ（コントラスト比）を自動で確保する
       本文の文字：背景に対して 7:1 以上 / 補足・小さな文字：4.5:1 以上 / アクセント（線・アイコン）：3:1 以上 / ボタンの文字：4.5:1 以上
   ・背景は現在「暗い色」のみ対応（ライトモードは将来対応。色の計算は明るい背景にも対応できる作り）
   ・ロゴの色（--brand-grad）はテーマで変わらない */
const THEME_PRESETS = [
  {id:"standard", name:"AIMUSE標準", sub:"パープル×ブラック", accent:"#a463ff", bg:"#0b0912", button:"#7c5cff"},
  {id:"ocean",    name:"オーシャン",  sub:"ブルー×ネイビー",   accent:"#5ab8ff", bg:"#06101e", button:"#2f74ff"},
  {id:"rose",     name:"ローズ",      sub:"ピンク×ブラック",   accent:"#ff7ab6", bg:"#0f090d", button:"#e0458c"},
  {id:"emerald",  name:"エメラルド",  sub:"グリーン×ブラック", accent:"#3fd49a", bg:"#07100c", button:"#16a06c"},
  {id:"gold",     name:"ゴールド",    sub:"ゴールド×ダーク",   accent:"#f2c14e", bg:"#0f0d08", button:"#d9a62e"},
  {id:"mono",     name:"モノクロ",    sub:"ブラック×ホワイト", accent:"#ffffff", bg:"#0a0a0a", button:"#f2f2f2"}
];
const THEME_STANDARD = {v:1, preset:"standard", accent:"#a463ff", bg:"#0b0912", button:"#7c5cff"};
const HEX6 = /^#[0-9a-f]{6}$/i;
const themeValid = t => !!t && typeof t==="object" && t.v===1
  && (THEME_PRESETS.some(p=>p.id===t.preset) || t.preset==="custom")
  && ["accent","bg","button"].every(k=>typeof t[k]==="string" && HEX6.test(t[k]))
  && Object.keys(t).every(k=>["v","preset","accent","bg","button"].includes(k));
const themeOfPreset = id => { const p=THEME_PRESETS.find(x=>x.id===id)||THEME_PRESETS[0]; return {v:1, preset:p.id, accent:p.accent, bg:p.bg, button:p.button}; };
const themeSame = (a,b) => !!a && !!b && ["preset","accent","bg","button"].every(k=>String(a[k]).toLowerCase()===String(b[k]).toLowerCase());

// --- 色の計算（sRGB・WCAG 2.x のコントラスト比）
const hexRgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgbHex = c => "#"+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
const mixHex = (a,b,t) => { const x=hexRgb(a), y=hexRgb(b); return rgbHex(x.map((v,i)=>v+(y[i]-v)*t)); };
const lum = h => { const c=hexRgb(h).map(v=>{ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; };
const contrast = (a,b) => { const x=lum(a), y=lum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); };
// 背景とのコントラストが min 以上になるまで、文字色側を白（暗い背景）／黒（明るい背景）に近づける
const ensureContrast = (fg,bg,min) => { const target = lum(bg)<0.18 ? "#ffffff" : "#000000"; let c=fg;
  for(let t=0; t<=1.0001 && contrast(c,bg)<min; t+=0.05) c=mixHex(fg,target,t); return c; };
const hueShift = (h,deg) => { let [r,g,b]=hexRgb(h).map(v=>v/255); const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2; let hh=0,s=0;
  if(mx!==mn){ const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn); hh = mx===r?(g-b)/d+(g<b?6:0) : mx===g?(b-r)/d+2 : (r-g)/d+4; hh/=6; }
  hh=((hh*360+deg)%360+360)%360/360;
  const f=(p,q,t)=>{ t=(t+1)%1; return t<1/6?p+(q-p)*6*t : t<1/2?q : t<2/3?p+(q-p)*(2/3-t)*6 : p; };
  if(s===0) return rgbHex([l,l,l].map(v=>v*255));
  const q=l<0.5?l*(1+s):l+s-l*s, p=2*l-q; return rgbHex([f(p,q,hh+1/3),f(p,q,hh),f(p,q,hh-1/3)].map(v=>v*255)); };
const BG_MAX_LUM = 0.04;   // 現在は暗い背景のみ（これより明るい色は自動で暗くする）

// テーマ → 画面全体の色（CSSの共通色指定）。notes は自動調整した内容（画面で知らせる）
function themeDerive(t){
  const notes = [];
  let bg = t.bg;
  if(lum(bg) > BG_MAX_LUM){ let k=0; while(lum(bg)>BG_MAX_LUM && k<40){ bg=mixHex(bg,"#000000",0.08); k++; } notes.push("背景は、現在は暗い色のみ対応しています（明るい背景は今後対応予定）。読みやすい暗さに自動で調整しました"); }
  const fg = ensureContrast(mixHex("#f4f2f8", t.accent, 0.04), bg, 7);
  const surface = mixHex(mixHex(bg,"#ffffff",0.045), t.accent, 0.03);
  const surface2 = mixHex(mixHex(bg,"#ffffff",0.085), t.accent, 0.045);
  const line = mixHex(mixHex(bg,"#ffffff",0.14), t.accent, 0.07);
  const muted = ensureContrast(mixHex(fg,bg,0.38), surface, 4.5);
  const faint = ensureContrast(mixHex(fg,bg,0.56), surface2, 4.5);
  let accent = ensureContrast(t.accent, surface, 3);
  if(accent.toLowerCase()!==t.accent.toLowerCase()) notes.push("アクセントカラーを、背景の上で見やすい明るさに自動で調整しました");
  const accentSoft = ensureContrast(mixHex(accent,"#ffffff",0.35), surface, 4.5);
  // ボタン：グラデーションの3色すべてで、ボタンの文字が 4.5:1 以上になるようにする
  let btn = t.button, onBtn = "#ffffff", stops = [];
  for(let k=0; k<30; k++){
    stops = [mixHex(btn,"#ffffff",0.16), btn, hueShift(mixHex(btn,"#000000",0.06),-24)];
    const w = Math.min(...stops.map(s=>contrast("#ffffff",s))), d = Math.min(...stops.map(s=>contrast("#0b0912",s)));
    onBtn = w>=d ? "#ffffff" : "#0b0912";
    if(Math.max(w,d) >= 4.5) break;
    btn = w>=d ? mixHex(btn,"#000000",0.08) : mixHex(btn,"#ffffff",0.08);
  }
  if(btn.toLowerCase()!==t.button.toLowerCase()) notes.push("ボタンの文字が読みやすいよう、ボタンの色の明るさを自動で調整しました");
  const rgb = h => hexRgb(h).join(",");
  return { notes, vars:{
    "--bg":bg, "--surface":surface, "--surface2":surface2, "--line":line, "--fg":fg, "--muted":muted, "--faint":faint,
    "--violet":accent, "--indigo":hueShift(accent,-30), "--accent-soft":accentSoft,
    "--grad":`linear-gradient(120deg,${stops[0]} 0%,${stops[1]} 45%,${stops[2]} 100%)`,
    "--btn-grad":`linear-gradient(120deg,${stops[0]} 0%,${stops[1]} 45%,${stops[2]} 100%)`,
    "--text-grad":`linear-gradient(120deg,${stops.map((c,i)=>ensureContrast(c,mixHex(surface,accent,0.16),4.6)+" "+[0,45,100][i]+"%").join(",")})`,
    "--glow":`rgba(${rgb(btn)},.35)`, "--on-btn":onBtn,
    "--accent-rgb":rgb(accent), "--btn-rgb":rgb(btn), "--bg-rgb":rgb(bg)
  }};
}
const THEME_VARS = ["--bg","--surface","--surface2","--line","--fg","--muted","--faint","--violet","--indigo","--accent-soft","--grad","--btn-grad","--text-grad","--glow","--on-btn","--accent-rgb","--btn-rgb","--bg-rgb"];
// 画面に反映（標準テーマは上書きを外して従来のCSSのまま）
function themeApply(t){
  const root = document.documentElement.style;
  const use = themeValid(t) ? t : THEME_STANDARD;
  THEME_VARS.forEach(k=>root.removeProperty(k));
  let bg = "#0b0912";
  if(!themeSame(use, THEME_STANDARD)){ const d=themeDerive(use); Object.entries(d.vars).forEach(([k,v])=>root.setProperty(k,v)); bg=d.vars["--bg"]; }
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", bg);
}
// 端末内の保存（ゲスト用のテーマ／ログイン中の人のテーマの一時記録）。保存できない環境でも動く
const themeStore = {
  get(k){ try{ const v=JSON.parse(localStorage.getItem(k)); return v; }catch(e){ return null; } },
  set(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  guest(){ const t=this.get("aimuse.theme.guest"); return themeValid(t)?t:THEME_STANDARD; },
  last(){ const x=this.get("aimuse.theme.last"); return x && themeValid(x.theme) ? x : null; }
};
// 起動時：前回この端末で表示していたテーマをすぐに反映（ログイン情報の確認を待つ間のちらつきを防ぐ）
themeApply((themeStore.last()||{}).theme || themeStore.guest());

/* 音源・画像は非公開バケット。期限付きURL（署名付きURL）を発行して再生・表示する
   - 有効期限1時間。残り15分を切ったものだけ再発行し、それ以外は同じURLを使い回す
   - 発行できるかどうかはStorageのRLSで判定（公開中の曲は誰でも、それ以外は本人と管理者のみ） */
const SIGN_TTL = 3600, SIGN_RENEW_MS = 15*60*1000;
const signedCache = new Map();
const cachedUrl = (bucket,path) => { if(!path) return null; const c=signedCache.get(bucket+":"+path); return c&&c.exp>Date.now()?c.url:null; };
async function signPaths(bucket,paths){
  if(!sb) return;
  const now=Date.now();
  const need=[...new Set(paths.filter(Boolean))].filter(p=>{ const c=signedCache.get(bucket+":"+p); return !c||c.exp-now<SIGN_RENEW_MS; });
  for(let i=0;i<need.length;i+=100){
    const chunk=need.slice(i,i+100);
    try{
      const {data,error} = await sb.storage.from(bucket).createSignedUrls(chunk,SIGN_TTL);
      if(error){ console.warn("sign",bucket,error.message); continue; }
      (data||[]).forEach(d=>{ if(d&&d.signedUrl&&!d.error&&d.path) signedCache.set(bucket+":"+d.path,{url:d.signedUrl,exp:now+SIGN_TTL*1000}); });
    }catch(e){ console.warn("sign",bucket,e); }
  }
}

    this.profile = data||{id:this.user.id,display_name:(this.user.email||"").split("@")[0],is_admin:false};
    this.profile.deletion = await accountApi.status();   // 退会手続きの状況（申請していなければ null）
  },
  async init(){
    if(!sb){ this.ready=true; this.emit(); return; }
    // 先に通知を受け取る準備をする（パスワード再設定のリンクの通知「PASSWORD_RECOVERY」は、読み込み直後に1回だけ届くため）
    sb.auth.onAuthStateChange((event,session)=>{
      if(event==="PASSWORD_RECOVERY") this.recovery=true;
      if(!this.ready) return;   // 読み込み中は下の getSession の結果で反映する
      const prevId=this.user?.id; this.user=session?.user||null;
      // コールバック内で直接 await しない（Supabaseの推奨）
      setTimeout(async()=>{ await this.loadProfile(); this.emit(); if(prevId!==this.user?.id) repo.refresh(); },0);
    });
    const {data} = await sb.auth.getSession();
    this.user = data.session?.user||null;
    // 通知を受け取れなかった場合も、再設定のリンクで開いてログイン状態になっていれば入力画面を出す
    if(AUTH_LINK.recovery && this.user) this.recovery=true;
    if(AUTH_LINK.error && !this.user) this.linkError=AUTH_LINK.error;
    await this.loadProfile(); this.ready=true; this.emit();
  },

  signUp:(email,password,name)=>sb.auth.signUp({email,password,options:{data:{display_name:name||undefined},emailRedirectTo:location.origin+location.pathname}}),
  resetPassword:(email)=>sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}),
  async updatePassword(password){ const r=await sb.auth.updateUser({password}); if(!r.error){ this.recovery=false; this.emit(); } return r; },
  signOut:()=>sb.auth.signOut()
};

const deniedError = () => Object.assign(new Error("denied"),{denied:true});
const repo = {
  mode:"pending", loadedAt:0,
  tracks:new Map(), reports:new Map(), listeners:new Set(),
  emit(){ const t=[...this.tracks.values()], r=[...this.reports.values()]; this.listeners.forEach(f=>f(t,r,this.mode)); },
  subscribe(f){ this.listeners.add(f); f([...this.tracks.values()],[...this.reports.values()],this.mode); return ()=>this.listeners.delete(f); },
  async init(){
    if(!sb){ this.mode="unconfigured"; this.emit(); return; }
    await this.refresh();
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") this.refresh(); });
    // 期限付きURLを切らさないよう、表示中は10分ごとに更新
    setInterval(()=>{ if(document.visibilityState==="visible") this.refresh(); },10*60*1000);
  },
  async refresh(){
    if(!sb) return;
    const t = await sb.from("tracks").select("*").order("created_at",{ascending:false});
    if(t.error){ console.warn("tracks",t.error.message); this.mode=this.mode==="cloud"?"cloud":"error"; this.emit(); return; }
    await signRows(t.data);
    this.tracks.clear(); t.data.forEach(r=>this.tracks.set(r.id,trackFromRow(r)));
    this.reports.clear();
    if(auth.isAdmin){
      const r = await sb.from("reports").select("*").order("created_at",{ascending:false});
      if(!r.error) r.data.forEach(x=>this.reports.set(x.id,reportFromRow(x)));
    }
    this.mode="cloud"; this.loadedAt=Date.now(); this.emit();
  },
  mapOf(col){ return col==="tracks"?this.tracks:this.reports; },
  async insertTrack(row){
    const {data,error} = await sb.from("tracks").insert(row).select("*").single();
    if(error) throw error;
    await signRows([data]);
    this.tracks.set(data.id,trackFromRow(data)); this.emit(); return data;
  },
  async insertReport(row){
    const {error} = await sb.from("reports").insert(row);
    if(error) throw error;
    if(auth.isAdmin) this.refresh();
  },
  async put(col,id,patch){
    const map=this.mapOf(col); const before=map.get(id);
    if(before){ map.set(id,{...before,...patch}); this.emit(); }
    // 変更できた行を返してもらい、0件なら「権限がない／対象がない」として扱う
    // （Supabaseは権限で弾いた更新をエラーにせず「0件更新」として返すため）
    const {data,error} = await sb.from(col).update(toRow(patch)).eq("id",id).select("id");
    const err = error || (!data||data.length===0 ? deniedError() : null);
    if(err){ if(before){ map.set(id,before); this.emit(); } throw err; }
  },
  async remove(col,id){
    const map=this.mapOf(col); const before=map.get(id);
    map.delete(id); this.emit();
    const {data,error} = await sb.from(col).delete().eq("id",id).select("id");
    const err = error || (!data||data.length===0 ? deniedError() : null);
    if(err){ if(before){ map.set(id,before); this.emit(); } throw err; }
  },
  async incPlays(id){
    const t=this.tracks.get(id); if(t){ this.tracks.set(id,{...t,plays:(t.plays||0)+1}); this.emit(); }
    await sb.rpc("increment_plays",{tid:id});
  },
  // 再生時間が未登録の曲：画面表示用には誰でも反映。データベースへの保存は投稿者本人か管理者のときだけ
  async setDuration(id,d,persist){
    const t=this.tracks.get(id); if(t){ this.tracks.set(id,{...t,duration:d}); this.emit(); }
    if(persist) await sb.rpc("set_duration_if_missing",{tid:id,d});
  },
  // 歌詞の同期：曲ごとに1回読み込んで保持（再生のたびに読み直さない）。v1.14 が未適用でも歌詞は全文表示できる
  syncCache:new Map(),
  async loadSync(id,force){
    if(!sb||!id) return null;
    if(!force && this.syncCache.has(id)) return this.syncCache.get(id);
    const {data,error} = await sb.rpc("lyrics_sync_get",{p_track:id});
    if(error){ console.warn("lyrics_sync",error.message); return null; }
    const r = Array.isArray(data) ? data[0] : data;
    const v = r && Array.isArray(r.lines) ? {lines:r.lines.filter(x=>x&&isFinite(x.t)).map(x=>({i:x.i,t:+x.t,...(x.e!=null?{e:+x.e}:{})})),stale:!!r.stale,source:r.source||"manual",updatedAt:r.updated_at||null} : {lines:[],stale:false,source:null,updatedAt:null};
    this.syncCache.set(id,v); return v;
  },
  async saveSync(id,lines){
    const {error} = await sb.rpc("lyrics_sync_save",{p_track:id,p_lines:lines});
    if(error) throw error;
    const v = {lines:lines.map(x=>({...x})),stale:false,source:"manual",updatedAt:new Date().toISOString()};
    this.syncCache.set(id,v); return v;
  },
  // 歌詞の自動同期（AI・v1.15）。v1.15 が未適用なら null を返し、画面は今までどおり手動の同期だけになる
  async alignStatus(id){
    const {data,error} = await sb.rpc("lyrics_align_status",{p_track:id});
    if(error){ if(!/function|schema cache/i.test(error.message||"")) console.warn("lyrics_align",error.message); return null; }
    return data||null;
  },
  async alignMyStates(){
    const {data,error} = await sb.rpc("lyrics_align_my_states");
    if(error) return {};
    const m={}; (data||[]).forEach(x=>{ m[x.track_id]=x; }); return m;
  },
  async alignApply(id,lines){
    const {data,error} = await sb.rpc("lyrics_align_apply",{p_track:id,p_lines:lines});
    if(error) throw error;
    const v = {lines:lines.map(x=>({...x})),stale:false,source:(data&&data.source)||"auto",updatedAt:new Date().toISOString()};
    this.syncCache.set(id,v); return data||{};
  },
  async alignRequest(id){ const {data,error} = await sb.rpc("lyrics_align_request",{p_track:id}); if(error) throw error; return data||{}; },
  async alignDismiss(id){ const {error} = await sb.rpc("lyrics_align_dismiss",{p_track:id}); if(error) throw error; },
  async removeFiles(t){
    if(t&&t.audioPath) await sb.storage.from("audio").remove([t.audioPath]);
    if(t&&t.imagePath) await sb.storage.from("covers").remove([t.imagePath]);
  }
};

const fmtTime = s => { s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
/* ---------- 歌詞の同期（v1.14）----------
   ・各行の歌い出しの時刻（秒）を保存し、再生中は音源の現在の時刻から「歌い出しを過ぎた最後の行」を表示する
     （再生速度・一時停止・シーク・途中からの再生でもずれが溜まらない）
   ・最初の行の歌い出しより前（イントロ）と、歌い終わり e の後（間奏・終わり）は、どの行も表示しない
   ・見出し（行全体が [ ] か【 】で囲まれた行。Suno の [Verse 1] など）は区切りとして表示し、時刻は付けない
   ・同期の時刻が無い曲・歌詞が変わって要確認の曲は、歌詞を全文表示するだけ（推測では光らせない） */
const LYRIC_HEAD = /^\s*(\[[^\]]*\]|【[^】]*】)\s*$/;
const lyricKind = l => (l==null || !String(l).trim()) ? "gap" : LYRIC_HEAD.test(l) ? "head" : "text";
const headLabel = l => String(l).trim().replace(/^[\[【]\s*/,"").replace(/\s*[\]】]$/,"");
const LYRIC_LEAD = 0.15;   // 文字が目に入るまでの遅れの分だけ、少し早めに表示する（秒）
// lines：[{i,t,e?}]（i の小さい順・t は前の行以上）→ いま表示する歌詞の行番号（無ければ -1）
const syncActive = (lines,time) => {
  if(!lines||!lines.length||!isFinite(time)) return -1;
  const x = time + LYRIC_LEAD;
  let lo=0, hi=lines.length-1, k=-1;
  while(lo<=hi){ const m=(lo+hi)>>1; if(lines[m].t<=x){ k=m; lo=m+1; } else hi=m-1; }
  if(k<0) return -1;
  const s = lines[k];
  return (s.e!=null && x>=s.e) ? -1 : s.i;
};
const fmtClock = s => { if(s==null||!isFinite(s)) return "--:--.-"; s=Math.max(0,s); const m=Math.floor(s/60), r=s-m*60; return m+":"+(r<10?"0":"")+r.toFixed(1); };

const fmtNum = n => n>=10000 ? (n/10000).toFixed(n>=100000?0:1).replace(/\.0$/,"")+"万" : n.toLocaleString("ja-JP");

function Pattern({p,seed}){
  const w = "rgba(255,255,255,.55)";
  if(p===0) return html`<g fill="none" stroke=${w} strokeWidth=".6">${[8,15,22,29,36,43,50].map(r=>html`<circle key=${r} cx="72" cy="30" r=${r} opacity=${1-r/60}/>`)}</g>`;
  if(p===1){
    const lines=[]; for(let k=0;k<9;k++){let d="M0 "+(40+k*6); for(let x=0;x<=100;x+=5){d+=` L${x} ${40+k*6+Math.sin((x+seed*7+k*9)/9)*(3+k*.6)}`} lines.push(html`<path key=${k} d=${d} fill="none" stroke=${w} strokeWidth=".5" opacity=${.25+k*.07}/>`);} return html`<g>${lines}</g>`;
  }
  if(p===2){
    const dots=[]; for(let y=8;y<100;y+=10) for(let x=8;x<100;x+=10){const r=.6+((x*y+seed)%7)/5; dots.push(html`<circle key=${x+"-"+y} cx=${x} cy=${y} r=${r} fill=${w} opacity=${.15+((x+y+seed)%5)/8}/>`);} return html`<g>${dots}</g>`;
  }
  if(p===3) return html`<g><defs><radialGradient id=${"o"+seed}><stop offset="0" stopColor="#fff" stopOpacity=".85"/><stop offset=".5" stopColor="#fff" stopOpacity=".18"/><stop offset="1" stopColor="#fff" stopOpacity="0"/></radialGradient></defs><circle cx="50" cy="46" r="30" fill=${`url(#o${seed})`}/><line x1="0" y1="62" x2="100" y2="62" stroke=${w} strokeWidth=".4"/><line x1="0" y1="68" x2="100" y2="68" stroke=${w} strokeWidth=".3" opacity=".6"/><line x1="0" y1="76" x2="100" y2="76" stroke=${w} strokeWidth=".25" opacity=".4"/></g>`;
  return html`<g stroke=${w} strokeWidth=".5" opacity=".7">${Array.from({length:14},(_,i)=>html`<line key=${i} x1=${-20+i*10} y1="100" x2=${20+i*10} y2="0"/>`)}<rect x="22" y="22" width="56" height="56" fill="none" strokeWidth=".8" transform="rotate(12 50 50)"/></g>`;
}
function Cover({item,title,radius,style}){
  const [h1,h2] = item.hues||[270,230];
  const seed = (item.id||"x").split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  const bg = item.imageUrl ? `center/cover no-repeat url(${item.imageUrl})` :
    `radial-gradient(120% 90% at 85% 10%, hsl(${h1} 85% 62% / .55), transparent 55%), linear-gradient(150deg, hsl(${h1} 70% 42%), hsl(${h2} 72% 16%))`;
  return html`<div className="cover-wrap" style=${style}><div className="cover" style=${{background:bg,borderRadius:radius}}>
    ${!item.imageUrl && html`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><${Pattern} p=${item.pattern??0} seed=${seed}/></svg>`}
    ${title && !item.imageUrl && html`<span className="cv-t">${title}</span>`}
  </div></div>`;
}

function Search({ctx}){
  const {songs,artists,artistOf,play,favs,toggleFav,openArtist,current,playing} = ctx;
  const [q,setQ] = useState("");
  const [mode,setMode] = useState("all");
  const [genre,setGenre] = useState(null);
  const [tool,setTool] = useState(null);
  const query = q.trim().toLowerCase();
  const active = query || genre || tool;
  const songHits = songs.filter(s=>{
    if(genre && s.genre!==genre) return false;
    if(tool && s.tool!==tool) return false;
    if(!query) return true;
    const a = artistOf(s).name.toLowerCase();
    if(mode==="song") return s.title.toLowerCase().includes(query);
    if(mode==="artist") return a.includes(query);
    return s.title.toLowerCase().includes(query)||a.includes(query)||s.genre.toLowerCase().includes(query)||s.tool.toLowerCase().includes(query);
  });
  const artistHits = mode==="song" ? [] : artists.filter(a=>{
    const has = songs.some(s=>s.artistId===a.id && (!genre||s.genre===genre) && (!tool||s.tool===tool));

  });
  // 画面に表示する曲（アーティスト検索では曲一覧を出さず、1アーティスト＝1件）。件数は表示する分だけを数える
  const shownSongs = mode==="artist" ? [] : songHits;
  const total = shownSongs.length + artistHits.length;
  const clear = () => {setQ("");setGenre(null);setTool(null)};
  return html`<div className="screen">
    <header className="top"><h1>検索</h1></header>
    <label className="searchbox"><${Icon} n="search" size=${20} style=${{color:"var(--faint)"}}/>

    <div className="label">ジャンル</div>

    ${!active ? html`<section className="sec">
      <${SecHead} en="BROWSE" title="ジャンルから探す"/>
      <div className="tiles">${CONFIG.genres.map(g=>{const hh=genreHue[g]; return html`<button key=${g} className="tile" onClick=${()=>setGenre(g)} style=${{background:`linear-gradient(135deg,hsl(${hh} 65% 45%),hsl(${hh-40} 70% 20%))`}}>${g}<small>${songs.filter(s=>s.genre===g).length}曲</small></button>`})}</div>
    </section>` : html`<section className="sec">
      <div className="sec-h"><div><span className="en">RESULTS</span><h2>${total}件の結果</h2></div><button className="link" onClick=${clear}>条件をクリア</button></div>
      ${artistHits.length>0 && html`<div className="hrow" style=${{marginBottom:10}}>${artistHits.map(a=>html`<button key=${a.id} className="artist" onClick=${()=>openArtist(a.id)}><${Cover} item=${a} radius="50%"/><div className="n">${a.name}</div><div className="f">アーティスト</div></button>`)}</div>`}

/* ---------- UPLOAD ---------- */
/* ファイル選択まわり
   - 選んだファイルは確認画面までは URL.createObjectURL で試聴・プレビューし、申請時に Supabase Storage へ保存する
   - サーバー保存（将来）：uploadService.uploadToServer を Cloudflare R2 の署名付きURLへの PUT に置き換える */
const UPLOAD_RULES = {
  audio:{exts:["mp3","wav","m4a"],mimes:["audio/mpeg","audio/mp3","audio/wav","audio/x-wav","audio/wave","audio/vnd.wave","audio/mp4","audio/x-m4a","audio/m4a","audio/aac"],maxMB:50,label:"MP3・WAV・M4A"},
  image:{exts:["jpg","jpeg","png","heic","heif"],mimes:["image/jpeg","image/jpg","image/png","image/heic","image/heif"],maxMB:15,label:"JPG・PNG・HEIC"}
};
const AUDIO_ACCEPT = ".mp3,.wav,.m4a,audio/mpeg,audio/wav,audio/x-wav,audio/mp4,audio/x-m4a";
const IMAGE_FILE_ACCEPT = ".jpg,.jpeg,.png,.heic,.heif,image/jpeg,image/png,image/heic,image/heif";
const fmtSize = b => b>=1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";
const extOf = name => { const m=/\.([^.]+)$/.exec(name||""); return m?m[1].toLowerCase():""; };

const uploadService = {
  mode:"supabase",
  check(kind,file){
    const r=UPLOAD_RULES[kind]; const ext=extOf(file.name); const type=(file.type||"").toLowerCase();
    const okExt=r.exts.includes(ext); const okMime=r.mimes.includes(type);
    if(!okExt && !okMime) return `対応していない形式です（${ext?"."+ext:type||"形式不明"}）。${r.label}のファイルを選んでください。`;
    if(file.size===0) return "ファイルが空です（0バイト）。iCloud Driveのファイルはダウンロード完了後にもう一度選んでください。";
    if(file.size>r.maxMB*1048576) return `ファイルサイズが大きすぎます（${fmtSize(file.size)}）。${r.maxMB}MB以下のファイルを選んでください。`;
    return null;
  },
  prepareLocal(file){ return {file,name:file.name,size:file.size,type:file.type,ext:extOf(file.name)||(file.type.split("/")[1]||""),url:URL.createObjectURL(file),storage:"local"}; },
  release(item){ try{ if(item&&item.url) URL.revokeObjectURL(item.url); }catch(e){} },
  contentType(kind,item){
    const t=(item.type||"").toLowerCase(); if(UPLOAD_RULES[kind].mimes.includes(t)) return t;
    return ({mp3:"audio/mpeg",wav:"audio/wav",m4a:"audio/mp4",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",heic:"image/heic",heif:"image/heif"})[item.ext]||"application/octet-stream";
  },
  // Supabase Storage に保存し、保存先パスを返す（パス：会員ID/楽曲ID.拡張子）
  async uploadToServer(kind,userId,trackId,item){
    const bucket = kind==="audio"?"audio":"covers";
    const type = this.contentType(kind,item);
    const fromType = ({"audio/mpeg":"mp3","audio/mp3":"mp3","audio/wav":"wav","audio/x-wav":"wav","audio/wave":"wav","audio/vnd.wave":"wav","audio/mp4":"m4a","audio/x-m4a":"m4a","audio/m4a":"m4a","audio/aac":"m4a","image/jpeg":"jpg","image/jpg":"jpg","image/png":"png","image/heic":"heic","image/heif":"heif"})[type];
    const ext = UPLOAD_RULES[kind].exts.includes(item.ext) ? item.ext : (fromType||"bin");
    const path = `${userId}/${trackId}.${ext}`;
    const {error} = await sb.storage.from(bucket).upload(path,item.file,{contentType:type,upsert:false,cacheControl:"3600"});
    if(error) throw error;
    return path;
  }
};

function useDrop(onFile){
  const [over,setOver]=useState(false);
  return [over,{
    onDragOver:e=>{e.preventDefault();setOver(true)},
    onDragLeave:()=>setOver(false),
    onDrop:e=>{e.preventDefault();setOver(false);const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)onFile(f)}
  }];
}

          <div style=${{minWidth:0,display:"flex",flexDirection:"column",gap:4}}>

            <div className="fmeta mono">${value.ext.toUpperCase()} · ${fmtSize(value.size)}</div>
            ${noPreview && html`<div className="warn-line"><${Icon} n="info" size=${15}/><span>このブラウザではHEICのプレビューを表示できません。iPhoneのSafariでは表示されます。</span></div>`}
            <span className="tag local" style=${{alignSelf:"flex-start"}}>未投稿</span>
          </div>
        </div>
        <div className="fcard-f"><span className="spacer"></span>
          <button className="btn sm ghost" onClick=${()=>photoRef.current.click()}>写真から変更</button>
          <button className="btn sm ghost" onClick=${()=>fileRef.current.click()}>ファイルから変更</button>
          <button className="btn sm danger" aria-label="画像を削除" onClick=${onClear}><${Icon} n="trash" size=${16}/></button></div>
      </div>`}
    ${error && html`<span className="err" role="alert">${error}</span>`}
  </div>`;
}

function Upload({ctx}){
  const {submit,setTab,repoMode,user,isAdmin} = ctx;
  const empty = {title:"",artist:"",genre:"",tool:"Suno",toolOther:"",lyrics:"",audio:null,image:null,checks:CONFIG.rightsChecks.map(()=>false)};
  const [f,setF] = useState(empty);
  const [step,setStep] = useState("form");
  const [errs,setErrs] = useState({});
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const submitted = useRef(false);
  const [sending,setSending] = useState(false);

  const pickFile = (kind,file) => {
    const msg = uploadService.check(kind,file);
    if(msg){ setErrs(e=>({...e,[kind]:msg})); return; }
    setErrs(e=>({...e,[kind]:null}));
    setF(p=>{ uploadService.release(p[kind]); return {...p,[kind]:uploadService.prepareLocal(file)}; });
  };
  const clearFile = kind => setF(p=>{ uploadService.release(p[kind]); return {...p,[kind]:null}; });
  const metaAudio = m => setF(p=>p.audio?{...p,audio:{...p.audio,...m}}:p);

  const validate = () => {
    const e={};
    if(!f.title.trim()) e.title="曲名を入力してください";
    if(!f.artist.trim()) e.artist="アーティスト名を入力してください";
    if(!f.genre) e.genre="ジャンルを選択してください";
    if(f.tool==="その他"&&!f.toolOther.trim()) e.tool="使用したサービス名を入力してください";
    if(!f.audio) e.audio="音源ファイルを選択してください";
    if(f.checks.some(c=>!c)) e.checks="すべての項目を確認してチェックしてください";
    setErrs(e); return Object.keys(e).length===0;
  };
  const toConfirm = () => { if(validate()){ setStep("confirm"); window.scrollTo(0,0);} else setTimeout(()=>{const el=document.querySelector(".err");el&&el.scrollIntoView({block:"center",behavior:"smooth"})},30); };
  const send = async () => { if(sending) return; setSending(true); const ok = await submit(f); setSending(false); if(!ok) return; submitted.current=true; setStep("done"); window.scrollTo(0,0); };
  const restart = () => { submitted.current=false; setF(empty); setErrs({}); setStep("form"); };
  const steps = {form:1,confirm:2,done:3}[step];

  if(!user) return html`<div className="screen">
    <header className="top"><h1>楽曲を投稿</h1></header>
    <div className="demo-note"><${Icon} n="info" size=${18}/><span>楽曲の投稿にはログインが必要です。会員登録は無料です。</span></div>
    <${AuthPanel} ctx=${ctx}/>
  </div>`;

  return html`<div className="screen">
    <header className="top">
      ${step==="confirm"&&html`<button className="icon-btn" aria-label="入力に戻る" onClick=${()=>setStep("form")}><${Icon} n="back"/></button>`}
      <h1>${step==="form"?"楽曲を投稿":step==="confirm"?"内容の確認":"申請完了"}</h1>
    </header>
    <div className="steps">${[1,2,3].map(i=>html`<i key=${i} className=${i<=steps?"on":""}></i>`)}</div>
    <div style=${{fontSize:12,color:"var(--muted)"}}>1 入力 → 2 確認 → 3 審査へ申請</div>

    ${step==="form" && html`<div className="form">
      <div className="demo-note"><${Icon} n="info" size=${18}/><span><b>保存について：</b>曲名・音源・ジャケット画像は、申請時にAIMUSEのサーバーに保存されます。審査で承認されると、どの端末からでも再生できるようになります。</span></div>
      <div className="field"><label htmlFor="f-title">曲名<span className="req">必須</span></label>
        <input id="f-title" className="input" value=${f.title} onInput=${e=>set("title",e.target.value)} placeholder="例：真夜中のシグナル" maxLength="60"/>${errs.title&&html`<span className="err">${errs.title}</span>`}</div>
      <div className="field"><label htmlFor="f-artist">アーティスト名<span className="req">必須</span></label>
        <input id="f-artist" className="input" value=${f.artist} onInput=${e=>set("artist",e.target.value)} placeholder="活動名を入力" maxLength="40"/>${errs.artist&&html`<span className="err">${errs.artist}</span>`}</div>
      <div className="field"><label htmlFor="f-genre">ジャンル<span className="req">必須</span></label>
        <select id="f-genre" className="input" value=${f.genre} onChange=${e=>set("genre",e.target.value)}><option value="">選択してください</option>${CONFIG.genres.map(g=>html`<option key=${g} value=${g}>${g}</option>`)}</select>${errs.genre&&html`<span className="err">${errs.genre}</span>`}</div>
      <div className="field"><span className="fl">使用したAIサービス<span className="req">必須</span></span>
        <div className="seg">${CONFIG.tools.map(t=>html`<button key=${t} className=${f.tool===t?"on":""} onClick=${()=>set("tool",t)}>${t}</button>`)}</div>
        ${f.tool==="その他"&&html`<input id="f-toolother" className="input" value=${f.toolOther} onInput=${e=>set("toolOther",e.target.value)} placeholder="サービス名（例：Stable Audio）"/>`}
        ${errs.tool&&html`<span className="err">${errs.tool}</span>`}</div>
      <${AudioPicker} value=${f.audio} error=${errs.audio} onPick=${file=>pickFile("audio",file)} onClear=${()=>clearFile("audio")} onMeta=${metaAudio}/>
      <${ImagePicker} value=${f.image} error=${errs.image} onPick=${file=>pickFile("image",file)} onClear=${()=>clearFile("image")}/>
      <div className="field"><label htmlFor="f-lyrics">歌詞</label>
        <textarea id="f-lyrics" className="input" value=${f.lyrics} onInput=${e=>set("lyrics",e.target.value)} placeholder="1行ずつ入力。インスト曲は空欄で構いません"></textarea></div>
      <div className="field"><span className="fl">権利の確認<span className="req">必須</span></span>
        <div className="checks">${CONFIG.rightsChecks.map((c,i)=>html`<button key=${i} className=${"check"+(f.checks[i]?" on":"")} role="checkbox" aria-checked=${f.checks[i]} onClick=${()=>set("checks",f.checks.map((v,j)=>j===i?!v:v))}>
          <span className="box">${f.checks[i]&&html`<${Icon} n="check" size=${14} sw=${3}/>`}</span><span>${c}</span></button>`)}</div>
        ${errs.checks&&html`<span className="err">${errs.checks}</span>`}</div>
      <button className="btn primary" onClick=${toConfirm}>確認画面へ進む</button>
    </div>`}

    ${step==="confirm" && html`<div className="form">
      <div style=${{display:"grid",gridTemplateColumns:"110px minmax(0,1fr)",gap:14,alignItems:"center"}}>
        <${Cover} item=${{id:"preview",hues:[275,230],pattern:3,imageUrl:f.image?.url}} radius=${14}/>
        <div style=${{minWidth:0}}><div style=${{fontSize:19,fontWeight:900,lineHeight:1.3}}>${f.title}</div><div style=${{color:"var(--muted)",fontSize:14}}>${f.artist}</div><div style=${{display:"flex",gap:6,marginTop:6,flexWrap:"wrap"}}><span className="tag">${f.genre}</span><${ToolTag} tool=${f.tool==="その他"?f.toolOther:f.tool}/></div></div>
      </div>
      <div className="field"><span className="fl">音源の試聴</span><audio controls playsInline preload="metadata" src=${f.audio.url} style=${{width:"100%"}}></audio></div>
      <dl className="kv">
        <dt>音源</dt><dd>${f.audio.name}<br/><span className="mono" style=${{color:"var(--muted)"}}>${f.audio.ext.toUpperCase()} · ${fmtSize(f.audio.size)}${f.audio.duration?" · "+fmtTime(f.audio.duration):""}</span></dd>
        <dt>ジャケット</dt><dd>${f.image?f.image.name:"自動デザイン"}</dd>
        <dt>AIサービス</dt><dd>${f.tool==="その他"?f.toolOther:f.tool}</dd>
        <dt>歌詞</dt><dd style=${{whiteSpace:"pre-wrap"}}>${f.lyrics.trim()||"なし（インスト）"}</dd>
        <dt>権利確認</dt><dd>${CONFIG.rightsChecks.length}項目すべて確認済み</dd>
        <dt>保存先</dt><dd>投稿情報：AIMUSEのデータベース<br/>音源・画像：AIMUSEのサーバー</dd>
      </dl>
      <div className="demo-note"><${Icon} n="shield" size=${18}/><span>申請後、運営による権利・内容の審査を経て公開されます。審査結果はマイページの「投稿曲」で確認できます。</span></div>
      <div className="btn-row"><button className="btn ghost" onClick=${()=>setStep("form")}>修正する</button><button className="btn primary" onClick=${send} disabled=${sending}>${sending?"アップロード中…":"投稿を申請する"}</button></div>
    </div>`}

    ${step==="done" && html`<div className="form" style=${{alignItems:"center",textAlign:"center",paddingTop:24}}>
      <div style=${{width:76,height:76,borderRadius:"50%",background:"var(--btn-grad)",color:"var(--on-btn,#fff)",display:"grid",placeItems:"center"}}><${Icon} n="check" size=${36} sw=${2.6}/></div>
      <h2 style=${{fontSize:22,fontWeight:900}}>審査を申請しました</h2>
      <p style=${{color:"var(--muted)",fontSize:14,maxWidth:320}}>「${f.title}」は審査待ちになりました。承認されると新着楽曲に表示されます。音源と画像はAIMUSEのサーバーに保存されました。</p>
      <div className="btn-row" style=${{width:"100%"}}><button className="btn ghost" onClick=${restart}>続けて投稿</button>${isAdmin?html`<button className="btn primary" onClick=${()=>setTab("admin")}>審査画面を見る</button>`:html`<button className="btn primary" onClick=${()=>setTab("me")}>マイページへ</button>`}</div>
    </div>`}
  </div>`;
}

            return k==="gap" ? html`<p key=${i} className="gap"></p>` : k==="head" ? html`<p key=${i} className="head">${headLabel(l)}</p>` : html`<p key=${i} className=${i===activeIdx?"on":""}>${l}</p>`; }) : html`<div className="none">${song.instrumental?"インストゥルメンタル曲のため歌詞はありません":"歌詞はまだ登録されていません"}</div>`}</div>
          ${canSync && html`<div className="lyr-sync-note">${sync&&sync.stale ? html`<span>歌詞が変わったため、同期の確認が必要です</span>` : !syncLines ? html`<span>歌詞の同期がまだありません</span>` : null}

      <h3>この曲を通報</h3><p style=${{fontSize:13,color:"var(--muted)"}}>「${song.title}」について、該当する理由を選んでください。運営が確認します。</p>
      ${CONFIG.reportReasons.map(r=>html`<button key=${r} className="opt" onClick=${()=>{report(song.id,r);setSheet(false)}}>${r}</button>`)}
      <button className="btn ghost" style=${{marginTop:4}} onClick=${()=>setSheet(false)}>キャンセル</button>
    </div></div>`}
