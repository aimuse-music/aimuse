<style>
/* AIMUSE と同じ色・書体。iPhone幅の1カラム（PCでは中央520px） */
:root{
  color-scheme: dark;
  --bg:#0b0912; --surface:#15121f; --surface2:#1e1a2c; --line:#2c2742;
  --fg:#f2eefb; --muted:#9d95b8; --faint:#6b6488;
  --violet:#a463ff; --indigo:#6b6cff;
  --grad:linear-gradient(120deg,#b46bff 0%,#7c5cff 45%,#5a72ff 100%);
  --glow:rgba(140,100,255,.35);
  --ok:#3fd49a; --warn:#f6bd55; --bad:#ff5f7e;
  --f-display:"Unbounded","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left,0px)); --gr:max(16px, env(safe-area-inset-right,0px));
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --nav-h:62px; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--violet)}
a.btn{text-decoration:none;color:var(--fg)}
.shell{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(var(--nav-h) + var(--sb) + 24px)}
.hdr{position:sticky;top:0;z-index:20;padding:calc(var(--st) + 12px) var(--gr) 12px var(--gl);background:rgba(11,9,18,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.hdr h1{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{font-family:var(--f-display);font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.page{padding:16px var(--gr) 0 var(--gl)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .tiny{font-size:11px}
.mono{font-family:var(--f-mono)}
.sec{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px;text-transform:uppercase}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 24px var(--glow)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,95,126,.4)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px;border-radius:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
input.in,textarea.in,select.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;outline:none}
input.in:focus,textarea.in:focus,select.in:focus{border-color:var(--violet)}
textarea.in{resize:vertical;min-height:120px;line-height:1.6}
label.lb{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:700;color:var(--muted)}
.chip.on{background:rgba(164,99,255,.16);border-color:var(--violet);color:var(--fg)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:rgba(63,212,154,.4)}
.badge.warn{color:var(--warn);border-color:rgba(246,189,85,.4)}
.badge.bad{color:var(--bad);border-color:rgba(255,95,126,.4)}
.badge.vio{color:#cdb3ff;border-color:rgba(164,99,255,.5)}
.notice{border-radius:12px;padding:10px 12px;font-size:13px;border:1px solid var(--line);background:var(--surface2)}
.notice.warn{border-color:rgba(246,189,85,.4);background:rgba(246,189,85,.07)}
.notice.bad{border-color:rgba(255,95,126,.4);background:rgba(255,95,126,.07)}
.notice.ok{border-color:rgba(63,212,154,.35);background:rgba(63,212,154,.06)}
.cover{width:56px;height:56px;border-radius:10px;flex:none;object-fit:cover;background:var(--surface2)}
.cover.lg{width:72px;height:72px}
.ph{display:grid;place-items:center;font-family:var(--f-display);font-size:18px;color:#fff}
.trk{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r);border:1px solid transparent;background:none;width:100%;text-align:left}
.trk:active,.trk.sel{background:var(--surface);border-color:var(--line)}
.trk .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ell{min-width:0;flex:1}
.ell>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(15,12,24,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.nav .in2{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;color:var(--faint);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav button.on{color:var(--fg)}
.nav button.on svg{stroke:url(#g)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--sb) + 14px);transform:translateX(-50%);z-index:60;background:#2a2340;border:1px solid var(--violet);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:16px var(--gr) calc(20px + var(--sb)) var(--gl)}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ptab{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:4px}
.ptab.on{border-color:var(--violet);color:var(--fg);background:rgba(164,99,255,.14)}
.ptab .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);margin-top:3px}
.preview{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:11px;color:var(--faint);font-weight:700;padding:2px 0}
.cal .d{aspect-ratio:1/1.05;border-radius:10px;border:1px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;font-size:13px;font-weight:700;gap:3px;min-height:40px}
.cal .d.out{opacity:.3}
.cal .d.today{border-color:var(--line);color:#cdb3ff}
.cal .d.sel{border-color:var(--violet);background:rgba(164,99,255,.16)}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--violet)}
.cal .dots i.posted{background:var(--ok)}
.cal .dots i.overdue{background:var(--warn)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.2}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line);position:relative}
.bars button{flex:1;height:100%;display:flex;align-items:flex-end;background:none;border:0;padding:0;min-width:0}
.bars button span{display:block;width:100%;background:var(--violet);border-radius:4px 4px 0 0;min-height:0}
.bars button.on span{background:#cdb3ff}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:4px}
.hbar{height:8px;border-radius:0 4px 4px 0;background:var(--violet)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;color:var(--faint);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.spin{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center{display:grid;place-items:center;min-height:50vh}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px var(--gr) 24px var(--gl);max-width:420px;margin:0 auto}
.hero{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.15;margin:0 0 4px}
ul.plain{margin:6px 0 0;padding-left:18px} ul.plain li{margin:3px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b46bff"/><stop offset="1" stop-color="#5a72ff"/></linearGradient></defs></svg>
<div id="root"></div>
<noscript><p style="padding:24px">JavaScriptを有効にしてください。</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
"use strict";
const BUILD = "boost-0.1.0";
const { useState, useEffect, useMemo, useCallback, useRef } = React;
const html = htm.bind(React.createElement);
const CFG = window.BOOST_CONFIG || {};
const sb = (window.supabase && CFG.supabaseUrl) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: "aimuse-boost-auth" }
}) : null;
const AIMUSE_URL = String(CFG.aimuseUrl || "").replace(/\/+$/, "");

/* ---------------- 定数 ---------------- */
const PLATFORMS = [
  { id: "x", name: "X", long: "X（旧Twitter）" },
  { id: "instagram", name: "Instagram", long: "Instagram" },
  { id: "tiktok", name: "TikTok", long: "TikTok" },
  { id: "youtube", name: "Shorts", long: "YouTube Shorts" },
];
const PNAME = Object.fromEntries(PLATFORMS.map(p => [p.id, p.long]));
const TONES = [
  { id: "emotional", name: "感動系" }, { id: "cool", name: "かっこいい系" }, { id: "love", name: "恋愛系" },
  { id: "friendly", name: "親しみやすい系" }, { id: "simple", name: "シンプル系" },
];
const ACTION_LABELS = { open_app: "BOOSTを開いた", generate_template: "テンプレートで作成", generate_ai: "AIで作成", create_link: "計測リンクを作成", copy: "コピー", share_x_intent: "Xの投稿画面を開いた", share_sheet: "共有シートで共有", save_post: "投稿を保存", post_status: "投稿の状態を変更", edit_post: "投稿を編集", delete_post: "投稿を削除", set_ai_limit: "AIの上限を変更", logout: "ログアウト", js_error: "画面のエラー", unhandled: "処理のエラー", load_tracks: "楽曲の読み込み", load_posts: "投稿の読み込み", update_status: "状態の変更" };
const STATUS = { draft: "下書き", scheduled: "予定", posted: "投稿済み", skipped: "見送り" };

/* ---------------- 小さな道具 ---------------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtDT = iso => { if (!iso) return ""; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDate = s => { if (!s) return "—"; const d = new Date(s); return isNaN(d) ? String(s).slice(0, 10) : `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
const toLocalInput = iso => { const d = iso ? new Date(iso) : new Date(Date.now() + 3600e3); return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fromLocalInput = v => v ? new Date(v).toISOString() : null;
const num = n => (n == null ? "—" : Number(n).toLocaleString("ja-JP"));
const pick = a => a[Math.floor(Math.random() * a.length)];
function randCode(len = 7) {
  const ch = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  const buf = new Uint32Array(len); crypto.getRandomValues(buf);
  return Array.from(buf, x => ch[x % ch.length]).join("");
}
function tagify(s) { return "#" + String(s || "").replace(/[\s#＃・,，、。.\-\/&()（）!！?？'"]+/g, ""); }
function uniqTags(list) { const seen = new Set(); return list.filter(t => t && t.length > 1 && !seen.has(t) && seen.add(t)).join(" "); }
// X の文字数（全角=2、URL=23 として概算）
function xWeight(text) {
  let n = 0; const urls = text.match(/https?:\/\/\S+/g) || [];
  const rest = text.replace(/https?:\/\/\S+/g, "");
  for (const ch of rest) { const c = ch.codePointAt(0); n += (c <= 0x10FF || (c >= 0x2000 && c <= 0x200D) || (c >= 0x2010 && c <= 0x201F) || (c >= 0x2032 && c <= 0x2037)) ? 1 : 2; }
  return n + urls.length * 23;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    try { const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99999); const ok = document.execCommand("copy"); ta.remove(); return ok; } catch (e2) { return false; }
  }
}
function composeText(p, d, link) {
  const parts = [];
  if (p === "youtube" && d.title) parts.push(d.title);
  if (d.body) parts.push(d.body.trim());
  if (link) parts.push(link);
  if (d.hashtags) parts.push(d.hashtags.trim());
  return parts.join("\n\n");
}
// 計測リンクの移動先＝楽曲ごとの宣伝ページ（そこから「AIMUSEで聴く」でAIMUSEへ）
function promoUrl(trackId, platform) { return `${location.origin}/s/${trackId}${platform ? `?src=${platform}` : ""}`; }
function destinationUrl(platform, trackId) {
  if (!AIMUSE_URL) return "";
  return promoUrl(trackId, platform);
}
function shortUrl(code) { return `${location.origin}/go/${code}`; }

/* ---------------- 記録（操作履歴・エラー） ---------------- */
let CURRENT_UID = null;
let DB_READY = false; // BOOST用テーブル（追加SQL）が使えるか。未実行なら読み取り専用モード
function isMissingTable(e) { const m = errMsg(e); return !!e && (["42P01", "PGRST205", "PGRST202", "42883"].includes(e.code) || /does not exist|Could not find the (table|function)|schema cache/i.test(m)); }
async function logEvent(kind, action, detail) {
  if (!sb || !CURRENT_UID || !DB_READY) return;
  try { await sb.from("boost_logs").insert({ kind, action: String(action).slice(0, 80), detail: detail || {}, actor: CURRENT_UID }); } catch (e) {}
}
function errMsg(e) { return (e && (e.message || e.error_description || e.hint)) || String(e || "不明なエラー"); }
async function must(promise, action) {
  const res = await promise;
  if (res && res.error) { logEvent("error", action, { message: errMsg(res.error), code: res.error.code || null }); throw res.error; }
  return res;
}

/* ---------------- テンプレート文章（AI未接続でも使える） ---------------- */
const HOOKS = {
  emotional: ["心にそっと寄り添う一曲。", "聴き終えたあと、景色が少し違って見える。", "静かに、でも確かに響く音。", "言葉にできない気持ちを、音にしました。"],
  cool: ["一音目から、空気が変わる。", "研ぎ澄まされたサウンド、ここに。", "夜に溶けるビートを。", "ボリュームを上げて聴いてほしい。"],
  love: ["会いたい夜に、この曲を。", "胸の奥がきゅっとなる、恋のうた。", "あの人を思い出す、甘くて切ない一曲。", "好きって言えない夜に。"],
  friendly: ["ちょっと一息つきたいときに、どうぞ！", "今日のBGMにいかがですか？", "気軽に聴いてみてください♪", "新しい曲、届きました！"],
  simple: ["新曲を紹介します。", "AIMUSEで配信中です。", "ぜひ聴いてみてください。", "今週の一曲。"],
};
const TONE_TAGS = { emotional: ["#エモい曲", "#心に響く"], cool: ["#かっこいい曲", "#NewMusic"], love: ["#ラブソング", "#恋愛ソング"], friendly: ["#おすすめ曲", "#今日のBGM"], simple: ["#新曲", "#NewMusic"] };
const YT_SUFFIX = { emotional: "心に響くAI音楽", cool: "クールなAI音楽", love: "切ない恋のAI音楽", friendly: "気軽に聴けるAI音楽", simple: "AI音楽" };
function templateFor(track, tone) {
  const t = track.title, a = track.artist, g = track.genre || "";
  const gt = g ? tagify(g) : "";
  const hook = () => pick(HOOKS[tone] || HOOKS.simple);
  const tt = TONE_TAGS[tone] || TONE_TAGS.simple;
  return {
    x: { title: "", body: `${hook()}\n\n「${t}」/ ${a}\nAIMUSEで配信中`, hashtags: uniqTags(["#AIMUSE", "#AI音楽", gt]) },
    instagram: { title: "", body: `${hook()}\n\n🎧「${t}」\nArtist：${a}${g ? `\nGenre：${g}` : ""}\n\nAIで生まれた音楽だけが集まる「AIMUSE」で配信中です。`, hashtags: uniqTags(["#AIMUSE", "#AI音楽", "#AIミュージック", gt, ...tt, "#新曲", "#音楽好きな人と繋がりたい", "#音楽紹介"]) },
    tiktok: { title: "", body: `${hook()}「${t}」/ ${a}`, hashtags: uniqTags(["#AIMUSE", "#AI音楽", gt, tt[0], "#おすすめ"]) },
    youtube: { title: `「${t}」${a}｜${YT_SUFFIX[tone] || "AI音楽"}`.slice(0, 100), body: `${hook()}\n${a}の「${t}」をAIMUSEで配信中です。`, hashtags: uniqTags(["#Shorts", "#AIMUSE", "#AI音楽", gt]) },
  };
}

/* ---------------- アイコン ---------------- */
const I = {

function Toast({ msg }) { return msg ? html`<div class="toast" role="status">${msg}</div>` : null; }
function Spinner() { return html`<div class="center"><div class="spin" aria-label="読み込み中"></div></div>`; }
function Cover({ url, title, lg }) {

  return html`<div class=${"cover ph" + (lg ? " lg" : "")} style=${{ background: "var(--grad)" }}>${(title || "?").slice(0, 1)}</div>`;

function Sheet({ onClose, children }) {

/* ======================================================================
   ログイン（AIMUSE の管理者アカウントのみ）
   ====================================================================== */
function Login({ onDone, initialError }) {
  const [email, setEmail] = useState(""); const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false); const [err, setErr] = useState(initialError || "");
  useEffect(() => { if (initialError) setErr(initialError); }, [initialError]);
  async function submit(e) {
    e.preventDefault(); setErr(""); setBusy(true);
    try {
      const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
      if (error) throw error;
      await onDone();
    } catch (e2) {
      setErr(/invalid login/i.test(errMsg(e2)) ? "メールアドレスまたはパスワードが違います" : /not confirmed/i.test(errMsg(e2)) ? "メール認証が完了していません" : "ログインできませんでした：" + errMsg(e2));
    } finally { setBusy(false); }
  }
  return html`<div class="login">
    <div class="hero"><span class="logo">AIMUSE</span><br/>BOOST</div>
    <p class="muted small" style=${{ margin: "0 0 24px" }}>運営者専用の宣伝・集客ツール</p>
    ${!sb && html`<div class="notice bad" style=${{ marginBottom: 12 }}>接続設定（config.js）が読み込めません</div>`}
    <form class="stack" onSubmit=${submit}>
      <div><label class="lb" for="em">メールアドレス</label><input id="em" class="in" type="email" autocomplete="username" required value=${email} onInput=${e => setEmail(e.target.value)} /></div>
      <div><label class="lb" for="pw">パスワード</label><input id="pw" class="in" type="password" autocomplete="current-password" required value=${pw} onInput=${e => setPw(e.target.value)} /></div>
      ${err && html`<div class="notice bad">${err}</div>`}
      <button class="btn primary block" disabled=${busy || !sb}>${busy ? "確認中…" : "ログイン"}</button>
    </form>
    <p class="faint tiny" style=${{ marginTop: 20 }}>AIMUSEの管理者アカウントでログインします。管理者以外はログインできません。</p>
  </div>`;
}

/* ======================================================================
   楽曲一覧（AIMUSE の公開済み楽曲を読み取りのみ）
   ====================================================================== */
function Tracks({ tracks, loading, error, reload, selectedId, onSelect }) {
  const [q, setQ] = useState(""); const [sort, setSort] = useState("new");
  const list = useMemo(() => {
    const k = q.trim().toLowerCase();
    let l = tracks.filter(t => !k || [t.title, t.artist, t.genre].some(v => String(v || "").toLowerCase().includes(k)));
    if (sort === "plays") l = [...l].sort((a, b) => (b.plays || 0) - (a.plays || 0));
    return l;
  }, [tracks, q, sort]);
  return html`<div class="page">
    <input class="in" type="search" placeholder="曲名・アーティスト・ジャンルで検索" value=${q} onInput=${e => setQ(e.target.value)} aria-label="検索" />

      <span class="muted small">公開中 ${num(tracks.length)}曲</span>
      <div class="chips">
        <button class=${"chip" + (sort === "new" ? " on" : "")} onClick=${() => setSort("new")}>新しい順</button>
        <button class=${"chip" + (sort === "plays" ? " on" : "")} onClick=${() => setSort("plays")}>再生数順</button>
      </div>
    </div>
    ${error && html`<div class="notice bad">楽曲を読み込めませんでした：${error} <button class="btn sm" style=${{ marginLeft: 8 }} onClick=${reload}>再読み込み</button></div>`}
    ${loading ? html`<${Spinner}/>` : list.length === 0 ? html`<div class="card muted small" style=${{ marginTop: 8 }}>${tracks.length ? "該当する楽曲がありません" : "AIMUSEに公開中の楽曲がまだありません（審査で承認された曲だけが表示されます）"}</div>` :
      html`<div class="stack" style=${{ gap: 2 }}>${list.map(t => html`<button key=${t.id} class=${"trk" + (t.id === selectedId ? " sel" : "")} onClick=${() => onSelect(t)}>
        <${Cover} url=${t.coverUrl} title=${t.title} />
        <div class="ell"><div class="t">${t.title}</div><div class="muted small">${t.artist}</div>
          <div class="faint tiny">${t.genre} ・ 再生 ${num(t.plays)} ・ 公開 ${fmtDate(t.approved_at || t.created_at)}</div></div>
        <span class="badge vio">宣伝する</span>
      </button>`)}</div>`}
    <p class="faint tiny" style=${{ marginTop: 14 }}>※ AIMUSEのデータは読み取りのみで、変更・削除はしません。再生数はAIMUSEの累計値です。</p>
  </div>`;
}

/* ======================================================================

function Compose({ track, ai, dbReady, toast, goTracks, onSaved }) {
  const [tone, setTone] = useState("emotional");
  const [plat, setPlat] = useState("x");
  const [drafts, setDrafts] = useState(null);
  const [source, setSource] = useState("template");
  const [busy, setBusy] = useState(false);
  const [aiErr, setAiErr] = useState("");
  const [links, setLinks] = useState({}); // platform -> {id, code}
  const [saveOpen, setSaveOpen] = useState(false);
  useEffect(() => { setDrafts(null); setLinks({}); setAiErr(""); }, [track && track.id]);

  if (!track) return html`<div class="page"><div class="card stack"><div class="muted">宣伝する曲を選んでください。</div><button class="btn primary" onClick=${goTracks}>楽曲一覧から選ぶ</button></div></div>`;

  function genTemplate() { setDrafts(templateFor(track, tone)); setSource("template"); setAiErr(""); logEvent("action", "generate_template", { track_id: track.id, tone }); }
  async function genAI() {
    setBusy(true); setAiErr("");
    try {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch("/api/generate", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + (session && session.access_token) }, body: JSON.stringify({ title: track.title, artist: track.artist, genre: track.genre, tone }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.message || `エラー（${res.status}）`);
      setDrafts(j.result); setSource("ai");
      logEvent("action", "generate_ai", { track_id: track.id, tone, used: j.usage && j.usage.used });
      toast(`AIで作成しました（本日 ${j.usage ? j.usage.used + "/" + j.usage.limit : "?"} 回）`);
    } catch (e) { setAiErr(errMsg(e)); logEvent("error", "generate_ai", { message: errMsg(e) }); }
    finally { setBusy(false); }
  }
  function edit(field, v) { setDrafts(d => ({ ...d, [plat]: { ...d[plat], [field]: v } })); if (source !== "manual") setSource(s => s === "ai" ? "ai" : "template"); }

  async function ensureLink(p) {
    if (links[p]) return links[p];
    if (!AIMUSE_URL || !dbReady) return null;
    for (let i = 0; i < 3; i++) {
      const code = randCode();
      const { data, error } = await sb.from("boost_links").insert({ code, track_id: track.id, track_title: track.title, artist: track.artist, platform: p, destination: destinationUrl(p, track.id), utm_campaign: "aimuse_boost" }).select("id,code").single();
      if (!error) { setLinks(l => ({ ...l, [p]: data })); logEvent("action", "create_link", { platform: p, track_id: track.id, code }); return data; }
      if (error.code !== "23505") { logEvent("error", "create_link", { message: errMsg(error) }); throw error; }
    }
    throw new Error("リンクを作成できませんでした");
  }
  async function fullText(p) {
    const l = await ensureLink(p);
    // 計測リンクが作れない（読み取り専用モード）ときは、宣伝ページのURLをそのまま載せる（クリック数は記録されない）
    return { text: composeText(p, drafts[p], l ? shortUrl(l.code) : promoUrl(track.id, p)), link: l };
  }
  async function doCopy() {
    try { const { text } = await fullText(plat); const ok = await copyText(text); toast(ok ? "コピーしました" : "コピーできませんでした"); if (ok) logEvent("action", "copy", { platform: plat, track_id: track.id }); }
    catch (e) { toast("失敗：" + errMsg(e)); }
  }
  async function doShare() {
    try {
      const { text } = await fullText(plat);
      if (plat === "x") { window.open("https://x.com/intent/post?text=" + encodeURIComponent(text), "_blank", "noopener"); logEvent("action", "share_x_intent", { track_id: track.id }); return; }
      await copyText(text);
      if (navigator.share) { try { await navigator.share({ text }); logEvent("action", "share_sheet", { platform: plat, track_id: track.id }); } catch (e) {} }
      else toast("コピーしました。アプリを開いて貼り付けてください");
    } catch (e) { toast("失敗：" + errMsg(e)); }
  }

  const d = drafts && drafts[plat];
  const linkPreview = links[plat] ? shortUrl(links[plat].code) : (AIMUSE_URL && dbReady ? "（計測リンクはコピー時に自動で付きます）" : promoUrl(track.id, plat));
  const preview = d ? composeText(plat, d, linkPreview) : "";
  const xw = plat === "x" && d ? xWeight(composeText("x", d, AIMUSE_URL ? "https://x.co/xxxxxxx" : "")) : 0;
  const openApp = { instagram: "https://www.instagram.com/", tiktok: "https://www.tiktok.com/upload", youtube: "https://studio.youtube.com/" }[plat];

  return html`<div class="page stack">
    <div class="card row">
      <${Cover} url=${track.coverUrl} title=${track.title} lg />
      <div class="ell"><div style=${{ fontWeight: 700 }}>${track.title}</div><div class="muted small">${track.artist}</div><div class="faint tiny">${track.genre} ・ 再生 ${num(track.plays)}</div></div>
      <button class="btn sm ghost" onClick=${goTracks}>変更</button>
    </div>
    <div class="card row between" style=${{ padding: "10px 12px" }}>
      <div class="ell"><div class="small" style=${{ fontWeight: 700 }}>この曲の宣伝ページ</div><div class="faint tiny mono">${promoUrl(track.id)}</div></div>
      <a class="btn sm" href=${promoUrl(track.id)} target="_blank" rel="noopener">開く</a>
      <button class="btn sm" onClick=${async () => { const ok = await copyText(promoUrl(track.id)); toast(ok ? "宣伝ページのURLをコピーしました" : "コピーできませんでした"); }}>コピー</button>
    </div>
    ${!dbReady && html`<div class="notice warn">読み取り専用モード：BOOST用のデータ保存が未設定のため、保存・予定・クリック計測は使えません。文章と宣伝ページURLのコピー・共有は使えます（クリック数は記録されません）。</div>`}
    ${!AIMUSE_URL && html`<div class="notice warn">AIMUSEの公開URLが未設定のため、クリック計測リンクは付きません（文章のコピー・共有は使えます）。</div>`}
    <div><label class="lb">文章の雰囲気</label>
      <div class="chips">${TONES.map(t => html`<button key=${t.id} class=${"chip" + (tone === t.id ? " on" : "")} onClick=${() => setTone(t.id)}>${t.name}</button>`)}</div></div>
    <div class="grid2">
      <button class="btn primary" onClick=${genTemplate}>${drafts ? "もう一度作成" : "テンプレートで作成"}</button>
      <button class="btn" onClick=${genAI} disabled=${!ai.connected || busy}>${busy ? "AI作成中…" : ai.connected ? "AIで作成" : "AI：未接続"}</button>
    </div>
    ${!ai.connected && html`<div class="faint tiny">${ai.checked ? "AI文章生成は未接続です。テンプレート方式で作成できます（設定画面で状況を確認できます）。" : "AIの接続状況を確認中…"}</div>`}
    ${aiErr && html`<div class="notice bad">${aiErr}</div>`}
    ${drafts && html`<div class="stack">
      <div class="ptabs">${PLATFORMS.map(p => html`<button key=${p.id} class=${"ptab" + (plat === p.id ? " on" : "")} onClick=${() => setPlat(p.id)}>${p.name}${links[p.id] && html`<span class="dot" title="計測リンク作成済み"></span>`}</button>`)}</div>
      <div class="row between"><span class="badge ${source === "ai" ? "vio" : ""}">${source === "ai" ? "AIが作成" : "テンプレート"}</span>
        ${plat === "x" && html`<span class=${"small mono " + (xw > 280 ? "" : "muted")} style=${xw > 280 ? { color: "var(--bad)" } : null}>約 ${xw}/280</span>`}</div>
      ${plat === "youtube" && html`<div><label class="lb" for="yt">タイトル</label><input id="yt" class="in" value=${d.title} onInput=${e => edit("title", e.target.value)} maxlength="100" /></div>`}
      <div><label class="lb" for="bd">${plat === "tiktok" ? "動画説明文" : plat === "youtube" ? "説明文" : "本文"}</label><textarea id="bd" class="in" value=${d.body} onInput=${e => edit("body", e.target.value)}></textarea></div>
      <div><label class="lb" for="ht">ハッシュタグ</label><textarea id="ht" class="in" style=${{ minHeight: 70 }} value=${d.hashtags} onInput=${e => edit("hashtags", e.target.value)}></textarea></div>
      <div><label class="lb">プレビュー</label><div class="preview">${preview}</div></div>
      <div class="grid3">
        <button class="btn" onClick=${doCopy}>コピー</button>
        <button class="btn" onClick=${doShare}>${plat === "x" ? "Xで投稿" : "共有"}</button>
        <button class="btn primary" disabled=${!dbReady} onClick=${() => setSaveOpen(true)}>${dbReady ? "保存" : "保存（未設定）"}</button>
      </div>
      ${openApp && html`<a class="btn ghost block" href=${openApp} target="_blank" rel="noopener">${PNAME[plat]}を開く（貼り付けて投稿）</a>`}
      <div class="faint tiny">自動投稿は未接続です。投稿はSNSアプリで手動で行い、予定画面で「投稿済み」にしてください。</div>
    </div>`}
    ${saveOpen && html`<${SaveSheet} onClose=${() => setSaveOpen(false)} onSave=${async (status, when) => {
      try {
        const l = await ensureLink(plat);
        await must(sb.from("boost_posts").insert({ track_id: track.id, track_title: track.title, artist: track.artist, platform: plat, tone, source, title: plat === "youtube" ? d.title : null, body: d.body, hashtags: d.hashtags, link_id: l ? l.id : null, status, scheduled_at: when }), "save_post");
        logEvent("action", "save_post", { platform: plat, status, track_id: track.id });
        setSaveOpen(false); toast(status === "scheduled" ? "投稿予定に保存しました" : status === "posted" ? "投稿済みとして保存しました" : "下書きに保存しました"); onSaved && onSaved();
      } catch (e) { toast("保存できませんでした：" + errMsg(e)); }
    }} />`}
  </div>`;
}

/* ======================================================================
   投稿カレンダー・投稿管理
   ====================================================================== */
function Calendar({ toast, refreshKey, dbReady }) {
  if (!dbReady) return html`<div class="page"><${ReadOnlyCard} what="投稿の保存・予定・カレンダー" /></div>`;
  return html`<${CalendarInner} toast=${toast} refreshKey=${refreshKey} />`;

function ReadOnlyCard({ what }) {
  return html`<div class="card stack" style=${{ gap: 8 }}><span class="badge warn" style=${{ alignSelf: "flex-start" }}>読み取り専用モード</span>
    <div class="small">${what}は、BOOST専用のデータ保存を設定すると使えるようになります。</div>
    <div class="faint tiny">AIMUSEのデータ・設定は変更しません。設定方法は運営者の承認後にご案内します。</div></div>`;
}
function CalendarInner({ toast, refreshKey }) {
  const [month, setMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [sel, setSel] = useState(() => ymd(new Date()));
  const [posts, setPosts] = useState([]); const [loading, setLoading] = useState(true); const [err, setErr] = useState("");
  const [editing, setEditing] = useState(null);
  const [view, setView] = useState("cal");
  const load = useCallback(async () => {
    setLoading(true); setErr("");
    try { const { data } = await must(sb.from("boost_posts").select("*, boost_links(code)").order("scheduled_at", { ascending: true, nullsFirst: false }).limit(1000), "load_posts"); setPosts(data || []); }
    catch (e) { setErr(errMsg(e)); } finally { setLoading(false); }
  }, []);
  useEffect(() => { load(); }, [load, refreshKey]);

  const now = Date.now();
  const byDay = useMemo(() => { const m = {}; posts.forEach(p => { const k = p.scheduled_at ? ymd(new Date(p.scheduled_at)) : p.posted_at ? ymd(new Date(p.posted_at)) : null; if (k) (m[k] = m[k] || []).push(p); }); return m; }, [posts]);
  const overdue = posts.filter(p => p.status === "scheduled" && p.scheduled_at && new Date(p.scheduled_at).getTime() < now);
  const drafts = posts.filter(p => p.status === "draft");
  const cells = useMemo(() => { const first = new Date(month); const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7)); return Array.from({ length: 42 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return d; }); }, [month]);
  const today = ymd(new Date());

  async function setStatus(p, status) {
    try { await must(sb.from("boost_posts").update({ status }).eq("id", p.id), "update_status"); logEvent("action", "post_status", { id: p.id, status }); toast(STATUS[status] + "にしました"); load(); }
    catch (e) { toast("更新できませんでした：" + errMsg(e)); }
  }
  async function copyPost(p) {
    const link = p.boost_links && p.boost_links.code ? shortUrl(p.boost_links.code) : "";
    const ok = await copyText(composeText(p.platform, p, link)); toast(ok ? "コピーしました" : "コピーできませんでした");
    if (ok) logEvent("action", "copy", { platform: p.platform, post_id: p.id });
  }
  async function sharePost(p) {
    const link = p.boost_links && p.boost_links.code ? shortUrl(p.boost_links.code) : "";
    const text = composeText(p.platform, p, link);
    if (p.platform === "x") { window.open("https://x.com/intent/post?text=" + encodeURIComponent(text), "_blank", "noopener"); return; }
    await copyText(text);
    if (navigator.share) { try { await navigator.share({ text }); } catch (e) {} } else toast("コピーしました。アプリを開いて貼り付けてください");
  }
  function PostCard({ p }) {
    const late = p.status === "scheduled" && p.scheduled_at && new Date(p.scheduled_at).getTime() < now;
    return html`<div class="card stack" style=${{ gap: 8 }}>
      <div class="row between"><div class="row" style=${{ gap: 6 }}><span class="badge vio">${PNAME[p.platform]}</span>
        <span class=${"badge " + (p.status === "posted" ? "ok" : late ? "warn" : "")}>${late ? "予定超過・未投稿" : STATUS[p.status]}</span></div>

function EditSheet({ post, onClose, onDone }) {
  const [f, setF] = useState({ title: post.title || "", body: post.body || "", hashtags: post.hashtags || "", status: post.status, when: toLocalInput(post.scheduled_at) });
  const [busy, setBusy] = useState(false); const [confirmDel, setConfirmDel] = useState(false);
  async function save() {
    setBusy(true);
    try {
      await must(sb.from("boost_posts").update({ title: post.platform === "youtube" ? f.title : null, body: f.body, hashtags: f.hashtags, status: f.status, scheduled_at: f.status === "scheduled" ? fromLocalInput(f.when) : post.scheduled_at }).eq("id", post.id), "edit_post");

  async function del() {
    setBusy(true);

    <div><label class="lb">本文</label><textarea class="in" value=${f.body} onInput=${e => setF({ ...f, body: e.target.value })}></textarea></div>
    <div><label class="lb">ハッシュタグ</label><textarea class="in" style=${{ minHeight: 70 }} value=${f.hashtags} onInput=${e => setF({ ...f, hashtags: e.target.value })}></textarea></div>

    ${f.status === "scheduled" && html`<div><label class="lb">投稿予定日時</label><input class="in" type="datetime-local" value=${f.when} onInput=${e => setF({ ...f, when: e.target.value })} /></div>`}
    <button class="btn primary block" disabled=${busy} onClick=${save}>保存</button>
    ${confirmDel ? html`<div class="notice bad stack" style=${{ gap: 8 }}>この投稿を削除しますか？（AIMUSEの楽曲には影響しません）<div class="grid2"><button class="btn danger" disabled=${busy} onClick=${del}>削除する</button><button class="btn" onClick=${() => setConfirmDel(false)}>やめる</button></div></div>`
      : html`<button class="btn ghost danger block" onClick=${() => setConfirmDel(true)}>この投稿を削除</button>`}
  </div><//>`;
}

   宣伝効果の分析（実際のクリック記録だけを表示）

function startOfWeek(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function makeBuckets(range, gran) {
  const end = new Date(); const from = new Date(); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - (range - 1));
  const keyOf = d => gran === "day" ? ymd(d) : gran === "week" ? ymd(startOfWeek(d)) : `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const buckets = []; const idx = {};
  let cur = gran === "week" ? startOfWeek(from) : gran === "month" ? new Date(from.getFullYear(), from.getMonth(), 1) : new Date(from);
  while (cur <= end) { const k = keyOf(cur); if (!(k in idx)) { idx[k] = buckets.length; buckets.push({ k, d: new Date(cur), n: 0 }); }
    cur = gran === "day" ? new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1) : gran === "week" ? new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 7) : new Date(cur.getFullYear(), cur.getMonth() + 1, 1); }
  return { buckets, add(iso) { const k = keyOf(new Date(iso)); if (k in idx) buckets[idx[k]].n++; } };
}
// 1系列の棒グラフ（タップで値を表示）
function BarChart({ title, series, gran, unit, empty }) {
  const [tip, setTip] = useState(null);
  const label = b => gran === "month" ? `${b.d.getMonth() + 1}月` : gran === "week" ? `${b.d.getMonth() + 1}/${b.d.getDate()}週` : `${b.d.getMonth() + 1}/${b.d.getDate()}`;
  const total = series.reduce((a, b) => a + b.n, 0);
  const max = Math.max(1, ...series.map(b => b.n));
  return html`<div class="card">
    <div class="row between"><b class="small">${title}</b>${tip != null && series[tip] ? html`<span class="small mono">${label(series[tip])}：${series[tip].n}${unit}</span>` : html`<span class="small muted mono">計 ${num(total)}${unit}</span>`}</div>
    ${total === 0 ? html`<div class="muted small" style=${{ padding: "24px 0", textAlign: "center" }}>${empty}</div>` : html`
      <div class="bars" style=${{ marginTop: 10 }} role="img" aria-label=${title}>${series.map((b, i) => html`<button key=${b.k} class=${tip === i ? "on" : ""} onClick=${() => setTip(tip === i ? null : i)} aria-label=${`${label(b)} ${b.n}${unit}`}><span style=${{ height: (b.n / max * 100) + "%" }}></span></button>`)}</div>
      <div class="axis"><span>${label(series[0])}</span><span>最大 ${max}${unit}</span><span>${label(series[series.length - 1])}</span></div>`}
  </div>`;
}
function Analytics({ tracks, dbReady }) {
  const [range, setRange] = useState(30); const [gran, setGran] = useState("day");
  const [clicks, setClicks] = useState([]); const [posts, setPosts] = useState([]); const [links, setLinks] = useState(0);

  const [loading, setLoading] = useState(true); const [err, setErr] = useState(""); const [capped, setCapped] = useState(false);
  useEffect(() => { (async () => {
    setLoading(true); setErr("");
    const from = new Date(); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - (range - 1));
    if (dbReady) try {
      const LIM = 20000;
      const [c, p, l] = await Promise.all([
        must(sb.from("boost_clicks").select("clicked_at,platform,track_id,kind").gte("clicked_at", from.toISOString()).order("clicked_at", { ascending: false }).limit(LIM), "load_clicks"),
        must(sb.from("boost_posts").select("platform,status,posted_at,track_id").eq("status", "posted").gte("posted_at", from.toISOString()).limit(5000), "load_posted"),
        must(sb.from("boost_links").select("id", { count: "exact", head: true }), "count_links"),
      ]);
      setClicks(c.data || []); setCapped((c.data || []).length >= LIM); setPosts(p.data || []); setLinks(l.count || 0);
    } catch (e) { setErr(errMsg(e)); }
    // AIMUSE全体の実数（管理者用関数・読み取りのみ）。失敗しても宣伝データは表示する
    try { const r = await sb.rpc("admin_stats"); setStats(r.error ? null : r.data); } catch (e) { setStats(null); }
    try { const r = await sb.from("profiles").select("created_at").gte("created_at", from.toISOString()).limit(20000); setMembers(r.error ? null : (r.data || [])); } catch (e) { setMembers(null); }
    setLoading(false);
  })(); }, [range, dbReady]);

  const linkClicks = clicks.filter(c => (c.kind || "link") === "link");
  const listens = clicks.filter(c => c.kind === "listen");
  const series = useMemo(() => { const b = makeBuckets(range, gran); linkClicks.forEach(c => b.add(c.clicked_at)); return b.buckets; }, [clicks, range, gran]);
  const listenSeries = useMemo(() => { const b = makeBuckets(range, gran); listens.forEach(c => b.add(c.clicked_at)); return b.buckets; }, [clicks, range, gran]);
  const memberSeries = useMemo(() => { const b = makeBuckets(range, gran); (members || []).forEach(m => b.add(m.created_at)); return b.buckets; }, [members, range, gran]);
  const byPlat = PLATFORMS.map(p => ({ ...p, clicks: linkClicks.filter(c => c.platform === p.id).length, listens: listens.filter(c => c.platform === p.id).length, posts: posts.filter(x => x.platform === p.id).length }));
  const pmax = Math.max(1, ...byPlat.map(p => p.clicks));
  const tmap = Object.fromEntries(tracks.map(t => [t.id, t]));
  const byTrack = useMemo(() => { const m = {}; const add = id => { if (id && !(id in m)) m[id] = { n: 0, l: 0, posts: 0 }; };
    clicks.forEach(c => { add(c.track_id); if (!c.track_id) return; if (c.kind === "listen") m[c.track_id].l++; else m[c.track_id].n++; });
    posts.forEach(p => { add(p.track_id); if (p.track_id) m[p.track_id].posts++; });
    return Object.entries(m).map(([id, v]) => ({ id, ...v, t: tmap[id] })).sort((a, b) => (b.n + b.l) - (a.n + a.l)).slice(0, 20); }, [clicks, posts, tracks]);
  const rate = linkClicks.length ? Math.round(listens.length / linkClicks.length * 100) : null;

  return html`<div class="page stack">
    <div class="chips" style=${{ flexWrap: "wrap" }}>${[7, 30, 90].map(r => html`<button key=${r} class=${"chip" + (range === r ? " on" : "")} onClick=${() => setRange(r)}>${r}日</button>`)}
      <span style=${{ width: 6, flex: "none" }}></span>
      ${[["day", "日別"], ["week", "週別"], ["month", "月別"]].map(([g, n]) => html`<button key=${g} class=${"chip" + (gran === g ? " on" : "")} onClick=${() => setGran(g)}>${n}</button>`)}</div>
    ${err && html`<div class="notice bad">読み込めませんでした：${err}</div>`}
    ${loading ? html`<${Spinner}/>` : html`
      ${!dbReady ? html`<${ReadOnlyCard} what="リンクのクリック数・投稿実績の記録" />` : html`<div class="stack">
      <div class="grid3">
        <div class="kpi"><div class="v">${num(linkClicks.length)}</div><div class="l">リンククリック</div></div>
        <div class="kpi"><div class="v">${num(listens.length)}</div><div class="l">AIMUSEへ移動</div></div>
        <div class="kpi"><div class="v">${num(posts.length)}</div><div class="l">投稿済み</div></div>
      </div>
      <div class="faint tiny">${rate == null ? "" : `宣伝ページからAIMUSEへ移動した割合：約${rate}%（延べ回数での計算） ・ `}計測リンク 累計${num(links)}本</div>
      ${capped && html`<div class="notice warn">クリック数が多いため、直近2万件までを集計しています。</div>`}
      <${BarChart} title="リンククリックの推移" series=${series} gran=${gran} unit="回" empty="この期間のクリック記録はまだありません。計測リンク付きで投稿すると、実際のクリック数が表示されます。" />
      <${BarChart} title="「AIMUSEで聴く」の推移" series=${listenSeries} gran=${gran} unit="回" empty="宣伝ページから AIMUSE へ移動した記録はまだありません。" />
      <div class="card">
        <b class="small">SNS別</b>
        <table class="tbl" style=${{ marginTop: 6 }}><thead><tr><th>SNS</th><th style=${{ width: "30%" }}></th><th class="n">クリック</th><th class="n">移動</th><th class="n">投稿</th></tr></thead>
          <tbody>${byPlat.map(p => html`<tr key=${p.id}><td>${p.name}</td><td><div class="hbar" style=${{ width: (p.clicks / pmax * 100) + "%", minWidth: p.clicks ? 4 : 0 }}></div></td><td class="n">${p.clicks}</td><td class="n">${p.listens}</td><td class="n">${p.posts}</td></tr>`)}</tbody></table>
      </div>
      <div class="card">
        <b class="small">楽曲別（上位20曲）</b>
        ${byTrack.length === 0 ? html`<div class="muted small" style=${{ marginTop: 6 }}>まだデータがありません。</div>` : html`
        <table class="tbl" style=${{ marginTop: 6 }}><thead><tr><th>楽曲</th><th class="n">クリック</th><th class="n">移動</th><th class="n">投稿</th><th class="n">累計再生</th></tr></thead>
          <tbody>${byTrack.map(r => html`<tr key=${r.id}><td><div style=${{ fontWeight: 700, maxWidth: 120, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>${r.t ? r.t.title : "（非公開/削除）"}</div><div class="faint tiny">${r.t ? r.t.artist : ""}</div></td><td class="n">${r.n}</td><td class="n">${r.l}</td><td class="n">${r.posts}</td><td class="n">${r.t ? num(r.t.plays) : "—"}</td></tr>`)}</tbody></table>
        <div class="faint tiny" style=${{ marginTop: 6 }}>累計再生はAIMUSEでの全再生数で、SNS経由とは限りません（参考値）。</div>`}
      </div></div>`}
      <div class="sec" style=${{ margin: "10px 0 0" }}>AIMUSE全体（実数）</div>
      ${stats ? html`<div class="grid3">
        <div class="kpi"><div class="v">${num(stats.members)}</div><div class="l">会員数</div></div>
        <div class="kpi"><div class="v">${num(stats.tracks_public)}</div><div class="l">公開曲</div></div>
        <div class="kpi"><div class="v">${num(stats.plays_total)}</div><div class="l">総再生数</div></div>
      </div>

      ${members && html`<${BarChart} title="新規会員登録の推移" series=${memberSeries} gran=${gran} unit="人" empty="この期間の新規会員登録はありません。" />`}
      <div class="faint tiny">会員登録はAIMUSE全体の人数です。SNS経由かどうかは区別できません。</div>
      <div class="card small">
        <b>計測できる項目</b>
        <ul class="plain muted"><li>計測リンク（/go/…）のクリック数（SNSのプレビュー取得・ロボットは除外）</li><li>宣伝ページの「AIMUSEで聴く」の回数</li><li>SNS別・楽曲別・日別/週別/月別の推移</li><li>投稿実績（BOOSTで「投稿済み」にした件数）</li><li>AIMUSE全体の会員数・新規登録数・公開曲数・再生数（実数）</li></ul>

      <div class="row between"><span>BOOST用データ保存</span>${dbReady ? html`<span class="badge ok">設定済み</span>` : html`<span class="badge warn">未設定（読み取り専用）</span>`}</div>
      <div class="row between"><span>AIMUSE 公開URL</span>${AIMUSE_URL ? html`<span class="badge ok">設定済み</span>` : html`<span class="badge warn">未設定</span>`}</div>
      <div class="row between"><span>AI文章生成</span>${!ai.checked ? html`<span class="badge">確認中</span>` : ai.connected ? html`<span class="badge ok">接続済み</span>` : html`<span class="badge warn">未接続（テンプレートのみ）</span>`}</div>
      ${ai.checked && !ai.connected && ai.reason && html`<div class="faint tiny">${ai.reason}</div>`}
      ${ai.connected && html`<div class="faint tiny">${ai.provider}（${ai.model}）・本日 ${usage == null ? "—" : usage} / ${limit == null ? "—" : limit} 回</div>`}
      ${dbReady && html`<div class="row between"><span class="small">AI生成の1日の上限</span>
        <select class="in" style=${{ width: 110, padding: "8px" }} value=${limit == null ? "" : String(limit)} onChange=${e => saveLimit(e.target.value)} aria-label="AI生成の1日の上限">
          ${[0, 10, 20, 30, 50, 100].concat(limit != null && ![0, 10, 20, 30, 50, 100].includes(limit) ? [limit] : []).map(v => html`<option key=${v} value=${String(v)}>${v}回</option>`)}
        </select></div>`}
    </div>
    ${!dbReady && html`<${ReadOnlyCard} what="操作履歴・エラー記録・AIの利用回数管理" />`}
    <div class="sec">SNS自動投稿</div>
    <div class="card stack" style=${{ gap: 10 }}>
      ${!dbReady && PLATFORMS.map(pl => html`<div key=${pl.id} class="row between"><span>${pl.long}</span><span class="badge">未接続（手動投稿のみ）</span></div>`)}
      ${PLATFORMS.map(pl => sns.find(a => a.platform === pl.id)).filter(Boolean).map(a => html`<div key=${a.platform} class="row between"><span>${PNAME[a.platform]}</span>${a.auto_post_enabled ? html`<span class="badge ok">自動投稿 有効</span>` : a.connected ? html`<span class="badge">接続済み・自動投稿オフ</span>` : html`<span class="badge">未接続（手動投稿のみ）</span>`}</div>`)}
      <div class="faint tiny">Ver.0.1では自動投稿はありません。各SNSの公式APIの利用審査・権限が揃ったSNSから順に追加します。</div>
    </div>
    ${dbReady && html`<div class="stack" style=${{ gap: 12 }}>
    <div class="sec" style=${{ marginBottom: 0 }}>履歴</div>
    <div class="chips"><button class=${"chip" + (logKind === "action" ? " on" : "")} onClick=${() => setLogKind("action")}>操作履歴</button><button class=${"chip" + (logKind === "error" ? " on" : "")} onClick=${() => setLogKind("error")}>エラー</button></div>
    <div class="card">${logs.length === 0 ? html`<div class="muted small">記録はまだありません。</div>` : html`<table class="tbl"><tbody>${logs.map(l => html`<tr key=${l.id}><td class="mono tiny" style=${{ whiteSpace: "nowrap" }}>${fmtDT(l.created_at)}</td><td class="small">${ACTION_LABELS[l.action] || l.action}${l.detail && l.detail.message ? html`<div class="faint tiny">${l.detail.message}</div>` : ""}</td></tr>`)}</tbody></table>`}</div>
    </div>`}
    <div class="sec">アカウント</div>
    <div class="card stack" style=${{ gap: 8 }}>
      <div class="small"><span class="muted">ログイン中：</span>${user.email}</div>
      <div class="faint tiny">管理者権限はAIMUSEと共通です（AIMUSEで管理者を外すとBOOSTも使えなくなります）。</div>
      <button class="btn block" onClick=${onLogout}>ログアウト</button>
    </div>
    <p class="faint tiny" style=${{ textAlign: "center" }}>AIMUSE BOOST ${BUILD}</p>
  </div>`;
}

/* ======================================================================
   アプリ本体
   ====================================================================== */
function App() {
  const [phase, setPhase] = useState("loading"); // loading | login | denied | app
  const [user, setUser] = useState(null); const [loginErr, setLoginErr] = useState("");
  const [tab, setTab] = useState("tracks");
  const [tracks, setTracks] = useState([]); const [tLoading, setTLoading] = useState(true); const [tErr, setTErr] = useState("");
  const [selected, setSelected] = useState(null);
  const [ai, setAi] = useState({ checked: false, connected: false });
  const [dbReady, setDbReady] = useState(false);
  const [toastMsg, setToastMsg] = useState(""); const tRef = useRef(null);
  const [refreshKey, setRefreshKey] = useState(0);
  const toast = useCallback(m => { setToastMsg(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToastMsg(""), 2400); }, []);

  const check = useCallback(async () => {
    if (!sb) { setPhase("login"); return; }
    setLoginErr("");
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { setPhase("login"); return; }
    const { data: isAdmin, error } = await sb.rpc("is_admin");
    if (error || !isAdmin) {
      await sb.auth.signOut();
      setLoginErr(error ? "管理者権限を確認できませんでした：" + errMsg(error) : "このアカウントは管理者ではないため利用できません");
      setPhase("login"); return;
    }
    CURRENT_UID = session.user.id;
    // BOOST用テーブルがあるか確認（読み取りのみ）。なければ読み取り専用モード
    try { const r = await sb.from("boost_settings").select("key").limit(1); DB_READY = !r.error; setDbReady(!r.error); } catch (e) { DB_READY = false; setDbReady(false); }
    setUser(session.user); setLoginErr(""); setPhase("app");
  }, []);
  useEffect(() => { check(); const { data } = sb ? sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") { CURRENT_UID = null; setUser(null); setPhase("login"); } }) : { data: null }; return () => data && data.subscription && data.subscription.unsubscribe(); }, [check]);

  const loadTracks = useCallback(async () => {
    setTLoading(true); setTErr("");
    try {
      const { data } = await must(sb.from("tracks").select("id,title,artist,genre,plays,image_path,approved_at,created_at,hues").eq("status", "public").order("created_at", { ascending: false }).limit(500), "load_tracks");
      const list = data || [];
      const paths = list.map(t => t.image_path).filter(Boolean);
      let urls = {};
      if (paths.length) {
        const { data: signed } = await sb.storage.from("covers").createSignedUrls(paths, 3600);
        (signed || []).forEach(s => { if (s && s.signedUrl) urls[s.path] = s.signedUrl; });
      }
      setTracks(list.map(t => ({ ...t, coverUrl: t.image_path ? urls[t.image_path] || null : null })));
    } catch (e) { setTErr(errMsg(e)); } finally { setTLoading(false); }
  }, []);
  useEffect(() => { if (phase !== "app") return; loadTracks(); logEvent("action", "open_app", { build: BUILD });
    fetch("/api/status", { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => setAi({ checked: true, connected: !!(j.ai && j.ai.connected), provider: j.ai && j.ai.provider, model: j.ai && j.ai.model, reason: j.ai && j.ai.connected ? "" : "Cloudflare で Workers AI のバインディング（名前：AI）が未設定です" }))
      .catch(() => setAi({ checked: true, connected: false, reason: "サーバー処理（/api/status）に接続できません（プレビュー表示や静的ファイルのみの公開ではAIは使えません）" }));
  }, [phase, loadTracks]);

  if (phase === "loading") return html`<${Spinner}/>`;
  if (phase === "login") return html`<${Login} initialError=${loginErr} onDone=${check} />`;

  const titles = { tracks: "楽曲を選ぶ", compose: "宣伝文を作成", calendar: "投稿カレンダー", analytics: "ダッシュボード", settings: "設定" };
  const navs = [["tracks", "楽曲", I.music], ["compose", "作成", I.pen], ["calendar", "予定", I.cal], ["analytics", "分析", I.chart], ["settings", "設定", I.gear]];
  return html`<div class="shell">
    <header class="hdr"><span class="logo" style=${{ fontSize: 13 }}>BOOST</span><h1>${titles[tab]}</h1>
      ${!dbReady && html`<span class="badge warn">読み取り専用</span>`}
      ${!ai.connected && ai.checked && html`<span class="badge warn" title="AI未接続">AI未接続</span>`}</header>
    <main>
      ${tab === "tracks" && html`<${Tracks} tracks=${tracks} loading=${tLoading} error=${tErr} reload=${loadTracks} selectedId=${selected && selected.id} onSelect=${t => { setSelected(t); setTab("compose"); window.scrollTo(0, 0); }} />`}
      ${tab === "compose" && html`<${Compose} track=${selected} ai=${ai} dbReady=${dbReady} toast=${toast} goTracks=${() => setTab("tracks")} onSaved=${() => setRefreshKey(k => k + 1)} />`}
      ${tab === "calendar" && html`<${Calendar} toast=${toast} refreshKey=${refreshKey} dbReady=${dbReady} />`}
      ${tab === "analytics" && html`<${Analytics} tracks=${tracks} dbReady=${dbReady} />`}
      ${tab === "settings" && html`<${Settings} user=${user} ai=${ai} dbReady=${dbReady} toast=${toast} onLogout=${async () => { await logEvent("action", "logout", {}); await sb.auth.signOut(); }} />`}
    </main>
    <nav class="nav"><div class="in2">${navs.map(([id, n, ic]) => html`<button key=${id} class=${tab === id ? "on" : ""} onClick=${() => { setTab(id); window.scrollTo(0, 0); }} aria-current=${tab === id ? "page" : null}>${ic}<span>${n}</span></button>`)}</div></nav>
    <${Toast} msg=${toastMsg} />
  </div>`;
}

window.addEventListener("error", e => logEvent("error", "js_error", { message: String(e.message || "").slice(0, 300) }));
window.addEventListener("unhandledrejection", e => logEvent("error", "unhandled", { message: errMsg(e.reason).slice(0, 300) }));
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
