/* ---------- 歌詞の同期の編集（投稿者本人・管理者。スマートフォンだけで操作できる）----------
   ・曲を再生しながら、次の行の歌い出しで大きなボタンを押すと、その行の時刻が記録される（押すまでの遅れを補正）
   ・「歌が止まる」で直前の行に歌い終わり（間奏・曲の終わり）を付けると、そこから次の行まで歌詞を表示しない
   ・各行は 0.1秒単位で前後に調整でき、全体を一度にずらすこともできる。「保存する」まではデータベースに送らない */
const TAP_REACT = 0.2;   // ボタンを押すまでの平均的な遅れ（秒）
function LyricsSyncPage({ctx}){
  const {syncSong:song,goBack} = ctx;
  if(!song) return html`<div className="screen"><header className="top"><button className="icon-btn" aria-label="戻る" onClick=${goBack}><${Icon} n="back"/></button><h1>歌詞の同期</h1></header><div className="empty">曲が見つかりません</div></div>`;
  return html`<${LyricsSyncEditor} key=${song.id} ctx=${ctx} song=${song}/>`;
}
function LyricsSyncEditor({ctx,song}){
  const {goBack,say} = ctx;
  const lines = song.lyrics||[];
  const textIdx = useMemo(()=>lines.map((l,i)=>lyricKind(l)==="text"?i:-1).filter(i=>i>=0),[song.id]);
  const aRef = useRef(null);
  const [times,setTimes] = useState(()=>lines.map(()=>null));   // 行ごとに null か {t, e?}
  const [loaded,setLoaded] = useState(false);
  const [staleNote,setStaleNote] = useState(false);
  const [cursor,setCursor] = useState(textIdx.length?textIdx[0]:-1);
  const [now,setNow] = useState(0);
  const [dur,setDur] = useState(song.duration||0);
  const [playing,setPlaying] = useState(false);
  const [rate,setRate] = useState(1);
  const [dirty,setDirty] = useState(false);
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState(null);
  const [confirmClear,setConfirmClear] = useState(false);
  const [confirmLeave,setConfirmLeave] = useState(false);
  // AI の自動同期（v1.15）：状態と提案。提案は「下書き」として読み込み、人が聞いて確かめて保存したときだけ再生画面に出る
  const [ai,setAi] = useState(null);            // lyrics_align_status の結果（null＝未対応か読み込み前）
  const [aiTimes,setAiTimes] = useState(null);  // 読み込んだ AI の提案（行ごと）。null＝AI の提案を使っていない
  const [aiBusy,setAiBusy] = useState(false);
  const toTimes = list => { const t=lines.map(()=>null); (list||[]).forEach(x=>{ if(x.i>=0&&x.i<t.length&&lyricKind(lines[x.i])==="text"&&isFinite(x.t)) t[x.i]=x.e!=null?{t:+x.t,e:+x.e}:{t:+x.t}; }); return t; };
  const firstMissing = t => { const f=textIdx.find(i=>!t[i]); return f!=null?f:-1; };
  const loadDraft = st => { const t=toTimes(st.proposal); setTimes(t); setAiTimes(toTimes(st.proposal)); setCursor(firstMissing(t)); setErr(null); };
  useEffect(()=>{ let alive=true;
    Promise.all([repo.loadSync(song.id,true).catch(()=>null), repo.alignStatus(song.id).catch(()=>null)]).then(([v,st])=>{ if(!alive) return;
      const has = !!(v && v.lines.length && !v.stale);
      if(has){ const t=toTimes(v.lines); setTimes(t); setCursor(firstMissing(t)); }
      if(v && v.stale && v.lines.length) setStaleNote(true);
      setAi(st);
      // 同期がまだ無い曲に AI の提案があれば、下書きとして読み込む（保存するまでは再生画面に出ない）
      if(!has && st && Array.isArray(st.proposal) && st.proposal.length && st.state!=="dismissed") loadDraft(st);
      setLoaded(true); });
    return ()=>{ alive=false; const a=aRef.current; if(a){ try{ a.pause(); }catch(e){} } }; },[]);
  // 再生中は 0.1秒ごとに現在の時刻を読む（画面の書き換えを抑えて、スマートフォンでも軽く動かす）
  useEffect(()=>{ if(!playing) return; const id=setInterval(()=>{ const a=aRef.current; if(a) setNow(a.currentTime); },100); return ()=>clearInterval(id); },[playing]);
  const a = () => aRef.current;
  const toggle = () => { const el=a(); if(!el) return; if(el.paused){ const pr=el.play(); if(pr&&pr.catch) pr.catch(()=>say("再生を開始できませんでした")); } else el.pause(); };
  const seekTo = v => { const el=a(); if(!el) return; const t=Math.max(0,Math.min(v,(isFinite(el.duration)&&el.duration)||dur||v)); try{ el.currentTime=t; }catch(e){} setNow(t); };
  const cycleRate = () => { const n = rate===1?0.75:rate===0.75?0.5:1; setRate(n); const el=a(); if(el) el.playbackRate=n; };
  const change = f => { setTimes(prev=>{ const t=prev.slice(); f(t); return t; }); setDirty(true); setErr(null); };
  const nextText = i => { const k=textIdx.indexOf(i); return k>=0&&k+1<textIdx.length ? textIdx[k+1] : -1; };
  const prevTimed = (t,i) => { for(let k=textIdx.indexOf(i)-1;k>=0;k--){ const j=textIdx[k]; if(t[j]) return j; } return -1; };
  const tapStart = () => {
    if(cursor<0) return;
    const at = Math.max(0, Math.round(((a()?a().currentTime:now)-TAP_REACT)*100)/100);
    change(t=>{ t[cursor]={t:at}; const p=prevTimed(t,cursor); if(p>=0&&t[p].e!=null&&t[p].e>at) t[p]={t:t[p].t}; });
    setCursor(nextText(cursor));
  };
  const markEnd = () => {
    const at = Math.max(0, Math.round(((a()?a().currentTime:now)-TAP_REACT)*100)/100);
    let target=-1; for(const i of textIdx){ if(times[i]&&times[i].t<at) target=i; }
    if(target<0||at-times[target].t<0.2){ say("歌い終わりを付ける行がありません。先に歌い出しを記録してください"); return; }
    change(t=>{ t[target]={t:t[target].t,e:at}; });
    say("「"+lines[target].slice(0,12)+"」の後を間奏にしました");
  };
  const back1 = () => { const k=cursor<0?textIdx.length-1:textIdx.indexOf(cursor)-1; if(k>=0) setCursor(textIdx[k]); };
  const nudge = (i,d) => change(t=>{ if(!t[i]) return; const nt=Math.max(0,Math.round((t[i].t+d)*100)/100); t[i]= t[i].e!=null ? {t:nt,e:Math.max(nt+0.1,t[i].e)} : {t:nt}; });
  const shiftAll = d => change(t=>{ t.forEach((x,i)=>{ if(x){ const nt=Math.max(0,Math.round((x.t+d)*100)/100); t[i]= x.e!=null ? {t:nt,e:Math.max(nt+0.1,Math.round((x.e+d)*100)/100)} : {t:nt}; } }); });
  const clearLine = i => change(t=>{ t[i]=null; });
  const clearEnd = i => change(t=>{ if(t[i]) t[i]={t:t[i].t}; });
  const built = useMemo(()=>textIdx.filter(i=>times[i]).map(i=>times[i].e!=null?{i,t:times[i].t,e:times[i].e}:{i,t:times[i].t}),[times]);
  // 時刻の順番が逆になっている行（保存できない）
  const bad = useMemo(()=>{ const out=new Set(); let pt=-1, pe=null; built.forEach(x=>{ if(x.t<pt||(pe!=null&&x.t<pe)) out.add(x.i); pt=x.t; pe=x.e!=null?x.e:null; }); return out; },[built]);
  const preview = syncActive(built,now);
  const missing = textIdx.filter(i=>!times[i]).length;
  const save = async () => {
    if(bad.size){ setErr(`時刻が前の行より前になっている行があります（${[...bad].map(i=>i+1).slice(0,5).join("・")}行目）。調整してから保存してください`); return; }
    setBusy(true); setErr(null);
    try{
      if(aiTimes && built.length){
        // AI の提案から作った同期：採用として保存（直した量＝AI との時刻の差が記録され、精度の確認に使われる）
        const r = await repo.alignApply(song.id,built); setDirty(false); setStaleNote(false);
        const rv = r.review||{};
        say(rv.changed ? `保存しました（AI から直した行 ${rv.changed}行・ずれの中央値 ${rv.median_abs}秒）` : "AI の同期をそのまま保存しました");
        setAi(a=>a?{...a,state:"applied",sync_source:r.source}:a);
      } else {
        await repo.saveSync(song.id,built); setDirty(false); setStaleNote(false); say(built.length?"歌詞の同期を保存しました":"歌詞の同期を消しました（歌詞は全文表示になります）");
      }
    }
    catch(e){ const m=(e&&e.message)||""; setErr(/NO_PROPOSAL/.test(m)?"AI の提案が古くなりました（歌詞が変わった可能性があります）。画面を開き直してください":/NOT_ALLOWED/.test(m)?(/手動/.test(m)?"投稿者が手動で合わせた同期は、投稿者本人しか置き換えられません":"この曲の同期を変更する権限がありません"):/BAD_DATA/.test(m)?m.replace(/^.*BAD_DATA:\s*/,""):/lyrics_sync_save|function/i.test(m)?"歌詞の同期の準備がまだ完了していません（運営の作業待ち）":"保存できませんでした。通信状態を確認して、もう一度お試しください"); }
    setBusy(false);
  };
  const aiRequest = async () => { setAiBusy(true);
    try{ const r=await repo.alignRequest(song.id); say(r.result==="queued"?"AI の解析を頼みました。順番に処理します（数分〜。結果は提案として届きます）":r.result==="running"?"いま解析中です":"この曲は AI の解析の対象外です"); setAi(await repo.alignStatus(song.id)); }
    catch(e){ const m=(e&&e.message)||""; say(/LIMIT/.test(m)?m.replace(/^.*LIMIT:\s*/,""):/NOT_ALLOWED/.test(m)?"この操作の権限がありません":"頼めませんでした。通信状態を確認して、もう一度お試しください"); }
    setAiBusy(false); };
  const aiDismiss = async () => { setAiBusy(true);
    try{ await repo.alignDismiss(song.id); setAi(a=>a?{...a,state:"dismissed"}:a); if(aiTimes){ setAiTimes(null); } say("AI の提案を使わないことにしました（今の同期はそのままです）"); }
    catch(e){ say("変更できませんでした。もう一度お試しください"); }
    setAiBusy(false); };
  const aiLoad = () => { loadDraft(ai); setDirty(true); say("AI の提案を読み込みました。保存するまで、今の同期は変わりません"); };
  const estSet = useMemo(()=>new Set((ai&&ai.meta&&ai.meta.est)||[]),[ai]);
  // 確認ポイント（歌い出し・最初のサビ・中盤・最後のサビ・最後の行）：実際の歌声と聞き比べる場所
  const checks = useMemo(()=>{ const timed=textIdx.filter(i=>times[i]); if(!timed.length) return [];
    const after = (last) => { let h=-1; lines.forEach((l,i)=>{ if(lyricKind(l)==="head"&&/chorus|サビ|hook/i.test(l)&&(h<0||last)) h=i; }); return h<0?null:timed.find(i=>i>h); };
    const pick=[["歌い出し",timed[0]],["最初のサビ",after(false)],["中盤",timed[Math.floor(timed.length/2)]],["最後のサビ",after(true)],["最後の行",timed[timed.length-1]]];
    const seen=new Set(); return pick.filter(([,i])=>i!=null&&!seen.has(i)&&seen.add(i)); },[times]);
  const playFrom = i => { const x=times[i]; if(!x) return; seekTo(Math.max(0,x.t-2)); const el=a(); if(el&&el.paused) toggle(); };
  const aiNote = (()=>{ if(!ai) return null; const st=ai.state, rs=ai.reason;
    if(ai.paused && (st==="queued"||st==="none")) return "AI の自動同期は、いま停止中です（運営の作業待ち）。手動で合わせることもできます。";
    if(st==="queued") return "AI の自動同期：解析待ちです（順番に処理します）。手動で合わせることもできます。";
    if(st==="running") return "AI の自動同期：いま解析中です。少し待ってから開き直してください。";
    if(st==="failed") return "AI では合わせられませんでした。手動で合わせてください。";
    if(st==="skipped" && (rs==="too_long"||rs==="too_large")) return "長い曲・大きな音源は、AI の自動同期の対象外です。手動で合わせてください。";
    if(st==="waiting" && rs==="no_duration") return "曲の長さがわかると、AI が自動で合わせます（一度再生すると登録されます）。";
    if(st==="applied" && ai.sync_source==="auto") return "AI が合わせた同期を使っています。ずれている行は直して保存できます。";
    return null; })();
  const canRequest = ai && ai.requests_left>0 && !["queued","running"].includes(ai.state) && song.status==="public";
  const leave = () => { if(dirty) setConfirmLeave(true); else goBack(); };
  // 次に合わせる行が見えるように、一覧の中で表示位置を合わせる
  useEffect(()=>{ if(cursor<0) return; const el=document.getElementById("ls-row-"+cursor); if(el&&el.scrollIntoView) el.scrollIntoView({block:"nearest",behavior:"smooth"}); },[cursor]);
  const total = (a()&&isFinite(a().duration)&&a().duration) || dur || 0;
  // 上に固定した操作部分の高さ（一覧の行が隠れないように、自動で合わせる位置に使う）
  const rootRef = useRef(null), panelRef = useRef(null);
  useEffect(()=>{ const set=()=>{ const root=rootRef.current, pnl=panelRef.current; if(!root||!pnl) return;
      const hdr=root.querySelector("header.top"); const top = hdr ? (parseFloat(getComputedStyle(hdr).top)||0) + hdr.offsetHeight - 6 : 0;
      pnl.style.top = top+"px"; root.style.setProperty("--ls-top",(top+pnl.offsetHeight+8)+"px"); };
    set(); window.addEventListener("resize",set); return ()=>window.removeEventListener("resize",set); },[]);
  return html`<div className="screen ls" ref=${rootRef}>
    <header className="top"><button className="icon-btn" aria-label="戻る" onClick=${leave}><${Icon} n="back"/></button><h1>歌詞の同期</h1>
      <button className="btn primary sm" style=${{marginLeft:"auto"}} onClick=${save} disabled=${busy||!loaded}>${busy?"保存中…":"保存する"}</button></header>
    <audio ref=${aRef} src=${song.audioUrl||undefined} preload="auto" playsInline
      onPlay=${()=>setPlaying(true)} onPause=${()=>{ setPlaying(false); const el=a(); if(el) setNow(el.currentTime); }} onEnded=${()=>setPlaying(false)}
      onTimeUpdate=${e=>{ if(e.target.paused) setNow(e.target.currentTime); }} onSeeked=${e=>setNow(e.target.currentTime)}
      onLoadedMetadata=${e=>{ const d=e.target.duration; if(isFinite(d)&&d>0) setDur(d); e.target.playbackRate=rate; }}></audio>
    <div className="ls-panel" ref=${panelRef}>
      <div className="ls-song"><b>${song.title}</b><span className="mono">${fmtClock(now)} / ${fmtTime(total)}</span></div>
      <input className="seek" type="range" min="0" max=${Math.max(1,total)} step="0.1" value=${Math.min(now,total||now)} onInput=${e=>seekTo(+e.target.value)} aria-label="再生位置" style=${{"--p":(total?Math.min(100,now/total*100):0)+"%"}}/>
      <div className="ls-ctrl">
        <button className="btn ghost sm" onClick=${()=>seekTo(now-5)} aria-label="5秒戻る">−5秒</button>
        <button className="big-play" aria-label=${playing?"一時停止":"再生"} onClick=${toggle}>${playing?html`<${PauseIcon} size=${26}/>`:html`<${PlayIcon} size=${26}/>`}</button>
        <button className="btn ghost sm" onClick=${()=>seekTo(now+5)} aria-label="5秒進む">+5秒</button>
        <button className="btn ghost sm" onClick=${cycleRate} aria-label="再生速度">${rate}倍</button>
      </div>
      <button className="btn primary ls-tap" onClick=${tapStart} disabled=${cursor<0}>
        ${cursor<0 ? "すべての行に時刻が付きました" : html`<span>歌い出しでタップ</span><small>${cursor+1}行目：${lines[cursor]}</small>`}</button>
      <div className="ls-sub">
        <button className="btn ghost sm" onClick=${markEnd} aria-label="歌が止まる（間奏・曲の終わり）">歌が止まる（間奏）</button>
        <button className="btn ghost sm" onClick=${back1}>1行戻る</button>
      </div>
      ${err && html`<span className="err" role="alert">${err}</span>`}
    </div>
    <div className="ls-list">
      <p className="hint">曲を再生し、ボタンに表示されている行の歌い出しで押してください。押すまでの遅れ（約0.2秒）は自動で補正します。間奏や曲の終わりで「歌が止まる」を押すと、次の歌い出しまで歌詞を表示しません。行をタップすると、その行から合わせ直せます。</p>
      ${staleNote && html`<div className="demo-note"><${Icon} n="info" size=${18}/><span>歌詞が変わったため、以前の同期は使えません。最初から合わせてください。</span></div>`}
      ${aiTimes && ai && html`<div className=${"ls-ai"+(ai.meta&&ai.meta.quality_ok===false?" warn":"")} role="status">
        <span><b>AI が合わせた下書きです</b>（歌詞と合った行 ${ai.meta?Math.round((ai.meta.ratio||0)*100):0}%）。下の確認ポイントや各行の「▶ 確認」で実際の歌声と聞き比べ、ずれている行は直してから「保存する」を押してください。保存するまで、再生画面には表示されません。</span>
        ${ai.meta&&ai.meta.quality_ok===false && html`<span>AI が聞き取れなかった部分があります（「推定」の行）。特に確認してください。</span>`}
        ${checks.length>0 && html`<div className="row2"><span>確認ポイント：</span>${checks.map(([lb,i])=>html`<button key=${i} className="btn ghost xs" onClick=${()=>playFrom(i)} aria-label=${`${lb}（${i+1}行目）の少し前から再生`}>▶ ${lb}</button>`)}</div>`}
        <div className="row2"><button className="btn ghost xs" onClick=${aiDismiss} disabled=${aiBusy}>AI の提案を使わない</button></div>
      </div>`}
      ${!aiTimes && ai && Array.isArray(ai.proposal) && ai.proposal.length>0 && ai.state==="review" && html`<div className="ls-ai" role="status">
        <span><b>AI の提案があります</b>（歌詞と合った行 ${ai.meta?Math.round((ai.meta.ratio||0)*100):0}%）。今の同期はそのままです。読み込んで聞き比べ、よければ保存してください。</span>
        <div className="row2"><button className="btn ghost xs" onClick=${aiLoad} disabled=${aiBusy}>提案を読み込む</button><button className="btn ghost xs" onClick=${aiDismiss} disabled=${aiBusy}>使わない</button></div>
      </div>`}
      ${!aiTimes && aiNote && html`<div className="demo-note"><${Icon} n="info" size=${18}/><span>${aiNote}</span></div>`}
      ${canRequest && html`<div className="row2" style=${{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",fontSize:12.5,color:"var(--muted)"}}><button className="btn ghost xs" onClick=${aiRequest} disabled=${aiBusy}>AI で合わせ直す</button><span>結果は提案として届き、今の同期はそのままです（今日あと${ai.requests_left}回）</span></div>`}
      <div className="ls-meta"><span>${textIdx.length-missing} / ${textIdx.length} 行に時刻あり${missing?`（未設定 ${missing}行）`:""}</span>
        <span className="ls-shift">全体を <button className="btn ghost xs" onClick=${()=>shiftAll(-0.1)}>−0.1秒</button><button className="btn ghost xs" onClick=${()=>shiftAll(0.1)}>+0.1秒</button></span></div>
      ${lines.map((l,i)=>{ const k=lyricKind(l); if(k==="gap") return null;
        if(k==="head") return html`<div key=${i} className="ls-head">${headLabel(l)}</div>`;
        const x=times[i];
        return html`<div key=${i} id=${"ls-row-"+i} className=${"ls-row"+(i===cursor?" cur":"")+(i===preview?" on":"")+(bad.has(i)?" bad":"")}>
          <button className="ls-line" onClick=${()=>setCursor(i)} aria-label=${`${i+1}行目を次に合わせる行にする`}><span className="mono">${fmtClock(x&&x.t)}</span><span className="tx">${l}${aiTimes&&estSet.has(i)?html` <span className="ls-est">推定</span>`:""}</span></button>
          ${x && html`<div className="ls-tools">
            <button className="btn ghost xs" onClick=${()=>nudge(i,-0.1)} aria-label=${`${i+1}行目を0.1秒早く`}>−0.1</button>
            <button className="btn ghost xs" onClick=${()=>nudge(i,0.1)} aria-label=${`${i+1}行目を0.1秒遅く`}>+0.1</button>
            <button className="btn ghost xs" onClick=${()=>{ seekTo(Math.max(0,x.t-2)); const el=a(); if(el&&el.paused) toggle(); }} aria-label=${`${i+1}行目の少し前から再生`}>▶ 確認</button>
            <button className="btn ghost xs" onClick=${()=>clearLine(i)} aria-label=${`${i+1}行目の時刻を消す`}>消す</button>
            ${x.e!=null && html`<span className="ls-end mono">〜${fmtClock(x.e)} 間奏<button className="link" onClick=${()=>clearEnd(i)} aria-label=${`${i+1}行目の歌い終わりを消す`}>×</button></span>`}
            ${aiTimes&&aiTimes[i]&&Math.abs(x.t-aiTimes[i].t)>=0.05 && html`<span className="ls-diff mono">AI より ${x.t>aiTimes[i].t?"+":"−"}${Math.abs(x.t-aiTimes[i].t).toFixed(1)}秒</span>`}
          </div>`}
        </div>`; })}
      <button className="btn ghost sm" style=${{margin:"18px auto 0"}} onClick=${()=>setConfirmClear(true)}>すべての時刻を消す</button>
    </div>
    ${confirmClear && html`<div className="scrim" onClick=${()=>setConfirmClear(false)}><div className="sheet" onClick=${e=>e.stopPropagation()}>
      <h3>すべての時刻を消しますか？</h3><p style=${{fontSize:13,color:"var(--muted)"}}>「保存する」を押すまでは、保存済みの同期は変わりません。歌詞そのものは消えません。</p>
      <button className="btn primary" onClick=${()=>{ change(t=>t.fill(null)); setCursor(textIdx.length?textIdx[0]:-1); setConfirmClear(false); }}>消す</button>
      <button className="btn ghost" onClick=${()=>setConfirmClear(false)}>キャンセル</button></div></div>`}
    ${confirmLeave && html`<div className="scrim" onClick=${()=>setConfirmLeave(false)}><div className="sheet" onClick=${e=>e.stopPropagation()}>
      <h3>保存していない変更があります</h3><p style=${{fontSize:13,color:"var(--muted)"}}>このまま戻ると、変更は失われます。</p>
      <button className="btn primary" onClick=${()=>{ setConfirmLeave(false); save(); }}>保存する</button>
      <button className="btn ghost" onClick=${()=>{ setConfirmLeave(false); goBack(); }}>保存せずに戻る</button></div></div>`}
  </div>`;
}

/* ---------- 会員ログイン ---------- */
const authError = e => {
  const m=(e&&e.message)||"";
  if(/Invalid login credentials/i.test(m)) return "メールアドレスまたはパスワードが正しくありません";
  if(/Email not confirmed/i.test(m)) return "メールアドレスの確認が完了していません。届いたメールのリンクを開いてください";
  if(/already registered|already been registered/i.test(m)) return "このメールアドレスはすでに登録されています。ログインしてください";
  if(/rate limit/i.test(m)) return "短時間に操作が集中しています。しばらく待ってからお試しください";
  if(/Password should be/i.test(m)) return "パスワードは6文字以上で入力してください";
  return "うまくいきませんでした。通信状態を確認して、もう一度お試しください";
};
// 規約などを読んでから戻ったときに、入力途中の内容（パスワード以外）を復元するための一時保存（メモリ内のみ）
const authDraft = {mode:"login",email:"",name:""};
function AuthPanel({ctx}){
  const {say} = ctx;
  const [mode,setMode] = useState(()=>authDraft.mode);
  const [email,setEmail] = useState(()=>authDraft.email);
  const [pw,setPw] = useState("");
  const [name,setName] = useState(()=>authDraft.name);
  useEffect(()=>{ authDraft.mode=mode==="reset"?"login":mode; authDraft.email=email; authDraft.name=name; },[mode,email,name]);
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState(()=>{ const e=auth.linkError; auth.linkError=null; return e; });
  const [info,setInfo] = useState(null);
  if(!sb) return html`<div className="empty">サーバーとの接続設定が完了していないため、ログインできません。</div>`;
  const go = async () => {
    setErr(null); setInfo(null);
    const em=email.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ setErr("メールアドレスを正しく入力してください"); return; }
    if(mode!=="reset" && pw.length<6){ setErr("パスワードは6文字以上で入力してください"); return; }
    setBusy(true);
    try{
      if(mode==="login"){ const {error}=await auth.signIn(em,pw); if(error) throw error; Object.assign(authDraft,{mode:"login",email:"",name:""}); say("ログインしました"); }
      else if(mode==="signup"){ const {data,error}=await auth.signUp(em,pw,name.trim()); if(error) throw error;
        if(data.session){ Object.assign(authDraft,{mode:"login",email:"",name:""}); say("会員登録が完了しました"); }
        else { setInfo("確認メールを送信しました。メール内のリンクを開くと登録が完了します。"); setMode("login"); } }
      else { const {error}=await auth.resetPassword(em); if(error) throw error; setInfo("パスワード再設定用のメールを送信しました。メール内のリンクを開いてください。"); setMode("login"); }
    }catch(e){ setErr(authError(e)); }
    setBusy(false);
  };
  return html`<div className="form">
    ${mode!=="reset" && html`<div className="seg">${[["login","ログイン"],["signup","新規登録"]].map(([k,l])=>html`<button key=${k} className=${mode===k?"on":""} onClick=${()=>{setMode(k);setErr(null)}}>${l}</button>`)}</div>`}
    ${mode==="reset" && html`<div style=${{fontSize:15,fontWeight:700}}>パスワードの再設定</div>`}
    ${mode==="signup" && html`<div className="field"><label htmlFor="a-name">表示名<span className="opt-l">任意</span></label>
      <input id="a-name" className="input" value=${name} onInput=${e=>setName(e.target.value)} placeholder="活動名など" maxLength="40" autoComplete="nickname"/></div>`}
    <div className="field"><label htmlFor="a-email">メールアドレス</label>
      <input id="a-email" className="input" type="email" value=${email} onInput=${e=>setEmail(e.target.value)} autoComplete="email" inputMode="email" autoCapitalize="none"/></div>
    ${mode!=="reset" && html`<div className="field"><label htmlFor="a-pw">パスワード</label>
      <input id="a-pw" className="input" type="password" value=${pw} onInput=${e=>setPw(e.target.value)} autoComplete=${mode==="signup"?"new-password":"current-password"} placeholder="6文字以上"/></div>`}
    ${err && html`<span className="err" role="alert">${err}</span>`}
    ${info && html`<div className="demo-note"><${Icon} n="info" size=${18}/><span>${info}</span></div>`}
    <button className="btn primary" onClick=${go} disabled=${busy}>${busy?"処理中…":mode==="login"?"ログイン":mode==="signup"?"会員登録（無料）":"再設定メールを送る"}</button>
    ${mode==="login" && html`<button className="link" onClick=${()=>{setMode("reset");setErr(null)}}>パスワードを忘れた場合</button>`}
    ${mode==="reset" && html`<button className="link" onClick=${()=>{setMode("login");setErr(null)}}>ログインに戻る</button>`}
    <${LegalLinks} openLegal=${ctx.openLegal} openGuide=${ctx.openGuide}/>
  </div>`;
}
function NewPasswordPanel({ctx}){
  const {say} = ctx;
  const [pw,setPw] = useState("");
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState(null);
  const go = async () => {
    if(pw.length<6){ setErr("パスワードは6文字以上で入力してください"); return; }
    setBusy(true); setErr(null);
    const {error} = await auth.updatePassword(pw);
    setBusy(false);
    if(error) setErr(authError(error)); else say("パスワードを変更しました");
  };
  return html`<div className="form">
    <div style=${{fontSize:15,fontWeight:700}}>新しいパスワードを設定</div>
    <div className="field"><label htmlFor="a-newpw">新しいパスワード</label>
      <input id="a-newpw" className="input" type="password" value=${pw} onInput=${e=>setPw(e.target.value)} autoComplete="new-password" placeholder="6文字以上"/></div>
    ${err && html`<span className="err" role="alert">${err}</span>`}
    <button className="btn primary" onClick=${go} disabled=${busy}>${busy?"処理中…":"パスワードを変更する"}</button>
  </div>`;
}

/* ---------- PROFILE（プロフィール編集：v1.6） ----------
   ・アイコン／背景画像は端末内で切り抜き・縮小し、JPEGに変換してから保存（位置情報などの撮影情報は残らない）
   ・保存の順番：新しい画像を保存 → プロフィールに設定（サーバー側で本人・保存済みを確認）→ 成功後に古い画像を削除
     途中で失敗しても、それまでの画像はそのまま残る
   ・表示名は本人と運営だけに表示。他の人に見えるのはアーティスト名・アイコン・背景・自己紹介
   ・v1.6 のSQLが未実行でも、既存機能は従来どおり動く（プロフィールの画像が表示されないだけ） */
const PROFILE_IMAGE = {
  avatar:{label:"アイコン", w:512, h:512, round:true, quality:.9},
  header:{label:"背景画像", w:1500, h:500, round:false, quality:.85}
};
const PROFILE_PHOTO_ACCEPT = "image/*";
const PROFILE_FILE_ACCEPT = ".jpg,.jpeg,.png,.webp,.heic,.heif,image/jpeg,image/png,image/webp,image/heic,image/heif";
const PROFILE_INPUT_MAX_MB = 20;      // 選べる元画像の大きさ（保存するのは縮小後の画像）
const PROFILE_SAVE_MAX = 1900000;     // 保存する画像の上限（保存場所の上限 2MB より少し小さく）
// ランダムなID（HTTPS以外の画面や古い端末では crypto.randomUUID が無いため、同じ形式で作る）
const uuid4 = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
const avatarUrl = p => (p && sb) ? sb.storage.from("avatars").getPublicUrl(p).data.publicUrl : null;
const profileErr = (e,fallback) => { const m=(e&&e.message)||""; return /[ぁ-んァ-ヶ一-龠]/.test(m) ? m.replace(/^.*?ERROR:\s*/,"") : fallback; };

const profileApi = {
  // 公開中のアーティストのアイコン・背景・自己紹介（未ログインでも取得可。SQL未実行でも失敗せず空で返す）
  async artistCards(ids){
    const out = new Map(); if(!sb||!ids.length) return out;
    const [b,r] = await Promise.all([
      sb.from("artists").select("id,bio").in("id",ids),
      sb.rpc("public_artist_profiles",{p_artist_ids:ids})
    ]);
    if(!b.error) b.data.forEach(x=>out.set(x.id,{bio:x.bio||""}));
    if(!r.error) r.data.forEach(x=>{ const o=out.get(x.artist_id)||{bio:""}; o.avatarUrl=avatarUrl(x.avatar_path); o.headerUrl=avatarUrl(x.header_path); out.set(x.artist_id,o); });
    return out;
  },
  async myArtists(uid){
    const {data,error} = await sb.from("artists").select("id,name,bio").eq("user_id",uid).order("created_at",{ascending:true});
    if(error) throw error; return data||[];
  },
  // 本人の「使われていない画像」を片付ける（前回の削除失敗などで残ったもの）
  //  一覧に出るのは、保存場所のルールにより本人の画像だけ
  async cleanup(uid, keep){
    try{
      const {data,error} = await sb.storage.from("avatars").list("",{limit:100});
      if(error||!data) return;
      const stale = data.map(f=>f.name).filter(n=>/^(avatar|header)-/.test(n) && !keep.includes(n));
      if(stale.length) await sb.storage.from("avatars").remove(stale);
    }catch(e){}
  },
  async upload(uid, kind, blob){
    const path = `${kind}-${uuid4()}.jpg`;   // 会員IDを含めない（公開URLから会員IDが分からないように）
    const {error} = await sb.storage.from("avatars").upload(path, blob, {contentType:"image/jpeg", upsert:false, cacheControl:"31536000"});
    if(error) throw error;
    return path;
  },
  async setImage(kind, path){
    const {data,error} = await sb.rpc("set_my_profile_image",{p_kind:kind, p_path:path});
    if(error) throw error; return data||null;   // それまで使っていた画像の場所
  },
  async removeFile(path){ if(!path) return; try{ await sb.storage.from("avatars").remove([path]); }catch(e){} },
  async setDisplayName(uid, name){
    const {data,error} = await sb.from("profiles").update({display_name:name||null}).eq("id",uid).select("id");
    if(error) throw error; if(!data||!data.length) throw deniedError();
  },
  async renameArtist(id, name){
    const {data,error} = await sb.rpc("rename_my_artist",{p_artist:id, p_name:name});
    if(error) throw error; return data;
  },
  async setBio(id, bio){
    const {data,error} = await sb.from("artists").update({bio}).eq("id",id).select("id");
    if(error) throw error; if(!data||!data.length) throw deniedError();
  }
};

// 画像を読み込み、作業用に縮小（最大2048px）した canvas を返す。HEICなど読み込めない形式はエラー
async function loadProfileImage(file){
  const ext = (file.name||"").split(".").pop().toLowerCase();
  const type = (file.type||"").toLowerCase();
  if(!(type.startsWith("image/") || ["jpg","jpeg","png","webp","heic","heif"].includes(ext))) throw new Error("画像ファイル（JPEG・PNG・WebP・HEIC）を選んでください");
  if(type==="image/svg+xml"||ext==="svg"||type==="image/gif"||ext==="gif") throw new Error("この形式の画像は使えません。JPEG・PNG・WebPの画像を選んでください");
  if(!file.size) throw new Error("ファイルが空です。iCloudの写真はダウンロード完了後にもう一度選んでください");
  if(file.size > PROFILE_INPUT_MAX_MB*1048576) throw new Error(`画像が大きすぎます（${PROFILE_INPUT_MAX_MB}MBまで）`);
  const url = URL.createObjectURL(file);
  let src;
  try{
    // <img> で読み込む（多くの端末で写真の向き情報が正しく反映される）
    src = await new Promise((res,rej)=>{ const i=new Image(); i.decoding="async"; i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  }catch(e){
    try{ src = await createImageBitmap(file); }catch(e2){ src=null; }
  }finally{ URL.revokeObjectURL(url); }
  const w = src && (src.naturalWidth||src.width), h = src && (src.naturalHeight||src.height);
  if(!w||!h) throw new Error(/heic|heif/.test(type+ext)
    ? "この端末ではHEIC画像を読み込めませんでした。写真をJPEGで保存し直すか、別の写真を選んでください"
    : "画像を読み込めませんでした。別の画像を選んでください");
  const k = Math.min(1, 2048/Math.max(w,h));
  const c = document.createElement("canvas"); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  if(src.close) src.close();
  return c;
}
const canvasBlob = (c,q) => new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",q));

// 切り抜き画面：ドラッグで位置、2本指（またはスライダー・ホイール）で拡大・縮小
function ProfileCropper({kind, source, onCancel, onDone}){
  const spec = PROFILE_IMAGE[kind];
  const vw = Math.min(window.innerWidth||390, 520);
  const W = spec.round ? Math.min(280, vw-80) : Math.min(480, vw-40);
  const H = Math.round(W*spec.h/spec.w);
  const nw = source.width, nh = source.height;
  const s0 = Math.max(W/nw, H/nh);
  const [view,setView] = useState(()=>({z:1, x:(W-nw*s0)/2, y:(H-nh*s0)/2}));
  const [busy,setBusy] = useState(false);
  const [url,setUrl] = useState(null);
  const ptrs = useRef(new Map()), gesture = useRef(null);
  useEffect(()=>{ let u; source.toBlob(b=>{ if(b){ u=URL.createObjectURL(b); setUrl(u); } },"image/jpeg",.92); return ()=>{ if(u) URL.revokeObjectURL(u); }; },[source]);
  const clamp = v => { const s=s0*v.z; return {z:v.z, x:Math.min(0,Math.max(W-nw*s,v.x)), y:Math.min(0,Math.max(H-nh*s,v.y))}; };
  // (px,py) を中心に拡大率を z に変える
  const zoomAt = (v,z,px,py) => { z=Math.min(4,Math.max(1,z)); const s=s0*v.z, s2=s0*z; return clamp({z, x:px-(px-v.x)*s2/s, y:py-(py-v.y)*s2/s}); };
  const local = e => { const r=e.currentTarget.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  const down = e => { e.currentTarget.setPointerCapture&&e.currentTarget.setPointerCapture(e.pointerId); ptrs.current.set(e.pointerId,local(e)); gesture.current=null; };
  const move = e => {
    if(!ptrs.current.has(e.pointerId)) return;
    const prev = ptrs.current.get(e.pointerId), p = local(e);
    ptrs.current.set(e.pointerId,p);
    const pts = [...ptrs.current.values()];
    if(pts.length>=2){
      const [a,b]=pts, d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const g = gesture.current;
      if(g&&g.d>0) setView(v=>{ const z=zoomAt(v, v.z*d/g.d, mx, my); return clamp({...z, x:z.x+mx-g.mx, y:z.y+my-g.my}); });
      gesture.current={d,mx,my};
    } else {
      setView(v=>clamp({...v, x:v.x+p.x-prev.x, y:v.y+p.y-prev.y}));
    }
  };
  const up = e => { ptrs.current.delete(e.pointerId); gesture.current=null; };
  const wheel = e => { e.preventDefault(); const p=local(e); setView(v=>zoomAt(v, v.z*(e.deltaY<0?1.08:1/1.08), p.x, p.y)); };
  const done = async () => {
    setBusy(true);
    const s=s0*view.z, out=document.createElement("canvas"); out.width=spec.w; out.height=spec.h;
    const ctx2=out.getContext("2d"); ctx2.imageSmoothingQuality="high";
    ctx2.fillStyle=(getComputedStyle(document.documentElement).getPropertyValue("--surface")||"#15121f").trim()||"#15121f"; ctx2.fillRect(0,0,spec.w,spec.h);   // 透明部分（PNG）は背景色で塗る
    ctx2.drawImage(source, -view.x/s, -view.y/s, W/s, H/s, 0, 0, spec.w, spec.h);
    let q=spec.quality, blob=await canvasBlob(out,q);
    while(blob && blob.size>PROFILE_SAVE_MAX && q>.5){ q-=.1; blob=await canvasBlob(out,q); }
    setBusy(false);
    if(!blob){ onCancel("画像を作成できませんでした。別の画像でお試しください"); return; }
    onDone({blob, url:URL.createObjectURL(blob)});
  };
  const s=s0*view.z;
  return html`<div className="scrim crop-scrim" role="dialog" aria-modal="true" aria-label=${spec.label+"の範囲を調整"}>
    <div className="sheet crop-sheet" onClick=${e=>e.stopPropagation()}>
      <h3>${spec.label}の範囲を調整</h3>
      <div className=${"crop-stage"+(spec.round?" round":"")} style=${{width:W,height:H}}
        onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up} onWheel=${wheel}>
        ${url && html`<img src=${url} alt="" draggable="false" style=${{width:nw,height:nh,transform:`translate(${view.x}px,${view.y}px) scale(${s})`}}/>`}
        <div className="crop-mask"></div>
      </div>
      <input className="crop-zoom" type="range" min="1" max="4" step="0.01" value=${view.z} aria-label="拡大・縮小"
        onInput=${e=>{ const z=+e.target.value; setView(v=>zoomAt(v,z,W/2,H/2)); }}/>
      <p className="hint" style=${{textAlign:"center"}}>ドラッグで位置を調整・2本指またはスライダーで拡大／縮小</p>
      <div className="btn-row"><button className="btn ghost" onClick=${()=>onCancel()} disabled=${busy}>キャンセル</button><button className="btn primary" onClick=${done} disabled=${busy||!url}>${busy?"処理中…":"この範囲を使う"}</button></div>
    </div>
  </div>`;
}

// アイコンの丸（画像がなければ従来どおり頭文字）
function AvatarCircle({url, name, size}){
  return html`<div className="avatar" style=${size?{width:size,height:size}:null}><div style=${url?{background:`center/cover no-repeat url("${url}")`}:null}>${url?"":([...(name||"")][0]?.toUpperCase()||"A")}</div></div>`;
}
// 背景画像（なければ何も表示しない＝従来のデザイン）
const ProfileBanner = ({url}) => url ? html`<div className="pbanner" style=${{backgroundImage:`url("${url}")`}}></div>` : null;

function ProfileImageField({kind, current, draft, onPick, onReset, onUndo}){
  const spec = PROFILE_IMAGE[kind];
  const photoRef=useRef(null), fileRef=useRef(null);
  const change=e=>{const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f) onPick(f);};
  const shown = draft ? draft.url : (draft===null ? null : current);
  const status = draft ? "新しい画像（未保存）" : draft===null ? "初期画像に戻します（未保存）" : current ? "設定中" : "初期画像";
  return html`<div className="field">
    <span className="fl">${spec.label}</span>
    <input ref=${photoRef} type="file" accept=${PROFILE_PHOTO_ACCEPT} className="vh" onChange=${change} tabIndex="-1" aria-hidden="true"/>
    <input ref=${fileRef} type="file" accept=${PROFILE_FILE_ACCEPT} className="vh" onChange=${change} tabIndex="-1" aria-hidden="true"/>
    <div className="pe-img">
      <div className=${"pe-thumb"+(spec.round?" round":"")} style=${shown?{backgroundImage:`url("${shown}")`}:null}>${shown?"":html`<${Icon} n="image" size=${20}/>`}</div>
      <span className="hint">${status}</span>
    </div>
    <div className="pick-grid">
      <button className="drop small" onClick=${()=>photoRef.current.click()}><span className="drop-ic"><${Icon} n="image" size=${22}/></span><b>写真から選ぶ</b><span>写真ライブラリ</span></button>
      <button className="drop small" onClick=${()=>fileRef.current.click()}><span className="drop-ic"><${Icon} n="folder" size=${22}/></span><b>ファイルから選ぶ</b><span>「ファイル」アプリ</span></button>
    </div>
    <div className="pe-links">
      ${draft!==undefined && html`<button className="link" onClick=${onUndo}>変更を取り消す</button>`}
      ${(current||draft) && draft!==null && html`<button className="link" onClick=${onReset}>初期画像に戻す</button>`}
    </div>
    <span className="hint">JPEG・PNG・WebP・HEIC（${PROFILE_INPUT_MAX_MB}MBまで）。保存時に縮小し、撮影場所などの情報は取り除きます。</span>
  </div>`;
}

function ProfileEdit({ctx}){
  const {user,profile,goBack,say,afterProfileSave} = ctx;
  const uid = user&&user.id;
  const curAvatar = avatarUrl(profile&&profile.avatar_path), curHeader = avatarUrl(profile&&profile.header_path);
  // draft：undefined＝変更なし / null＝初期画像に戻す / {blob,url}＝新しい画像
  const [draft,setDraft] = useState({avatar:undefined, header:undefined});
  const [crop,setCrop] = useState(null);           // {kind, source}
  const [name,setName] = useState((profile&&profile.display_name)||"");
  const [arts,setArts] = useState(null);           // 自分のアーティスト一覧
  const [aid,setAid] = useState(null);
  const [aname,setAname] = useState(""), [bio,setBio] = useState("");
  const [busy,setBusy] = useState(false), [errs,setErrs] = useState([]), [loadErr,setLoadErr] = useState(null);
  useEffect(()=>{ if(!uid) return; profileApi.myArtists(uid).then(a=>{ setArts(a); if(a[0]){ setAid(a[0].id); setAname(a[0].name); setBio(a[0].bio||""); } }).catch(()=>{ setArts([]); setLoadErr("アーティスト情報を読み込めませんでした"); }); },[uid]);
  useEffect(()=>()=>{ ["avatar","header"].forEach(k=>{ const d=draft[k]; if(d&&d.url) URL.revokeObjectURL(d.url); }); },[]);
  if(!user) return html`<div className="screen"><header className="top"><button className="icon-btn" aria-label="戻る" onClick=${goBack}><${Icon} n="back"/></button><h1>プロフィールを編集</h1></header><div className="empty">ログインすると編集できます</div></div>`;
  const art = arts && arts.find(a=>a.id===aid);
  const selectArtist = id => { const a=arts.find(x=>x.id===id); setAid(id); setAname(a?a.name:""); setBio(a?(a.bio||""):""); };
  const setD = (k,v) => setDraft(d=>{ const o=d[k]; if(o&&o.url&&o!==v) URL.revokeObjectURL(o.url); return {...d,[k]:v}; });
  const pick = async (kind,file) => { try{ setCrop({kind, source:await loadProfileImage(file)}); }catch(e){ say(e.message); } };
  const nameChanged = (name.trim()) !== ((profile&&profile.display_name)||"");
  const aChanged = art && aname.trim() && aname.trim()!==art.name;
  const bioChanged = art && bio!==(art.bio||"");
  const dirty = draft.avatar!==undefined || draft.header!==undefined || nameChanged || aChanged || bioChanged;
  const tooLong = [...name.trim()].length>40 || [...aname.trim()].length>40 || [...bio].length>500;
  const save = async () => {
    if(busy||!dirty) return;
    if(tooLong){ setErrs(["文字数が上限を超えています"]); return; }
    if(art && !aname.trim()){ setErrs(["アーティスト名を入力してください"]); return; }
    setBusy(true); setErrs([]);
    const fail=[], keep={avatar:profile&&profile.avatar_path, header:profile&&profile.header_path};
    // 1) 画像：使われていない古いファイルを片付けてから、新しい画像を保存→設定→古い画像を削除
    if(draft.avatar||draft.header) await profileApi.cleanup(uid,[keep.avatar,keep.header].filter(Boolean));
    for(const kind of ["avatar","header"]){
      const d = draft[kind]; if(d===undefined) continue;
      const label = PROFILE_IMAGE[kind].label;
      let newPath=null;
      try{
        if(d){ newPath = await profileApi.upload(uid,kind,d.blob); }
        const old = await profileApi.setImage(kind,newPath);
        keep[kind]=newPath;
        if(old && old!==newPath) await profileApi.removeFile(old);   // 失敗しても次回の保存時に片付く
        setD(kind,undefined);
      }catch(e){
        if(newPath) await profileApi.removeFile(newPath);           // 設定できなかった新しい画像は消す（既存の画像はそのまま）
        fail.push(`${label}：${profileErr(e,"保存できませんでした")}`);
      }
    }
    // 2) 表示名（本人と運営だけに表示）
    if(nameChanged){ try{ await profileApi.setDisplayName(uid,name.trim()); }catch(e){ fail.push("表示名："+profileErr(e,"保存できませんでした")); } }
    // 3) アーティスト名（禁止語・なりすまし・回数制限はサーバー側で確認）と自己紹介
    if(aChanged){ try{ const n=await profileApi.renameArtist(art.id,aname.trim()); setArts(a=>a.map(x=>x.id===art.id?{...x,name:n}:x)); setAname(n); }catch(e){ fail.push("アーティスト名："+profileErr(e,"変更できませんでした")); } }
    if(bioChanged){ try{ await profileApi.setBio(art.id,bio); setArts(a=>a.map(x=>x.id===art.id?{...x,bio}:x)); }catch(e){ fail.push("自己紹介："+profileErr(e,"保存できませんでした")); } }
    await afterProfileSave();
    setBusy(false); setErrs(fail);
    say(fail.length ? "一部を保存できませんでした" : "プロフィールを保存しました");
  };
  // プレビュー（他の人のアーティストページでの見え方）
  const pv = {avatar: draft.avatar ? draft.avatar.url : draft.avatar===null ? null : curAvatar,
              header: draft.header ? draft.header.url : draft.header===null ? null : curHeader};
  return html`<div className="screen">
    <header className="top"><button className="icon-btn" aria-label="戻る" onClick=${goBack}><${Icon} n="back"/></button><h1>プロフィールを編集</h1></header>
    <div className="label" style=${{marginTop:4}}>プレビュー（アーティストページでの見え方）</div>
    <div className="pe-preview">
      <${ProfileBanner} url=${pv.header}/>
      <div className=${"ahead"+(pv.header?" with-banner":"")}>
        <${Cover} item=${{id:aid||uid, hues:[270,230], pattern:0, imageUrl:pv.avatar}} radius="50%"/>
        <h2>${art ? (aname.trim()||art.name) : "アーティスト名"}</h2>
        ${art && bio && html`<p style=${{color:"var(--muted)",fontSize:13.5,maxWidth:320,whiteSpace:"pre-wrap"}}>${bio}</p>`}
      </div>
    </div>
    <div className="form" style=${{marginTop:18}}>
      <${ProfileImageField} kind="avatar" current=${curAvatar} draft=${draft.avatar} onPick=${f=>pick("avatar",f)} onReset=${()=>setD("avatar",null)} onUndo=${()=>setD("avatar",undefined)}/>
      <${ProfileImageField} kind="header" current=${curHeader} draft=${draft.header} onPick=${f=>pick("header",f)} onReset=${()=>setD("header",null)} onUndo=${()=>setD("header",undefined)}/>
      <div className="field"><label htmlFor="pe-name">表示名<span className="opt-l">任意</span></label>
        <input id="pe-name" className="input" value=${name} onInput=${e=>setName(e.target.value)} maxLength="40" autoComplete="nickname"/>
        <span className="hint">マイページに表示されます。他の会員には表示されません（あなたと運営のみ）。</span></div>
      ${arts===null ? html`<div className="hint">アーティスト情報を読み込み中…</div>`
        : loadErr ? html`<span className="err">${loadErr}</span>`
        : arts.length===0 ? html`<div className="demo-note"><${Icon} n="info" size=${18}/><span>楽曲を投稿すると、アーティスト名と自己紹介を設定できます。</span></div>`
        : html`
          ${arts.length>1 && html`<div className="field"><label htmlFor="pe-art">編集するアーティスト</label>
            <select id="pe-art" className="input" value=${aid} onChange=${e=>selectArtist(e.target.value)}>${arts.map(a=>html`<option key=${a.id} value=${a.id}>${a.name}</option>`)}</select></div>`}
          <div className="field"><label htmlFor="pe-aname">アーティスト名</label>
            <input id="pe-aname" className="input" value=${aname} onInput=${e=>setAname(e.target.value)} maxLength="40"/>
            <span className="hint">他の会員に表示される名前です。変更は24時間に3回まで。他の会員と同じ名前、運営と誤解される名前、実在のアーティストになりすます名前は使えません。変更内容は記録され、運営が確認します。</span></div>
          <div className="field"><label htmlFor="pe-bio">自己紹介<span className="opt-l">任意</span></label>
            <textarea id="pe-bio" className="input" value=${bio} onInput=${e=>setBio(e.target.value)} maxLength="500" rows="4"></textarea>
            <span className="hint">アーティストページに表示されます（${[...bio].length}/500文字）</span></div>`}
      ${errs.length>0 && html`<div className="err" role="alert">${errs.map((m,i)=>html`<div key=${i}>${m}</div>`)}</div>`}

    </div>

      onCancel=${m=>{ setCrop(null); if(m) say(m); }}

  </div>`;
}

// 管理者用：アーティスト名の変更履歴
/* ---------- 歌詞の自動同期（AI・v1.15）の管理 ----------
   ・停止と再開、今日の使用量（予約）と上限、状態ごとの数、人が確認したときのずれ（精度）、曲ごとの状態
   ・解析待ちへの登録：まず1曲（おぼろ月など）で確認 → よければ公開中の曲をまとめて（重複はしない）
   ・どの操作もデータベースの関数が「運営か」を確かめる（会員には使えない） */
const ALIGN_STATE = {waiting:"待ち",queued:"解析待ち",running:"解析中",review:"確認待ち",applied:"使用中",dismissed:"不採用",failed:"打ち切り",skipped:"対象外"};
const ALIGN_REASON = {no_lyrics:"歌詞なし",no_duration:"長さ未登録",too_long:"10分超",too_large:"20MB超",has_sync:"手動の同期あり",not_public:"非公開",low_quality:"品質の確認が必要",ready:"品質の検査に合格",
  gave_up:"3回失敗",bad_result:"結果の形式違い",reviewed:"確認済み",auto_applied:"自動で使用",approved:"承認",existing:"既存曲",admin:"運営",admin_retry:"やり直し",requested:"投稿者の依頼",lyrics_changed:"歌詞の変更",duration:"長さの登録",hidden:"非公開",dismissed_by_owner:"投稿者が不採用",dismissed_by_admin:"運営が不採用"};
function AdminLyricsAlign({ctx}){
  const {allSongs,openLyricsSync,say} = ctx;
  const [ov,setOv] = useState(null), [err,setErr] = useState(null), [busy,setBusy] = useState(false), [pick,setPick] = useState(""), [confirmAll,setConfirmAll] = useState(false), [confirmAuto,setConfirmAuto] = useState(false);
  const load = () => sb.rpc("admin_align_overview").then(r=>{ if(r.error){ setErr(/function|schema cache/i.test(r.error.message||"")?"歌詞の自動同期の準備（v1.15）がまだ完了していません":"読み込めませんでした。通信状態を確認してください"); setOv(false); } else { setErr(null); setOv(r.data); } });
  useEffect(()=>{ load(); },[]);
  const act = async (fn,args,msg) => { setBusy(true); const r = await sb.rpc(fn,args||{}); setBusy(false);
    if(r.error){ const m=r.error.message||""; say(/BAD_DATA|NOT_ALLOWED/.test(m)?m.replace(/^.*(BAD_DATA|NOT_ALLOWED):\s*/,""):"操作できませんでした。もう一度お試しください"); return null; }
    if(msg) say(typeof msg==="function"?msg(r.data):msg); load(); return r.data; };
  const resultMsg = d => { const k=d&&d.result; return k==="queued"?"解析待ちにしました（5分ごとに1曲ずつ処理します）":k==="duplicate"?"すでに登録済みです（重複して解析しません）":k==="skipped"?"この曲は対象外です（手動の同期がある・長すぎる など）":k==="waiting"?"歌詞か長さがそろうと自動で解析します":"登録できませんでした（"+(k||"不明")+"）"; };
  if(ov===null) return html`<div className="empty">読み込み中…</div>`;
  if(ov===false) return html`<div style=${{marginTop:14}}><span className="err">${err}</span></div>`;
  const st=ov.settings||{}, td=ov.today||{}, cn=ov.counts||{}, acc=ov.accuracy||{};
  const blocked = st.blocked_until && new Date(st.blocked_until)>new Date();

  return html`<div style=${{display:"flex",flexDirection:"column",gap:12,marginTop:14}}>
    <div className="panel">
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <b>${st.paused?"停止中":blocked?"一時停止（無料枠）":"動作中"}</b>
        ${st.paused ? html`<button className="btn sm okb" disabled=${busy} onClick=${()=>act("admin_align_set_paused",{p_paused:false},"再開しました（5分ごとに1曲ずつ解析します）")}>再開する</button>`
          : html`<button className="btn sm danger" disabled=${busy} onClick=${()=>act("admin_align_set_paused",{p_paused:true},"停止しました（解析中の1曲が終わると止まります）")}>停止する</button>`}
      </div>
      <div style=${{fontSize:12.5,color:"var(--muted)"}}>${st.paused?(st.pause_reason==="ai_auth"?"Cloudflare のトークンが無効になったため止まっています。トークンを直してから再開してください":st.pause_reason==="not_configured"?"Cloudflare の設定が足りないため止まっています":"運営が停止中です"):blocked?`Cloudflare の無料枠に達したため、${new Date(st.blocked_until).toLocaleString("ja-JP")} まで止めています（課金はされません）`:"解析待ちの曲を5分ごとに1曲ずつ解析しています。結果はすべて確認待ちになります"}</div>
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",fontSize:12.5,color:"var(--muted)"}}>
        <span>自動で採用：<b style=${{color:"var(--fg)"}}>${st.auto_apply?"オン":"オフ"}</b>（${st.auto_apply?"十分な精度の曲は確認なしで再生画面に表示。それ以外は確認待ち":"すべて確認待ち"}）</span>
        ${st.auto_apply ? html`<button className="btn sm ghost" disabled=${busy} onClick=${()=>act("admin_align_set_auto",{p_on:false},"自動で採用をオフにしました（これからの結果はすべて確認待ち）")}>オフにする</button>`
          : confirmAuto ? html`<button className="btn sm danger" disabled=${busy} onClick=${()=>{ setConfirmAuto(false); act("admin_align_set_auto",{p_on:true},"自動で採用をオンにしました（手動・手直し済みの同期は置き換えません）"); }}>オンにする（確認）</button>`
          : html`<button className="btn sm ghost" disabled=${busy} onClick=${()=>setConfirmAuto(true)}>オンにする</button>`}
      </div>
      ${confirmAuto && html`<div style=${{fontSize:12.5,color:"var(--muted)"}}>照合率 95%以上・推定の行 5%以下・時刻の品質の検査に合格した曲だけを、確認なしで再生画面に表示します。手動で合わせた同期・手直しした同期は置き換えません。</div>`}
      <div className="al-sum">
        <div><b>${td.reserved||0} / ${st.daily_cap}</b>今日の使用量（予約・ニューロン）</div>
        <div><b>${td.ok||0}件 / 失敗 ${td.failed||0}件</b>今日の解析（世界標準時）</div>
        <div><b>${cn.queued||0}曲</b>解析待ち</div>
        <div><b>${cn.review||0}曲</b>確認待ち</div>
        <div><b>${acc.songs?`${acc.median_abs}秒`:"—"}</b>人が直したずれ（中央値${acc.songs?`・${acc.songs}曲`:""}）</div>
        <div><b>${acc.songs?`${acc.max_abs}秒`:"—"}</b>人が直したずれ（最大）</div>
      </div>
    </div>
    <div className="panel">
      <b style=${{fontSize:14}}>解析待ちに登録</b>
      <div style=${{fontSize:12.5,color:"var(--muted)"}}>まず1曲で、保存と表示を確かめてから、残りをまとめて登録してください。手動の同期がある曲・同じ歌詞で解析済みの曲は登録されません。</div>
      <select className="input" value=${pick} onChange=${e=>setPick(e.target.value)} aria-label="解析する曲"><option value="">曲を選ぶ</option>${pub.map(x=>html`<option key=${x.id} value=${x.id}>${x.title}（${x.artistName}）</option>`)}</select>
      <div className="btn-row">
        <button className="btn sm ghost" disabled=${busy||!pick} onClick=${()=>act("admin_align_enqueue",{p_track:pick},resultMsg)}>この1曲を登録</button>
        ${confirmAll ? html`<button className="btn sm danger" disabled=${busy} onClick=${()=>{ setConfirmAll(false); act("admin_align_enqueue_existing",{},d=>`登録しました：解析待ち ${(d&&d.queued)||0}曲・重複 ${(d&&d.duplicate)||0}曲・対象外 ${(d&&d.skipped)||0}曲`); }}>公開中の${pub.length}曲を登録する</button>`
          : html`<button className="btn sm ghost" disabled=${busy} onClick=${()=>setConfirmAll(true)}>公開中の曲をまとめて登録</button>`}
      </div>
    </div>
    ${(ov.jobs||[]).length===0 && html`<div className="empty">まだ登録された曲はありません</div>`}
    ${(ov.jobs||[]).map(j=>{ const so=songOf(j.track_id); const rv=j.review||{}; return html`<div key=${j.track_id} className="panel">
      <div style=${{display:"flex",justifyContent:"space-between",gap:8,alignItems:"baseline"}}><b style=${{overflowWrap:"anywhere"}}>${j.title}</b><span className=${"tag"+(j.state==="applied"?" ok":j.state==="failed"?" bad":j.state==="review"?" demo":"")}>${ALIGN_STATE[j.state]||j.state}</span></div>
      <div style=${{fontSize:12.5,color:"var(--muted)"}}>${j.artist} · ${ALIGN_REASON[j.reason]||j.reason||""}${j.ratio!=null?` · 歌詞と合った行 ${Math.round(j.ratio*100)}%`:""}${j.quality_ok===false?" · 要確認":""}${rv.median_abs!=null?` · 人が直したずれ 中央値${rv.median_abs}秒／最大${rv.max_abs}秒（${rv.changed}/${rv.compared}行）`:""}${j.last_error?` · 最後の失敗 ${j.last_error}（${j.attempts}回）`:""}</div>
      <div className="btn-row">
        ${so && so.lyrics && so.audioUrl && html`<button className="btn sm ghost" onClick=${()=>openLyricsSync(so)}>聞いて確認する</button>`}
        ${["failed","skipped","dismissed"].includes(j.state) && html`<button className="btn sm ghost" disabled=${busy} onClick=${()=>act("admin_align_retry",{p_track:j.track_id},resultMsg)}>やり直す</button>`}
      </div>
    </div>`; })}
  </div>`;
}

function AdminNameHistory({ctx}){

/* ---------- FOLLOW LISTS（フォロワー・フォロー中一覧：v1.7） ----------
   ・一覧に名前・アイコンが出るのは「公開中の曲があるアーティスト」だけ。聴くだけの会員（リスナー）は人数のみ
   ・未ログインでも閲覧可。フォロー操作はログインが必要（既存の toggleFollow と同じ）
   ・30件ずつ取り出し、「さらに表示」で続きを読み込む */
const FOLLOW_PAGE = 30;
const followApi = {
  async summary(artistId){
    const {data,error} = await sb.rpc("public_artist_follow_summary",{p_artist:artistId});
    if(error) throw error; return (data&&data[0])||null;
  },
  async page(kind, artistId, cursor){
    const args = {p_before_at:cursor?cursor.at:null, p_before:cursor?cursor.id:null, p_limit:FOLLOW_PAGE};
    const {data,error} = kind==="mine"
      ? await sb.rpc("my_following",args)
      : await sb.rpc(kind==="followers"?"public_artist_followers":"public_artist_following",{p_artist:artistId,...args});
    if(error) throw error;
    const rows = (data||[]).map(r=>({id:r.artist_id, name:r.name, imageUrl:avatarUrl(r.avatar_path), isPublic:r.is_public!==false, at:r.followed_at, cur:r.cursor}));
    const last = rows[rows.length-1];
    return {rows, next: rows.length===FOLLOW_PAGE&&last ? {at:last.at, id:last.cur} : null};
  }
};

function FollowList({ctx}){
  const {followView,goBack,openArtist,follows,toggleFollow,user,artists,followVer,myArtistIds,say} = ctx;
  const v = followView||{};
  // 自分のアーティストが複数ある場合は、上で切り替えられる
  const myPublicArtists = v.mine ? artists.filter(a=>(myArtistIds||[]).includes(a.id)) : [];
  const [artistId,setArtistId] = useState(v.artistId || (myPublicArtists[0]&&myPublicArtists[0].id) || null);
  const [mode,setMode] = useState(v.mode||"followers");     // followers | following
  const [sum,setSum] = useState(null);
  const [rows,setRows] = useState([]), [next,setNext] = useState(null);
  const [loading,setLoading] = useState(false), [err,setErr] = useState(null);
  const reqRef = useRef(0);
  const kind = mode==="following" && v.mine ? "mine" : mode;   // 自分のフォロー中は「公開されていない」ものも含めて本人だけに表示
  const target = artists.find(a=>a.id===artistId);
  const load = async reset => {
    if(kind!=="mine" && !artistId){ setRows([]); setNext(null); return; }
    const id = ++reqRef.current; setLoading(true); setErr(null);
    try{
      const r = await followApi.page(kind, artistId, reset?null:next);
      if(id!==reqRef.current) return;                      // 途中で切り替えた場合は古い結果を捨てる
      setRows(p=>reset ? r.rows : [...p, ...r.rows.filter(x=>!p.some(y=>y.id===x.id))]);
      setNext(r.next);
    }catch(e){ if(id===reqRef.current) setErr("一覧を読み込めませんでした。通信状態を確認してください"); }
    if(id===reqRef.current) setLoading(false);
  };
  useEffect(()=>{ setRows([]); setNext(null); load(true); },[kind,artistId]);
  useEffect(()=>{ if(!artistId){ setSum(null); return; } let alive=true; followApi.summary(artistId).then(s=>{ if(alive) setSum(s); }).catch(()=>{}); return ()=>{ alive=false; }; },[artistId,followVer]);
  const mineFollowing = v.mine ? follows.size : null;
  const minePublic = v.mine ? artists.filter(a=>follows.has(a.id)).length : 0;
  const tabs = [["followers",`フォロワー ${sum?fmtNum(sum.followers):(v.mine&&!artistId?"0":"–")}`],
                ["following",`フォロー中 ${v.mine?fmtNum(mineFollowing):(sum?fmtNum(sum.following):"–")}`]];
  const title = v.mine ? "あなたのフォロー" : (target ? target.name : "フォロー");
  const own = id => v.mine ? (myArtistIds||[]).includes(id) : false;
  return html`<div className="screen">
    <header className="top"><button className="icon-btn" aria-label="戻る" onClick=${goBack}><${Icon} n="back"/></button><h1 className="fl-title">${title}</h1></header>
    ${v.mine && myPublicArtists.length>1 && mode==="followers" && html`<div className="field" style=${{marginBottom:10}}>
      <label htmlFor="fl-art" className="hint">表示するアーティスト</label>
      <select id="fl-art" className="input" value=${artistId} onChange=${e=>setArtistId(e.target.value)}>${myPublicArtists.map(a=>html`<option key=${a.id} value=${a.id}>${a.name}</option>`)}</select></div>`}
    ${v.mine && mode==="following" && follows.size>0 && html`<p className="hint fl-breakdown">フォロー中 ${fmtNum(follows.size)}件（公開中 ${fmtNum(minePublic)}件${follows.size-minePublic>0?`・現在公開中の曲がない ${fmtNum(follows.size-minePublic)}件`:""}）</p>`}
    <div className="seg" role="tablist">${tabs.map(([k,l])=>html`<button key=${k} role="tab" aria-selected=${mode===k} className=${mode===k?"on":""} onClick=${()=>setMode(k)}>${l}</button>`)}</div>
    ${kind!=="mine" && !artistId ? html`<div className="empty">公開中の曲があるアーティストになると、フォロワーの一覧が表示されます</div>` : html`
      <div className="list" style=${{marginTop:8}}>
        ${rows.map(a=>html`<div key=${a.id} className="row norank fl-row">
          <button className="fl-main" disabled=${!a.isPublic} onClick=${()=>a.isPublic&&openArtist(a.id)}>
            <${Cover} item=${{id:a.id, hues:[270,230], pattern:0, imageUrl:a.isPublic?a.imageUrl:null}} radius="50%"/>
            <div style=${{minWidth:0}}><div className="t">${a.isPublic ? a.name : "公開されていないアーティスト"}</div>
              ${!a.isPublic && html`<div className="sub"><span className="n">現在、公開中の曲がありません</span></div>`}</div>
          </button>
          ${!own(a.id) && html`<button className=${"follow sm"+(follows.has(a.id)?" on":"")} aria-pressed=${follows.has(a.id)} onClick=${()=>toggleFollow(a.id)}>${follows.has(a.id)?"フォロー中":"フォローする"}</button>`}
        </div>`)}
      </div>
      ${loading && html`<div className="empty" style=${{padding:"18px 0"}}>読み込み中…</div>`}
      ${err && html`<div className="empty"><span className="err">${err}</span><br/><button className="btn sm ghost" style=${{margin:"10px auto 0"}} onClick=${()=>load(rows.length===0)}>再読み込み</button></div>`}
      ${!loading && !err && next && html`<button className="btn ghost" style=${{marginTop:12}} onClick=${()=>load(false)}>さらに表示</button>`}
      ${!loading && !err && rows.length===0 && html`<div className="empty">${mode==="followers" ? "まだ公開アーティストのフォロワーはいません" : "まだフォローしているアーティストはいません"}</div>`}
      ${mode==="followers" && sum && sum.listeners>0 && !next && html`<div className="fl-listeners"><${Icon} n="user" size=${18}/><span>ほか ${fmtNum(sum.listeners)}人のリスナーがフォローしています（リスナーの名前は公開されません）</span></div>`}
    `}
  </div>`;
}

        ${THEME_PRESETS.map(p=>html`<button key=${p.id} role="radio" aria-checked=${isSel(p.id)} className=${"th-card"+(isSel(p.id)?" on":"")} onClick=${()=>pick(p.id)}>

      <div className="th-custom">
        ${[["accent","アクセントカラー","選択中の印・アイコン・リンクなど"],["bg","背景カラー","画面の背景（現在は暗い色のみ）"],["button","ボタンカラー","ボタン・タブの下線など"]].map(([k,l,h])=>html`<label key=${k} className="th-color">

      <div className="th-preview" aria-label="プレビュー">

        <div className="row norank" style=${{marginTop:6}}><${Cover} item=${{id:"p",hues:[270,230],pattern:1}} radius=${10}/><div style=${{minWidth:0}}><div className="t" style=${{color:"var(--accent-soft,#c9a8ff)"}}>再生中の曲</div><div className="sub"><span className="n">アーティスト名</span></div></div><span className="tag ok">公開中</span></div>

      <div className="sec-h"><div><span className="en">ACCOUNT</span><h2>アカウント</h2></div></div>
      <p className="hint">退会を申請すると、30日間の取り消し期間のあとにアカウントと投稿したデータを削除します。</p>

/* ---------- 楽曲の削除（投稿者本人）・退会（第5段階） ----------
   ・楽曲の削除：サーバーの delete_my_track で、本人の曲だけを1回の処理で削除（途中で失敗しても半分だけ消えない。再試行しても安全）
   ・退会：パスワードをサーバーで照合して本人確認 → 申請（すぐに非公開・30日間は取り消し可）→ 30日後にサーバー側で完全削除
   ・管理用の秘密キーはブラウザでは一切使いません */
const fmtDateTime = s => { const d=new Date(s); if(isNaN(d)) return ""; const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`; };
const accountApi = {
  async status(){
    if(!sb||!auth.user) return null;
    const {data,error} = await sb.rpc("my_account_deletion");
    if(error) return null;                      // v1.9 SQL 未実行時は「申請なし」として扱う
    return (data&&data[0])||null;
  },
  // 退会の申請：パスワードをサーバー（Edge Function「account-delete-request」）へ送り、
  // サーバーが Supabase の正式なログイン機能で照合してから申請する（ブラウザ側の判定には頼らない）
  async requestDeletion(password){
    if(!password) throw new Error("パスワードを入力してください");
    let res;
    try{ res = await sb.functions.invoke("account-delete-request",{body:{password}}); }
    catch(e){ throw new Error("申請できませんでした。通信状態を確認して、もう一度お試しください"); }
    const {data,error} = res||{};
    if(!error) return data||null;
    let body=null, status=0;
    try{ status = error.context&&error.context.status||0; body = error.context&&await error.context.json(); }catch(e){}
    const code = body&&body.code;
    throw new Error(code==="WRONG_PASSWORD" ? "パスワードが正しくありません"
      : code==="TOO_MANY_ATTEMPTS" ? "パスワードの確認に続けて失敗したため、1時間ほど時間をおいてからお試しください"
      : code==="ADMIN_ACCOUNT" ? "管理者アカウントは退会できません"
      : (code==="DELETION_DISABLED"||code==="NOT_ALLOWED") ? "アカウントの削除（退会）は、現在準備中です"
      : code==="LOGIN_REQUIRED" ? "ログインし直してから、もう一度お試しください"
      : (status===404||code==="NOT_CONFIGURED") ? "現在、退会の申請を受け付けられません（準備中）。時間をおいてお試しください"
      : "申請できませんでした。通信状態を確認して、もう一度お試しください");
  },
  async cancel(){
    const {data,error} = await sb.rpc("cancel_my_account_deletion");
    if(error){
      const m = error.message||"";
      throw new Error(/期限/.test(m) ? "取り消しの期限（申請から30日）を過ぎたため、取り消せません"
        : /取り消せません/.test(m) ? "完全削除の処理がすでに始まっているため、取り消せません"
        : /取り消せる退会申請がありません/.test(m) ? "取り消せる退会申請がありません"
        : "取り消せませんでした。通信状態を確認して、もう一度お試しください");
    }
    return (data&&data[0])||{restored:0,kept_hidden:0};
  },
  async deleteTrack(id){
    const {data,error} = await sb.rpc("delete_my_track",{p_track:id});
    if(error){
      const m = error.message||"";
      throw new Error(/見つかりません/.test(m) ? "楽曲が見つかりません（すでに削除されたか、ご自身の曲ではありません）"
        : /削除できません/.test(m) ? "現在、楽曲を削除できません（ログイン状態・利用状況を確認してください）"
        : /function|schema cache/i.test(m) ? "現在、楽曲を削除できません（準備中）。時間をおいてお試しください"
        : "削除できませんでした。通信状態を確認して、もう一度お試しください");
    }
    return data;   // "deleted" | "already_deleted"
  }
};

const statusLabel = st => st==="pending"?"審査待ち":st==="public"?"公開中":st==="hidden"?"非公開":"却下";
// 楽曲の削除の確認画面

// 退会手続き中の表示（マイページ・退会画面で共通）
function DeletionStatus({ctx}){
  const {profile,say,refreshAccount} = ctx;
  const d = profile&&profile.deletion;
  const [busy,setBusy] = useState(false);
  if(!d) return null;
  const cancel = async () => {
    setBusy(true);
    try{
      const r = await accountApi.cancel();
      await refreshAccount();
      say(r.kept_hidden>0 ? `退会を取り消しました。通報の確認中の曲（${r.kept_hidden}曲）は非公開のままです` : "退会を取り消しました。元の公開状態に戻しました");
    }catch(e){ say(e.message); await refreshAccount(); }
    setBusy(false);
  };
  return html`<div className="del-status" role="status">
    <div className="del-status-h"><${Icon} n="info" size=${18}/><b>${d.status==="pending"?"退会手続き中です":"アカウントの削除処理中です"}</b></div>
    ${d.status==="pending" ? html`<p>公開プロフィールと投稿した曲は非公開になっています。投稿・お気に入り・フォローなどの操作はできません。</p>
      <p><b>${fmtDateTime(d.purge_after)}</b> までは取り消せます。この日時を過ぎると、アカウントと投稿したデータの完全削除を始めます。</p>
      ${d.can_cancel ? html`<button className="btn primary" onClick=${cancel} disabled=${busy}>${busy?"取り消しています…":"退会を取り消す"}</button>`
        : html`<p>取り消しの期限を過ぎました。削除処理の開始をお待ちください。</p>`}`
    : html`<p>削除処理が完了するまで、数日かかる場合があります。処理中は取り消しできません。</p><p>完了するまで、この画面に「完了」とは表示されません（完了するとログインできなくなります）。</p>`}
  </div>`;
}

// 退会（アカウント削除）の画面
function AccountDeletePage({ctx}){
  const {goBack,user,profile,isAdmin,say,refreshAccount} = ctx;
  const [agree,setAgree] = useState(false);
  const [pw,setPw] = useState("");
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState("");
  const head = html`<header className="top"><button className="icon-btn" aria-label="戻る" onClick=${goBack}><${Icon} n="back"/></button><h1>アカウントの削除</h1></header>`;
  if(!user) return html`<div className="screen">${head}<div className="demo-note"><${Icon} n="info" size=${18}/><span>アカウントを削除するには、ログインしてください。</span></div></div>`;
  if(profile&&profile.deletion) return html`<div className="screen">${head}<${DeletionStatus} ctx=${ctx}/></div>`;
  if(!showAccountDeletion) return html`<div className="screen">${head}<div className="demo-note"><${Icon} n="info" size=${18}/><span>アカウントの削除（退会）は、現在準備中です。お急ぎの場合はお問い合わせ窓口（${LEGAL_CONTACT}）へご連絡ください。</span></div></div>`;
  const submit = async () => {
    setBusy(true); setErr("");
    try{
      const r = await accountApi.requestDeletion(pw);   // サーバーがパスワードを照合し、ほかの端末のログインも終了する
      setPw("");
      await refreshAccount();
      say(r ? `退会を申請しました。${fmtDateTime(r.purge_after)} まで取り消せます` : "退会を申請しました");
    }catch(e){ setErr(e.message||"申請できませんでした"); }
    setBusy(false);
  };
  return html`<div className="screen">${head}
    <section className="sec" style=${{marginTop:4}}>
      <p className="hint">退会を申請すると、次のように進みます。</p>
      <ol className="del-steps">
        <li><b>申請するとすぐ</b>：公開プロフィールと投稿した曲が非公開になり、投稿・お気に入り・フォローなどの操作ができなくなります。ほかの端末のログインも終了します。</li>
        <li><b>30日間</b>：ログインして「退会を取り消す」を押せば、元の状態（公開中だった曲は公開中）に戻せます。</li>
        <li><b>30日後</b>：アカウント、投稿した曲（音源・ジャケット）、アイコン・背景画像、お気に入り、フォロー、レビュー、通報の記録の削除を始めます。すべて終わるまで数日かかる場合があります。</li>
      </ol>
      <ul className="del-notes">
        <li>完全削除の後は、アプリから元に戻すことはできません。</li>
        <li>システムのバックアップや外部サービスの記録に、一定期間データが残る可能性があります（公開されることはありません）。</li>
        <li>同じメールアドレスで、あらためて会員登録することはできます（以前のデータは戻りません）。</li>
      </ul>
      ${isAdmin ? html`<div className="warn-line" style=${{marginTop:12}}><${Icon} n="info" size=${15}/><span>管理者アカウントは退会できません。</span></div>` : html`
      <button className=${"check"+(agree?" on":"")} role="checkbox" aria-checked=${agree} onClick=${()=>setAgree(!agree)} style=${{marginTop:10}}>
        <span className="box">${agree&&html`<${Icon} n="check" size=${14} sw=${3}/>`}</span><span>上記の内容を確認しました</span></button>
      <div className="field" style=${{marginTop:8}}><label htmlFor="del-pw">本人確認のため、パスワードを入力してください</label>
        <input id="del-pw" className="input" type="password" value=${pw} onInput=${e=>setPw(e.target.value)} autoComplete="current-password"/></div>
      ${err && html`<div className="warn-line" role="alert" style=${{marginTop:8}}><${Icon} n="info" size=${15}/><span>${err}</span></div>`}
      <div className="form" style=${{marginTop:14}}>
        <button className="btn danger" onClick=${submit} disabled=${busy||!agree||!pw}>${busy?"確認しています…":"退会を申請する"}</button>
        <button className="btn ghost" onClick=${goBack} disabled=${busy}>やめる</button>
      </div>`}
    </section>
  </div>`;
}

const legalText = s => String(s).split(/(【要確認[^】]*】)/).map((part,i)=> i%2 ? html`<mark key=${i} className="todo">${part}</mark>` : part);
// 規約などへのリンク（ログイン画面・マイページで使用）
function LegalLinks({openLegal, openGuide}){
  return html`<div className="legal-links" aria-label="使い方・規約とポリシー">
    ${openGuide && html`<button className="link" onClick=${openGuide}>使い方</button>`}
    ${LEGAL_DOCS.map(d=>html`<button key=${d.id} className="link" onClick=${()=>openLegal(d.id)}>${d.title}</button>`)}</div>`;
}
function LegalPage({ctx}){
  const {legalDoc,openLegal,goBack} = ctx;
  const doc = LEGAL_DOCS.find(d=>d.id===legalDoc)||LEGAL_DOCS[0];
  return html`<div className="screen">
    <header className="top"><button className="icon-btn" aria-label="戻る" onClick=${goBack}><${Icon} n="back"/></button><h1>規約・ポリシー</h1></header>
    <div className="tabs" style=${{marginTop:4}}>${LEGAL_DOCS.map(d=>html`<button key=${d.id} className=${d.id===doc.id?"on":""} aria-current=${d.id===doc.id?"page":undefined} onClick=${()=>{openLegal(d.id,true);window.scrollTo(0,0);}}>${d.tab}</button>`)}</div>
    <article className="legal">
      <h2 className="legal-title">${doc.title}</h2>
      ${(JSON.stringify(doc)+LEGAL_OPERATOR+LEGAL_CONTACT+LEGAL_DATE).includes("【要確認") && html`<div className="demo-note" style=${{marginTop:12}}><${Icon} n="info" size=${18}/><span>この文書は、法律専門家による確認前の草案です。色付きの「要確認」の箇所は、正式公開までに確定します。</span></div>`}
      <div className="legal-meta">${doc.meta.map((m,i)=>html`<div key=${i}>${legalText(m)}</div>`)}</div>
      ${doc.sections.map((s,i)=>html`<section key=${i}>
        <h3>${s.h}</h3>
        ${s.blocks.map((b,j)=>Array.isArray(b)
          ? html`<ul key=${j}>${b.map((li,k)=>html`<li key=${k}>${legalText(li)}</li>`)}</ul>`
          : html`<p key=${j}>${legalText(b)}</p>`)}
      </section>`)}
    </article>
  </div>`;
}

  const startSong = song => { setCurrentId(song.id); setPos(0); setPlaying(!!song.audioUrl); if(!song.audioUrl) say(NO_AUDIO); };

    if(currentId===song.id && (!label || label===queueLabel)){ if(!song.audioUrl){ say(NO_AUDIO); return; } setPlaying(p=>!p); return; }

    }
    return shuffleRef.current.order;
  };
  useEffect(()=>{ if(shuffle) shuffleOrder(true); },[shuffle]);

    }).catch(e=>say(/公開中の楽曲は削除できません/.test((e&&e.message)||"") ? "公開中の楽曲は削除できません。先に非公開にしてください" : e&&e.denied ? "権限がないため削除できませんでした" : "削除できませんでした。通信状態を確認して、もう一度お試しください"));
  };

  // 投稿者本人による削除のあと：一覧・再生キューから外す（サーバーで削除済み）
  const afterTrackDeleted = s => {
    repo.tracks.delete(s.id); repo.emit();
    setQueue(q=>q.filter(x=>x!==s.id)); if(currentId===s.id){ setCurrentId(null); setPlaying(false); setPlayerOpen(false); }
    say(`「${s.title}」を削除しました`);
  };
  // 退会の申請・取り消しのあと：状況と曲の一覧を読み直す
  const refreshAccount = async () => { await auth.loadProfile(); auth.emit(); await repo.refresh(); };
  const signOut = () => auth.signOut().then(()=>{ say("ログアウトしました"); navTo("home"); });
  // 歌詞の同期の編集画面：投稿者本人と管理者。編集中は下のプレーヤーを止める（編集画面の中で再生する）
  const openLyricsSync = s => { if(!s) return; if(!user){ say("ログインしてください"); return; } setPlaying(false); setPlayerOpen(false); setSyncSongId(s.id); go("lyricsync"); };
  const syncSong = useMemo(()=>{ const t=syncSongId&&tracks.find(x=>x.id===syncSongId); return t ? {...toSong(t),lyrics:Array.isArray(t.lyrics)?t.lyrics:[],mine:!!(user&&t.userId===user.id)} : null; },[syncSongId,tracks,user]);
  const getTime = () => { const a=audioRef.current; return (a && current && a.dataset.tid===current.id && isFinite(a.currentTime)) ? a.currentTime : pos; };
  const ctx = {playlists,publicPlaylists,playlistView,openPlaylist,playlistOps,withdrawing,refreshAccount,afterTrackDeleted,openAccountDelete:()=>go("account"),activeTheme,saveTheme,openSettings:()=>go("settings"),showWelcome:!user&&!welcomeHidden&&authState.ready,dismissWelcome,openGuide,openSignup,followView,openFollowList,followVer,myArtistIds,legalDoc,openLegal,afterProfileSave,adminResetImage,user,profile,isAdmin,myFollowers,signOut,say,recovery:authState.recovery,authReady:authState.ready,songs,allSongs,artists,artistOf,play,favs,toggleFav,follows,toggleFollow,openArtist,artistId,goBack,setTab:go,submit,submissions,decide,reports,resolveReport,report,setVisibility,removeSong,repoMode,
    current,playing,toggle,pos,seek,next,prev,repeat,cycleRepeat,shuffle,setShuffle,close:()=>setPlayerOpen(false),showLyrics,setShowLyrics,queueLabel,
    getTime,openLyricsSync,syncSong};

  useEffect(()=>{ document.body.style.overflow = playerOpen?"hidden":""; },[playerOpen]);

  const navItems = [["home","ホーム","home"],["search","検索","search"],["upload","投稿","plus"],["me","マイページ","user"]];
  const navActive = (tab==="artist"||tab==="follows")?(history[0]||"home"):(tab==="admin"||tab==="legal"||tab==="profile"||tab==="settings"||tab==="account"||tab==="lyricsync")?"me":tab==="guide"?(history[0]||"home"):tab;
  const Screen = {home:Home,search:Search,upload:Upload,me:MyPage,artist:Artist,admin:Admin,legal:LegalPage,profile:ProfileEdit,follows:FollowList,playlist:PlaylistPage,guide:GuidePage,settings:SettingsPage,account:AccountDeletePage,lyricsync:LyricsSyncPage}[tab];

  return html`<div className="app">
    ${!online && html`<div className="offline-bar" role="status"><${Icon} n="info" size=${15}/><span>オフラインです。曲の再生・検索・投稿にはインターネット接続が必要です（つながると自動で更新します）</span></div>`}
    <${Screen} key=${tab+(tab==="artist"?artistId:tab==="follows"?JSON.stringify(followView):"")} ctx=${ctx}/>
    ${current && !playerOpen && tab!=="lyricsync" && html`<${MiniPlayer} song=${current} artist=${artistOf(current)} playing=${playing} pos=${pos} toggle=${toggle} open=${()=>setPlayerOpen(true)} fav=${favs.has(current.id)} onFav=${()=>toggleFav(current.id)}/>`}
    <nav className="nav" aria-label="メインナビゲーション"><div className="nav-in">
      ${navItems.map(([k,l,ic])=>html`<button key=${k} className=${navActive===k?"on":""} onClick=${()=>navTo(k)} aria-current=${navActive===k?"page":undefined}>
        ${k==="upload"?html`<span className="up"><${Icon} n="plus" size=${20} sw=${2.4}/></span>`:html`<${Icon} n=${ic} size=${24} sw=${navActive===k?2.2:1.7}/>`}<span>${l}</span></button>`)}
    </div></nav>
    ${current && playerOpen && html`<${FullPlayer} ctx=${ctx}/>`}
    ${toast && html`<div className="toast" role="status">${toast}</div>`}
    <audio ref=${audioRef} preload="auto" playsInline onTimeUpdate=${e=>setPos(e.target.currentTime)} onEnded=${()=>nextRef.current(true)}
      onPlay=${()=>{ if(!playingRef.current) setPlaying(true); }}
      onPause=${e=>{ const a=e.target; setTimeout(()=>{ if(a.paused && !a.ended && playingRef.current && a.dataset.tid===currentIdRef.current) setPlaying(false); },0); }}
      onError=${e=>{ const a=e.target; if(current&&current.audioUrl&&a.dataset.tid===current.id&&a.dataset.src!==current.audioUrl){ const t=a.currentTime; a.src=current.audioUrl; a.dataset.src=current.audioUrl; a.addEventListener("loadedmetadata",()=>{ try{ a.currentTime=t; }catch(_){} if(playing) a.play().catch(()=>{}); },{once:true}); } }}
      onLoadedMetadata=${e=>{const d=Math.round(e.target.duration); const t=current&&tracks.find(x=>x.id===current.id); if(t&&isFinite(d)&&d>0&&!t.duration) repo.setDuration(t.id,d,!!(user&&(t.userId===user.id||isAdmin))).catch(()=>{});}}></audio>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>

</body></html>
